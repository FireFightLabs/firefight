name: Set up the runner without the CI image
description: >-
  Installs what the CI image would have provided, for a run that cannot use it, such as a pull request from a fork
  that changes a dependency before the image for it exists.
inputs:
  node:
    description: Also install Node and the JavaScript packages
    default: "false"
  packages:
    description: Also install the system libraries the app loads
    default: "false"
  browser:
    description: Also install the Playwright sandbox/browser pins and its Chromium, for test/sandbox
    default: "false"
runs:
  using: composite
  steps:
    - name: Install packages
      if: inputs.packages == 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libsodium23 libvips

    - name: Set up Ruby
      uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        bundler-cache: true

    - name: Set up Node
      if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm

    - name: Install JavaScript dependencies
      if: inputs.node == 'true'
      shell: bash
      run: npm ci

    - name: Install Halon's browser
      if: inputs.browser == 'true'
      shell: bash
      run: |
        npm ci --prefix sandbox/browser --no-fund --no-audit
        npx --prefix sandbox/browser playwright install --with-deps chromium
