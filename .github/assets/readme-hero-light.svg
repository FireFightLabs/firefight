<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-weight="700" fill="#131512" letter-spacing="-1.5"><text x="62" y="252" font-size="60">Halon investigates</text><text x="62" y="322" font-size="60">your incidents and</text><text x="62" y="392" font-size="60"><tspan fill="#4f8a2e">fixes them</tspan>.</text></g>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="21" fill="#3b3f38"><text x="64" y="446">It works in Slack, asks before it changes anything,</text><text x="64" y="476">and runs inside a full incident platform you can host.</text></g>
