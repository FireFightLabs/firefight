name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lockfile_guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Gemfile.lock must not reference the private cloud gem
        run: |
          if grep -q "firefight_cloud" Gemfile.lock; then
            echo "::error::Gemfile.lock references firefight_cloud — the private cloud gem must never be committed to the public lock. Re-run 'bundle install' without FIREFIGHT_CLOUD set."
            exit 1
          fi

  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  archspec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Architecture boundaries hold with no grandfathered exceptions
        run: |
          if ruby -ryaml -e 'exit(YAML.safe_load_file("archspec_todo.yml").fetch("violations").empty? ? 0 : 1)'; then
            :
          else
            echo "::error::archspec_todo.yml lists violations. The grandfathered list was emptied on 2026-08-25 and stays empty: a new boundary violation means the code is in the wrong place."
            exit 1
          fi
          bundle exec archspec check

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    # GitHub's runners have four cores, so the suite is split across machines that run at once. Files are dealt round
    # robin by name, so a shard holds the same files on every run.
    strategy:
      fail-fast: false
      matrix:
        shard: [ 0, 1, 2, 3 ]

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Controller tests render the page layout, which loads the built assets.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # Built once up front. Otherwise each parallel worker that renders a page builds on its own, and one reads the
      # manifest while another rewrites it, which fails random tests with an empty page.
      - name: Build assets
        env:
          RAILS_ENV: test
        run: bin/vite build

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: |
          bin/rails db:test:prepare
          # test/system runs in the system-test job.
          files=$(find test -name '*_test.rb' -not -path 'test/system/*' | sort | awk -v shard=${{ matrix.shard }} '(NR - 1) % 4 == shard')
          bin/rails test $files
          if [ "${{ matrix.shard }}" = "0" ]; then bin/rails test engines/firefight_ai/test; fi

  system-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [ 0, 1, 2 ]

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # A system test renders the real page, so the assets have to be buildable.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: |
          bin/rails db:test:prepare
          files=$(find test/system -name '*_test.rb' | sort | awk -v shard=${{ matrix.shard }} '(NR - 1) % 3 == shard')
          bin/rails test $files

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots-${{ matrix.shard }}
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
