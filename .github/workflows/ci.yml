name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: read

env:
  CI_IMAGE: ghcr.io/firefightlabs/firefight-ci

jobs:
  # Every other job runs inside the CI image, so it starts with Ruby, the gems, Node, the JavaScript packages and
  # Chrome in place. The image is tagged with a hash of what goes into it and built only when that tag is new. A pull
  # request from a fork cannot push, so when its tag is missing the image output is empty and each job sets up the
  # runner itself instead.
  ci-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Look for the image
        id: tag
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ hashFiles('.github/ci/Dockerfile', 'Gemfile.lock', 'package-lock.json', '.ruby-version') }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ruby=$(sed 's/^ruby-//' .ruby-version)" >> "$GITHUB_OUTPUT"
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin > /dev/null 2>&1 || true
          if docker manifest inspect "$CI_IMAGE:$tag" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.tag.outputs.exists == 'false' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.tag.outputs.exists == 'false' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: build
        if: steps.tag.outputs.exists == 'false' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/ci/Dockerfile
          build-args: RUBY_VERSION=${{ steps.tag.outputs.ruby }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.CI_IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,scope=ci-image,mode=max

      - name: Hand the image to the other jobs
        id: image
        run: |
          if [ "${{ steps.tag.outputs.exists }}" = "true" ] || [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "image=$CI_IMAGE:${{ steps.tag.outputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The CI image for this change is not built yet and this run cannot push it, so each job sets up the runner itself."
          fi

  # The frontend is built once here and handed to every test job. Otherwise each would spend the same time building
  # it again. The build is also kept between runs, keyed by everything Vite Ruby watches, so a change that leaves the
  # frontend alone does not build it at all.
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Reuse an earlier build of the same frontend
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            public/vite-test
            tmp/cache/vite
          key: vite-test-${{ hashFiles('app/frontend/**', 'config/vite.json', 'package.json', 'package-lock.json', 'vite.config.ts', 'tsconfig*.json', 'Gemfile.lock') }}

      - name: Set up the build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/host-setup
        with:
          node: "true"

      - name: Build assets
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          RAILS_ENV: test
        run: bin/vite build

      # Vite Ruby's record of the build travels with it, so the test jobs see the build as fresh and never start their
      # own.
      - name: Keep the build for the test jobs
        uses: actions/upload-artifact@v7
        with:
          name: vite-test
          path: |
            public/vite-test
            tmp/cache/vite
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  lockfile_guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Gemfile.lock must not reference the private cloud gem
        run: |
          if grep -q "firefight_cloud" Gemfile.lock; then
            echo "::error::Gemfile.lock references firefight_cloud — the private cloud gem must never be committed to the public lock. Re-run 'bundle install' without FIREFIGHT_CLOUD set."
            exit 1
          fi

  scan_ruby:
    needs: ci-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up the runner
        if: needs.ci-image.outputs.image == ''
        uses: ./.github/actions/host-setup

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  archspec:
    needs: ci-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up the runner
        if: needs.ci-image.outputs.image == ''
        uses: ./.github/actions/host-setup

      - name: Architecture boundaries hold with no grandfathered exceptions
        run: |
          if ruby -ryaml -e 'exit(YAML.safe_load_file("archspec_todo.yml").fetch("violations").empty? ? 0 : 1)'; then
            :
          else
            echo "::error::archspec_todo.yml lists violations. The grandfathered list was emptied on 2026-08-25 and stays empty: a new boundary violation means the code is in the wrong place."
            exit 1
          fi
          bundle exec archspec check

  lint:
    needs: ci-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up the runner
        if: needs.ci-image.outputs.image == ''
        uses: ./.github/actions/host-setup

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test-shard:
    needs: [ ci-image, assets ]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # GitHub's runners have four cores, so the suite is split across machines that run at once. Files are dealt round
    # robin by name, so a shard holds the same files on every run.
    strategy:
      fail-fast: false
      matrix:
        shard: [ 0, 1, 2, 3 ]

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=1s --health-timeout=5s --health-retries=30

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up the runner
        if: needs.ci-image.outputs.image == ''
        uses: ./.github/actions/host-setup
        with:
          node: "true"
          packages: "true"

      - name: Use the image's JavaScript packages
        if: needs.ci-image.outputs.image != ''
        run: ln -s /opt/ci/node_modules node_modules

      # Controller tests render the page layout, which loads the built assets. They come built from the assets job.
      # Building here instead would also race, since each parallel worker that renders a page would build on its own.
      - name: Fetch the built assets
        uses: actions/download-artifact@v8
        with:
          name: vite-test

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@${{ needs.ci-image.outputs.image != '' && 'postgres' || 'localhost' }}:5432
        run: |
          bin/rails db:test:prepare
          # test/system runs in the system-test job.
          files=$(find test -name '*_test.rb' -not -path 'test/system/*' | sort | awk -v shard=${{ matrix.shard }} '(NR - 1) % 4 == shard')
          bin/rails test $files
          if [ "${{ matrix.shard }}" = "0" ]; then bin/rails test engines/firefight_ai/test; fi

  # Branch protection requires a check named test, which a matrix job never reports under that name.
  test:
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every test shard passed
        run: test "${{ needs.test-shard.result }}" = "success"

  system-test-shard:
    needs: [ ci-image, assets ]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Chrome keeps its shared memory in /dev/shm, which Docker caps at 64MB.
      options: --shm-size=2g
    strategy:
      fail-fast: false
      matrix:
        shard: [ 0, 1, 2 ]

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=1s --health-timeout=5s --health-retries=30

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up the runner
        if: needs.ci-image.outputs.image == ''
        uses: ./.github/actions/host-setup
        with:
          node: "true"
          packages: "true"

      - name: Use the image's JavaScript packages
        if: needs.ci-image.outputs.image != ''
        run: ln -s /opt/ci/node_modules node_modules

      - name: Fetch the built assets
        uses: actions/download-artifact@v8
        with:
          name: vite-test

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@${{ needs.ci-image.outputs.image != '' && 'postgres' || 'localhost' }}:5432
        run: |
          bin/rails db:test:prepare
          files=$(find test/system -name '*_test.rb' | sort | awk -v shard=${{ matrix.shard }} '(NR - 1) % 3 == shard')
          bin/rails test $files

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots-${{ matrix.shard }}
          path: tmp/screenshots
          if-no-files-found: ignore

  # Branch protection requires a check named system-test, which a matrix job never reports under that name.
  system-test:
    needs: system-test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every system test shard passed
        run: test "${{ needs.system-test-shard.result }}" = "success"
