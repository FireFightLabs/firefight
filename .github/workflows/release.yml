name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, semver without the v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate version
        id: v
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be semver like 0.1.0 (no leading v)"
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tag the release (triggers the Northflank deploy release flow)
        run: |
          git tag -a "${{ steps.v.outputs.tag }}" -m "Release ${{ steps.v.outputs.tag }}"
          git push origin "${{ steps.v.outputs.tag }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=latest

      - name: Build and push self-host image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Draft GitHub release with upgrade notes template
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/upgrade-notes.md <<'NOTES'
          ## Upgrade notes

          - Run `bin/rails db:prepare` after upgrading.
          <!-- Before publishing: list any new required env vars (see .env.example),
               breaking changes, or manual steps. Delete this comment. -->

          ## Image

          ```
          docker pull ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
          ```
          NOTES
          gh release create "${{ steps.v.outputs.tag }}" \
            --draft \
            --generate-notes \
            --notes-file /tmp/upgrade-notes.md \
            --title "${{ steps.v.outputs.tag }}"
