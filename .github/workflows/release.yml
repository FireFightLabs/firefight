name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version, semver without v (e.g. 0.1.0). Leave blank to auto-bump."
        required: false
        type: string
      bump:
        description: "Bump level when no explicit version is given"
        required: false
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          set -euo pipefail
          INPUT="${{ inputs.version }}"
          if [ -n "$INPUT" ]; then
            # Explicit version wins.
            VERSION="$INPUT"
            if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Version must be semver like 0.1.0 (no leading v)"
              exit 1
            fi
          else
            # Auto-bump from the latest v* tag (0.0.0 if there are none yet).
            LATEST="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"
            LATEST="${LATEST#v}"
            LATEST="${LATEST:-0.0.0}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            case "${{ inputs.bump }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *)     PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          echo "Releasing v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The tag push is the deploy: Northflank builds and ships the tagged commit.
      # Commits to main on their own deploy nothing.
      - name: Tag the release
        run: |
          git tag -a "${{ steps.v.outputs.tag }}" -m "Release ${{ steps.v.outputs.tag }}"
          git push origin "${{ steps.v.outputs.tag }}"

  # Self-host image for GHCR, public repo only. Each platform builds on its own
  # native runner in parallel, then the digests merge into one multi-arch tag.
  image:
    if: github.event.repository.visibility == 'public'
    needs: tag
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      build-args: |
        SERVICE_VERSION=${{ needs.tag.outputs.version }}
      set-meta-labels: true
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=raw,value=${{ needs.tag.outputs.version }}
        type=raw,value=latest
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: [tag, image]
    # Draft even when the image job is skipped (private repo), never after a failed build.
    if: always() && needs.tag.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.image.result)
    runs-on: ubuntu-latest

    steps:
      - name: Draft GitHub release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/upgrade-notes.md <<'NOTES'
          ## Upgrade notes

          - Migrations run automatically on deploy (`bin/rails db:prepare`).
          <!-- Before publishing: list any new required env vars (see .env.example),
               breaking changes, or manual steps, then delete this comment. -->

          ## Self-host image

          ```
          docker pull ghcr.io/${{ github.repository }}:${{ needs.tag.outputs.version }}
          ```
          NOTES
          gh release create "${{ needs.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft \
            --generate-notes \
            --notes-file /tmp/upgrade-notes.md \
            --title "${{ needs.tag.outputs.tag }}"
