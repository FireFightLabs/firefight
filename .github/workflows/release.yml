name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write
  packages: write

jobs:
  build_image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  draft_release:
    runs-on: ubuntu-latest
    needs: build_image

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Draft GitHub release with upgrade notes template
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > /tmp/upgrade-notes.md <<'NOTES'
          ## Upgrade notes

          - Run `bin/rails db:prepare` after upgrading.
          <!-- Before publishing: list any new required env vars (see .env.example),
               breaking changes, or manual steps. Delete this comment. -->

          ## Image

          ```
          docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          ```
          NOTES
          gh release create "$TAG" \
            --draft \
            --generate-notes \
            --notes-file /tmp/upgrade-notes.md \
            --title "$TAG"
