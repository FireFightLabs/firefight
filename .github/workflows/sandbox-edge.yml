name: Sandbox edge image

# The box Halon reads code in, built from main whenever it changes, so production can move to a new box before the next
# release. Tagged with the commit and edge. The release workflow alone moves latest and the version tags.
on:
  push:
    branches: [main]
    paths:
      - "sandbox/**"
      - ".github/workflows/sandbox-edge.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: sandbox-edge
  cancel-in-progress: true

jobs:
  sandbox-image:
    if: github.event.repository.visibility == 'public'
    uses: docker/github-builder/.github/workflows/build.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      context: sandbox
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      set-meta-labels: true
      meta-images: ghcr.io/${{ github.repository }}-sandbox
      meta-tags: |
        type=sha,format=long,prefix=
        type=raw,value=edge
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
