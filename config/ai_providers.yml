# The model providers a workspace can add as its own AI account, under Settings, Workspace. RubyLLM says what each one
# needs (its configuration options and requirements), so this file only adds what RubyLLM cannot know: the name people
# know the provider by, the models Firefight recommends for Halon's main work (investigations, chats, postmortems) and
# its quick work (summaries, milestones, mention replies), and what each setting is called on the form. A provider that
# is not listed here is not offered. A local provider (RubyLLM's local?) is offered only where Entitlements allows
# private AI endpoints, which an install someone runs themselves does and Firefight's cloud does not.
#
# A recommended model must be one RubyLLM's catalog holds for the provider, with tool calling and a known size, which
# test/models/ai_providers_test.rb checks. Providers whose models are named by whoever runs them (an Azure deployment, a
# local Ollama or GPUStack) recommend none.
#
# code_fix is the model a code fix's coding agent writes with, where the provider recommends one of its own for code.
# It is used only while the registry holds it for the provider with a price, since a code fix's budget is counted in
# what its model costs, and otherwise the account's main model writes code fixes. It can be newer than the catalog
# RubyLLM ships, since the nightly refresh is what brings it into the registry.
anthropic:
  name: Anthropic
  main: claude-sonnet-5
  fast: claude-haiku-4-5
  code_fix: claude-opus-5-5
openai:
  name: OpenAI
  main: gpt-5.6
  fast: gpt-5.4-mini
  # Sign in with ChatGPT, behind FeatureFlags::CHATGPT_SIGN_IN. Every address comes from the environment, so nothing
  # about the endpoint is assumed here.
  sign_in:
    label: Sign in with ChatGPT
    client_id_env: CHATGPT_OAUTH_CLIENT_ID
    authorize_url_env: CHATGPT_OAUTH_AUTHORIZE_URL
    token_url_env: CHATGPT_OAUTH_TOKEN_URL
    scopes_env: CHATGPT_OAUTH_SCOPES
    api_base_env: CHATGPT_API_BASE
gemini:
  name: Google Gemini
  main: gemini-3.1-pro-preview
  fast: gemini-3.5-flash
vertexai:
  name: Google Vertex AI
  main: gemini-3.1-pro-preview
  fast: gemini-2.5-flash
bedrock:
  name: Amazon Bedrock
  main: anthropic.claude-sonnet-5
  fast: anthropic.claude-haiku-4-5-20251001-v1:0
  labels:
    api_key: Access key ID
azure:
  name: Azure AI Foundry
openrouter:
  name: OpenRouter
  main: anthropic/claude-sonnet-5
  fast: anthropic/claude-haiku-4.5
  code_fix: anthropic/claude-opus-5.5
deepseek:
  name: DeepSeek
  main: deepseek-v4-pro
  fast: deepseek-v4-flash
mistral:
  name: Mistral
  main: mistral-large-latest
  fast: mistral-small-latest
xai:
  name: xAI
  main: grok-4.6
  fast: grok-4.20-0309-non-reasoning
ollama:
  name: Ollama
gpustack:
  name: GPUStack

# What each setting is called on the form. A setting RubyLLM declares that is not here is not asked for, such as a
# batch bucket or a guardrail, which Halon never uses.
settings:
  api_key: API key
  secret_key: Secret access key
  session_token: Session token
  service_account_key: Service account key (JSON)
  ai_auth_token: Entra ID token
  api_base: API base URL
  region: Region
  location: Location
  project_id: Project ID
  organization_id: Organization ID

# The models a person can switch a dashboard chat to, per provider, in the order the picker lists them, cheapest first.
# label is what the picker and each reply call the model, and note says in a few words what it is good for. A model is
# offered only while the registry holds it for the provider with a price and a size, so one newer than the catalog
# RubyLLM ships appears once the nightly refresh brings it in. The workspace's main model is always offered, listed here
# or not. Providers whose models are named by whoever runs them offer none.
chat_models:
  anthropic:
    - { model: claude-haiku-4-5, label: Claude Haiku 4.5, note: "Fast and low cost" }
    - { model: claude-sonnet-5-5, label: Claude Sonnet 5.5, note: "Strong and quick at a mid price" }
    - { model: claude-opus-5-5, label: Claude Opus 5.5, note: "Strongest, slower and pricier" }
  openai:
    - { model: gpt-6-luna, label: GPT-6 Luna, note: "Fast and low cost" }
    - { model: gpt-6-sol, label: GPT-6 Sol, note: "Careful reasoning at a mid price" }
    - { model: gpt-6-astra, label: GPT-6 Astra, note: "Strongest, slower and pricier" }
  gemini:
    - { model: gemini-3.8-flash, label: Gemini 3.8 Flash, note: "Fast and low cost" }
    - { model: gemini-3.1-pro-preview, label: Gemini 3.1 Pro, note: "Strongest, slower and pricier" }
  vertexai:
    - { model: gemini-3.8-flash, label: Gemini 3.8 Flash, note: "Fast and low cost" }
    - { model: gemini-3.1-pro-preview, label: Gemini 3.1 Pro, note: "Strong reasoning at a mid price" }
    - { model: claude-sonnet-5-5, label: Claude Sonnet 5.5, note: "Strong and quick at a mid price" }
    - { model: claude-opus-5-5, label: Claude Opus 5.5, note: "Strongest, slower and pricier" }
  bedrock:
    - { model: anthropic.claude-sonnet-5-5, label: Claude Sonnet 5.5, note: "Strong and quick at a mid price" }
    - { model: openai.gpt-6-sol, label: GPT-6 Sol, note: "Careful reasoning at a mid price" }
    - { model: anthropic.claude-opus-5-5, label: Claude Opus 5.5, note: "Strongest, slower and pricier" }
  openrouter:
    - { model: deepseek/deepseek-v4-pro, label: DeepSeek V4 Pro, note: "Lowest cost, reads text only" }
    - { model: z-ai/glm-5.2, label: GLM-5.2, note: "Fast and low cost for everyday questions" }
    - { model: anthropic/claude-sonnet-5.5, label: Claude Sonnet 5.5, note: "Strong and quick at a mid price" }
    - { model: openai/gpt-6-sol, label: GPT-6 Sol, note: "Careful reasoning at a mid price" }
    - { model: anthropic/claude-opus-5.5, label: Claude Opus 5.5, note: "Strongest, slower and pricier" }
  deepseek:
    - { model: deepseek-v4-flash, label: DeepSeek V4 Flash, note: "Fast and lowest cost" }
    - { model: deepseek-v4-pro, label: DeepSeek V4 Pro, note: "Stronger, still low cost" }
  mistral:
    - { model: mistral-medium-latest, label: Mistral Medium, note: "Fast and low cost" }
    - { model: mistral-large-4, label: Mistral Large 4, note: "Strongest, still low cost" }
  xai:
    - { model: grok-4.3, label: Grok 4.3, note: "Fast and low cost" }
    - { model: grok-4.7, label: Grok 4.7, note: "Strongest, slower and pricier" }
