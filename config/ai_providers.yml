# The model providers a workspace can add as its own AI account, under Settings, Workspace. RubyLLM says what each one
# needs (its configuration options and requirements), so this file only adds what RubyLLM cannot know: the name people
# know the provider by, the models Firefight recommends and what each setting is called on the form. A provider that is
# not listed here is not offered. A local provider (RubyLLM's local?) is offered only where Entitlements allows private
# AI endpoints, which an install someone runs themselves does and Firefight's cloud does not.
#
# main is the model Halon's own loop runs on: chats, investigations and what grows from them. Claude Sonnet 5.5 leads
# wherever the provider runs it, since it did Halon's work best for the money. fast is the quick model for side jobs and
# helpers (summaries, milestones, mention replies, judging a watch or a memory), Claude Haiku 5.5 wherever the provider
# runs it. backup is what the loop carries on with when the main model stops answering or is not available to the
# account, the same Claude Haiku 5.5, and a provider with none carries on with its main model.
#
# Each may list several, preferred first. The first one the registry holds for the provider with a price is used, and
# main and backup need a known size too, so a model newer than the catalog RubyLLM ships is picked up once a refresh
# brings it in. One passed over for a later one is logged and asks for a refresh (AiProviders.passed_over). The last of main and fast must be one RubyLLM's catalog holds, with tool calling and a known
# size, which test/models/ai_providers_test.rb checks, so there is always one to fall back to. fast and backup list
# models tried in turn when the provider says one is not there for the account, and each may itself be a list read the
# same way. That is how a Vertex AI project without Claude enabled ends on Gemini. Providers whose models are named by whoever runs them (an Azure deployment, a local Ollama or
# GPUStack) recommend none.
#
# The deployment's own keys follow the same picks when no env var names a model (FirefightAi.deployment_model_for).
#
# code_fix is the model a code fix's coding agent writes with, and code_review the model that reads the change before
# it is pushed and can send it back, where the provider recommends its own for code. A code fix makes dozens of calls
# on a growing session, so the writer is the everyday Sonnet and the stronger Opus spends one call reading the result.
# Each may list several, preferred first, and the first the registry holds for the provider with a price is used, since
# a code fix's budget is counted in what its model costs. Without one the account's main model writes code fixes, and
# the review runs on the model that wrote the change. Either can be newer than the catalog RubyLLM ships, since the
# nightly refresh is what brings it into the registry.
anthropic:
  name: Anthropic
  main: [ claude-sonnet-5-5, claude-sonnet-5 ]
  fast: [ [ claude-haiku-5-5, claude-haiku-4-5 ] ]
  backup: [ [ claude-haiku-5-5, claude-haiku-4-5 ] ]
  code_fix: [ claude-sonnet-5-5, claude-sonnet-5 ]
  code_review: claude-opus-5-5
openai:
  name: OpenAI
  main: gpt-5.6
  fast: gpt-5.4-mini
  # Sign in with ChatGPT, behind FeatureFlags::CHATGPT_SIGN_IN. Every address comes from the environment, so nothing
  # about the endpoint is assumed here.
  sign_in:
    label: Sign in with ChatGPT
    client_id_env: CHATGPT_OAUTH_CLIENT_ID
    authorize_url_env: CHATGPT_OAUTH_AUTHORIZE_URL
    token_url_env: CHATGPT_OAUTH_TOKEN_URL
    scopes_env: CHATGPT_OAUTH_SCOPES
    api_base_env: CHATGPT_API_BASE
gemini:
  name: Google Gemini
  main: gemini-3.1-pro-preview
  fast: gemini-3.5-flash
vertexai:
  name: Google Vertex AI
  main: [ claude-sonnet-5-5, claude-sonnet-5 ]
  # Claude runs on Vertex AI only where the project has it enabled, so Gemini comes last.
  fast: [ [ claude-haiku-5-5, claude-haiku-4-5 ], gemini-3.8-flash ]
  backup: [ [ claude-haiku-5-5, claude-haiku-4-5 ], gemini-3.1-pro-preview ]
bedrock:
  name: Amazon Bedrock
  main: [ anthropic.claude-sonnet-5-5, anthropic.claude-sonnet-5 ]
  fast: [ [ anthropic.claude-haiku-5-5, anthropic.claude-haiku-4-5-20251001-v1:0 ] ]
  backup: [ [ anthropic.claude-haiku-5-5, anthropic.claude-haiku-4-5-20251001-v1:0 ] ]
  labels:
    api_key: Access key ID
azure:
  name: Azure AI Foundry
openrouter:
  name: OpenRouter
  main: [ anthropic/claude-sonnet-5.5, anthropic/claude-sonnet-5 ]
  fast: [ [ anthropic/claude-haiku-5.5, anthropic/claude-haiku-4.5 ] ]
  backup: [ [ anthropic/claude-haiku-5.5, anthropic/claude-haiku-4.5 ] ]
  code_fix: [ anthropic/claude-sonnet-5.5, anthropic/claude-sonnet-5 ]
  code_review: anthropic/claude-opus-5.5
deepseek:
  name: DeepSeek
  main: deepseek-v4-pro
  fast: deepseek-flash
  # DeepSeek charges twice its off-peak price at peak, for every model and every kind of token, and the registry holds
  # the off-peak price. Peak is 01:00 to 04:00 and 06:00 to 10:00 UTC, Monday to Friday, and a Chinese public holiday is
  # off-peak all day. Those hours fall on the same date in Beijing. Each holiday is a first and last date, from the
  # State Council's notice for the year, which comes out each November.
  peak_pricing:
    multiplier: 2
    days: [ monday, tuesday, wednesday, thursday, friday ]
    hours: [ [ 1, 4 ], [ 6, 10 ] ]
    off_peak_dates:
      - [ "2026-01-01", "2026-01-03" ]
      - [ "2026-02-15", "2026-02-23" ]
      - [ "2026-04-04", "2026-04-06" ]
      - [ "2026-05-01", "2026-05-05" ]
      - [ "2026-06-19", "2026-06-21" ]
      - [ "2026-09-25", "2026-09-27" ]
      - [ "2026-10-01", "2026-10-07" ]
mistral:
  name: Mistral
  main: mistral-large-latest
  fast: glm-5-2
  backup: glm-5-2
xai:
  name: xAI
  main: grok-4.6
  fast: grok-4.20-0309-non-reasoning
# Z.AI, MiniMax and Qwen each serve a region from an address of its own, and a key works only where it was
# made, so the form asks for the region by the names in regions, the first being where it starts. Their models and
# prices are FirefightAi::Providers', since RubyLLM's catalog holds none of them.
zai:
  name: Z.AI
  main: glm-5.3
  fast: glm-5.3-flash
  regions:
    global: Global (api.z.ai)
    china: China, BigModel (open.bigmodel.cn)
minimax:
  name: MiniMax
  main: MiniMax-M3
  fast: MiniMax-M3.1-Flash
  regions:
    global: Global (api.minimax.io)
    china: China (api.minimax.cn)
qwen:
  name: Qwen
  main: qwen3.8-max
  fast: qwen3.8-flash
  # QwenCloud's regions first, then Alibaba Cloud Model Studio's, whose Frankfurt and Tokyo addresses carry the
  # workspace's ID.
  regions:
    ap-southeast-1: QwenCloud, Singapore (ap-southeast-1.maas.qwencloudapi.com)
    us-east-1: QwenCloud, US Virginia (us-east-1.maas.qwencloudapi.com)
    eu-central-1: QwenCloud, Germany Frankfurt (eu-central-1.maas.qwencloudapi.com)
    ap-northeast-1: QwenCloud, Japan Tokyo (ap-northeast-1.maas.qwencloudapi.com)
    cn-hongkong: QwenCloud, China Hong Kong (cn-hongkong.maas.qwencloudapi.com)
    cn-beijing: QwenCloud, China Beijing (cn-beijing.maas.qwencloudapi.com)
    alibaba-ap-southeast-1: Alibaba Cloud Model Studio, Singapore (dashscope-intl.aliyuncs.com)
    alibaba-us-east-1: Alibaba Cloud Model Studio, US Virginia (dashscope-us.aliyuncs.com)
    alibaba-eu-central-1: Alibaba Cloud Model Studio, Germany Frankfurt (your workspace's address)
    alibaba-ap-northeast-1: Alibaba Cloud Model Studio, Japan Tokyo (your workspace's address)
    alibaba-cn-hongkong: Alibaba Cloud Model Studio, China Hong Kong (cn-hongkong.dashscope.aliyuncs.com)
    alibaba-cn-beijing: Alibaba Cloud Model Studio, China Beijing (dashscope.aliyuncs.com)
ollama:
  name: Ollama
gpustack:
  name: GPUStack

# What each setting is called on the form. A setting RubyLLM declares that is not here is not asked for, such as a
# batch bucket or a guardrail, which Halon never uses.
settings:
  api_key: API key
  secret_key: Secret access key
  session_token: Session token
  service_account_key: Service account key (JSON)
  ai_auth_token: Entra ID token
  api_base: API base URL
  region: Region
  location: Location
  project_id: Project ID
  organization_id: Organization ID
  workspace_id: Workspace ID

# The models a person can switch a dashboard chat to, per provider, in the order the picker lists them, everyday models
# first. label is what the picker and each reply call the model, and note says in a few words what it is for. Only the
# model that costs clearly more says so. A model is offered only while the registry holds it for the provider with a
# price and a size, so one newer than the catalog RubyLLM ships appears once the nightly refresh brings it in. The
# workspace's main model is always offered, listed here or not. Providers whose models are named by whoever runs them
# offer none.
chat_models:
  anthropic:
    - { model: claude-haiku-5-5, label: Claude Haiku 5.5, note: "Everyday questions" }
    - { model: claude-sonnet-5-5, label: Claude Sonnet 5.5, note: "Investigations and tricky problems" }
    - { model: claude-opus-5-5, label: Claude Opus 5.5, note: "Hardest problems and production changes, costs more" }
  openai:
    - { model: gpt-6-luna, label: GPT-6 Luna, note: "Everyday questions" }
    - { model: gpt-6-sol, label: GPT-6 Sol, note: "Investigations and tricky problems" }
    - { model: gpt-6-astra, label: GPT-6 Astra, note: "Hardest problems and production changes, costs more" }
  gemini:
    - { model: gemini-3.8-flash, label: Gemini 3.8 Flash, note: "Everyday questions" }
    - { model: gemini-3.1-pro-preview, label: Gemini 3.1 Pro, note: "Investigations and tricky problems" }
  vertexai:
    - { model: claude-haiku-5-5, label: Claude Haiku 5.5, note: "Everyday questions" }
    - { model: gemini-3.8-flash, label: Gemini 3.8 Flash, note: "Everyday questions" }
    - { model: claude-sonnet-5-5, label: Claude Sonnet 5.5, note: "Investigations and tricky problems" }
    - { model: gemini-3.1-pro-preview, label: Gemini 3.1 Pro, note: "Investigations and tricky problems" }
    - { model: claude-opus-5-5, label: Claude Opus 5.5, note: "Hardest problems and production changes, costs more" }
  bedrock:
    - { model: anthropic.claude-haiku-5-5, label: Claude Haiku 5.5, note: "Everyday questions" }
    - { model: anthropic.claude-sonnet-5-5, label: Claude Sonnet 5.5, note: "Investigations and tricky problems" }
    - { model: openai.gpt-6-sol, label: GPT-6 Sol, note: "Investigations and tricky problems" }
    - { model: anthropic.claude-opus-5-5, label: Claude Opus 5.5, note: "Hardest problems and production changes, costs more" }
  openrouter:
    - { model: anthropic/claude-haiku-5.5, label: Claude Haiku 5.5, note: "Everyday questions" }
    - { model: z-ai/glm-5.3-flash, label: GLM-5.3 Flash, note: "Everyday questions" }
    - { model: z-ai/glm-5.2, label: GLM-5.2, note: "Everyday questions" }
    - { model: deepseek/deepseek-v4.1-flash, label: DeepSeek V4.1 Flash, note: "Everyday questions" }
    - { model: deepseek/deepseek-v4-pro, label: DeepSeek V4 Pro, note: "Everyday questions, reads text only" }
    - { model: anthropic/claude-sonnet-5.5, label: Claude Sonnet 5.5, note: "Investigations and tricky problems" }
    - { model: z-ai/glm-5.3, label: GLM-5.3, note: "Investigations and tricky problems, reads text only" }
    - { model: openai/gpt-6-sol, label: GPT-6 Sol, note: "Investigations and tricky problems" }
    - { model: anthropic/claude-opus-5.5, label: Claude Opus 5.5, note: "Hardest problems and production changes, costs more" }
  deepseek:
    - { model: deepseek-flash, label: DeepSeek V4.1 Flash, note: "Everyday questions" }
    - { model: deepseek-v4-pro, label: DeepSeek V4 Pro, note: "Everyday questions, reads text only" }
  mistral:
    - { model: mistral-medium-latest, label: Mistral Medium, note: "Everyday questions" }
    - { model: mistral-large-4, label: Mistral Large 4, note: "Investigations and tricky problems" }
  xai:
    - { model: grok-4.3, label: Grok 4.3, note: "Everyday questions" }
    - { model: grok-4.7, label: Grok 4.7, note: "Investigations and tricky problems" }
  zai:
    - { model: glm-5.3-flash, label: GLM-5.3 Flash, note: "Everyday questions" }
    - { model: glm-5.3, label: GLM-5.3, note: "Investigations and tricky problems, reads text only" }
  minimax:
    - { model: MiniMax-M3.1-Flash, label: MiniMax M3.1 Flash, note: "Everyday questions, reads text only" }
    - { model: MiniMax-M3, label: MiniMax M3, note: "Investigations and tricky problems" }
  qwen:
    - { model: qwen3.8-flash, label: Qwen3.8 Flash, note: "Everyday questions" }
    - { model: qwen3.8-max, label: Qwen3.8 Max, note: "Investigations and tricky problems" }
