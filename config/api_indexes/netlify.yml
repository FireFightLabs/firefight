# Netlify's key reads through api_read, at most 40, which close the netlify_api skill
# (Integrations::ApiIndex). Edit a read's call, purpose or query here, then run bin/rails provider_docs:api_indexes.
tool: api_read
skill: netlify_api
reference: api
reads:
  - call: GET /sites
    purpose: The sites the connection can see, with each one's URL, repository and published deploy.
    query: [ filter, page, per_page ]
  - call: GET /sites/{site_id}
    purpose: One site, with its domains, build settings, repository and published deploy.
  - call: GET /{account_slug}/sites
    purpose: The sites in one team.
    query: [ page, per_page ]
  - call: GET /sites/{site_id}/deploys
    purpose: A site's deploys, newest first, with each one's state, branch, commit and context.
    query: [ state, branch, page, per_page ]
  - call: GET /sites/{site_id}/deploys/{deploy_id}
    purpose: One deploy of a site, with its state, error, commit, branch and timings.
  - call: GET /deploys/{deploy_id}
    purpose: One deploy by its id alone, with its state, error and commit.
  - call: GET /sites/{site_id}/builds
    purpose: A site's builds, newest first, with each one's state and error.
    query: [ page, per_page ]
  - call: GET /builds/{build_id}
    purpose: One build, with its state, error, deploy and timings.
  - call: GET /{account_id}/builds/status
    purpose: The team's build capacity, with how many builds are running and queued.
  - call: GET /sites/{site_id}/deployed-branches
    purpose: The branches a site deploys, each with its latest deploy.
  - call: GET /sites/{site_id}/plugin_runs/latest
    purpose: The latest runs of a site's build plugins, with each one's outcome.
    query: [ packages, state ]
  - call: GET /sites/{site_id}/functions
    purpose: A site's functions, with their runtime and schedule.
    query: [ filter ]
  - call: GET /sites/{site_id}/traffic_splits
    purpose: A site's split tests, with the branches and how traffic is shared.
  - call: GET /sites/{site_id}/dns
    purpose: The DNS zones that serve a site's domains.
  - call: GET /dns_zones
    purpose: The DNS zones Netlify hosts, with their names and nameservers.
  - call: GET /dns_zones/{zone_id}
    purpose: One DNS zone, with its domain, nameservers and DNSSEC state.
  - call: GET /dns_zones/{zone_id}/dns_records
    purpose: The records in a DNS zone, with each one's type, host and value.
  - call: GET /sites/{site_id}/ssl
    purpose: A site's TLS certificate, with its state, domains and expiry.
  - call: GET /sites/{site_id}/ssl/certificates
    purpose: Every certificate a site holds, with their domains and expiry.
    query: [ domain ]
  - call: GET /accounts
    purpose: The teams the connection belongs to, with their plan and capabilities.
  - call: GET /accounts/{account_id}
    purpose: One team, with its plan, usage and capabilities.
  - call: GET /accounts/{account_id}/audit
    purpose: The team's audit log, such as who changed settings, members or deploys, newest first.
    query: [ page, per_page ]
  - call: GET /{account_slug}/members
    purpose: The team's members and their roles.
  - call: GET /{account_slug}/members/{member_id}
    purpose: One team member, with their role and the sites they can reach.
  - call: GET /accounts/{account_id}/env
    purpose: The team's environment variables, by name and scope, never their values.
  - call: GET /api/v1/sites/{site_id}/env
    purpose: A site's environment variables, by name and scope, never their values.
  - call: GET /sites/{site_id}/build_hooks
    purpose: A site's build hooks, by title and branch, with only the host they call.
  - call: GET /hooks
    purpose: A site's notification hooks, such as deploy alerts, by event and type.
    query: [ site_id ]
  - call: GET /sites/{site_id}/database
    purpose: A site's database and its status.
  - call: GET /sites/{site_id}/database/branches
    purpose: A site database's branches.
  - call: GET /sites/{site_id}/database/migrations
    purpose: A site database's migrations, with which have run.
    query: [ branch ]
  - call: GET /sites/{site_id}/database/snapshots
    purpose: A site database's snapshots, with when each was taken.
  - call: GET /deploy_keys
    purpose: The deploy keys Netlify uses to clone repositories, by id and public key only.
  - call: GET /user
    purpose: The user the connection acts as.
