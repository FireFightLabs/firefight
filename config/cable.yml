# The agent broadcasts from the job worker, which is its own process, so development runs the same
# adapter as production. The async adapter only delivers within one process, which drops every
# message a worker sends to a browser connected to the web server.
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
