- name: opsgenie_create_alert
  description: Raise an Opsgenie alert, which pages its responders through their escalations
    and schedules. Use it to wake someone, with what they need to know in the description
  source: opsgenie
  confirms: true
  parameters:
    type: object
    properties:
      message:
        type: string
        description: What is wrong, at most 130 characters
      description:
        type: string
        description: 'What the person paged needs before they look: since when, the
          evidence and its links'
      responders:
        type: array
        items:
          type: object
          properties:
            type:
              type: string
              enum:
              - team
              - user
              - escalation
              - schedule
              description: What the responder is
            name:
              type: string
              description: Its name, or for a user their email
          required:
          - type
          - name
        description: 'Who to page: teams, escalations, schedules or users'
      priority:
        type: string
        enum:
        - P1
        - P2
        - P3
        - P4
        - P5
        description: P1 is the most urgent (optional, P3)
      alias:
        type: string
        description: A key that keeps a second alert for the same problem from opening
          while this one is open (optional)
      entity:
        type: string
        description: What the alert is about, such as a service (optional)
    required:
    - message
    - responders
