  description: 'One Opsgenie alert in full: its message, description, details, tags,
    responders and how it was handled, with its latest notes and its log of what happened
    to it'
  source: opsgenie
  reads: true
  parameters:
    type: object
    properties:
      alert:
        type: string
        description: The alert, by its id, its tiny id (the short number Opsgenie
          shows) or its alias
      identifier_type:
        type: string
        enum:
        - id
        - tiny
        - alias
        description: 'Which of these alert names: id, tiny or alias (optional, id).
          An alias only finds an open alert'
    required:
    - alert
- name: opsgenie_search_incidents
  description: 'Incidents in Opsgenie, newest first, with their status, priority and
    the services they affect. query uses Opsgenie''s incident search, such as status:
    open'
  source: opsgenie
  reads: true
  parameters:
    type: object
    properties:
      query:
        type: string
        description: 'An Opsgenie incident search query, such as status: open (optional,
          every incident)'
      limit:
        type: integer
        description: At most this many, up to 100 (optional, 20)
- name: github_set_actions_secret
  description: 'Create or replace a GitHub Actions secret in a repository, or in one
    of its environments. Never pass the value: the person types it in a secure field
    Firefight shows under this step, or value_from names a value Firefight reads itself
    from another tool, so it never passes through you'
  source: github
  confirms: true
  parameters:
    type: object
    properties:
      repo:
        type: string
        description: Repository in owner/name form, e.g. acme/checkout. Read it off
          the resource map or the catalog first, or list the repositories, and ask
          only when several fit
      name:
        type: string
        description: The secret's name, such as DEPLOY_HOOK_URL. Letters, digits and
          underscores
      environment:
        type: string
        description: A deployment environment of the repository, such as production,
          for its own secrets (optional, the repository's)
      value_from:
        type: string
        description: A secret reference another tool gave, such as secret:..., whose
          value Firefight reads itself and sets, so it is never shown. Leave it out
          and the person types the value in Firefight instead (optional)
    required:
    - repo
    - name
- name: northflank_template_runs
  description: A Northflank template's recent runs, newest first, each with its status,
    when it started and finished and how long it took, and how long finished runs
    usually take. Templates belong to the team rather than a project. Name a run to
    read it with each node, such as a project, a service, a build or a release, how
    each went, the error a failed one gave and its retries
  source: northflank
  reads: true
  parameters:
    type: object
    properties:
      template:
        type: string
        description: The template, by name or id
      name:
        type: string
        description: Only runs whose template's name contains this (optional)
      run:
        type: string
        description: Only this run, by its id, with each of its nodes (optional)
      limit:
        type: integer
        description: At most this many runs (optional, 20)
    required:
    - template
- name: aws_list_resources
  description: The ECS services, Lambda functions, EC2 instances, RDS databases and
    CodeBuild projects this connection reaches, in each of its regions, with their
    state and ARN. Use it first to find the name to pass to the other tools
  source: aws
  reads: true
  parameters:
    type: object
    properties:
      kind:
        type: string
        enum:
        - service
        - function
        - virtual_machine
        - database
        - build_service
        description: Only this kind (optional)
      region:
        type: string
        description: Only this region, such as eu-west-1 (optional, every region of
          the connection)
- name: github_list_tags
  description: A repository's tags, with the commit each one points at
  source: github
  reads: true
  parameters:
    type: object
    properties:
      repo:
        type: string
        description: Repository in owner/name form, e.g. acme/checkout. Read it off
          the resource map or the catalog first, or list the repositories, and ask
          only when several fit
      limit:
        type: integer
        description: At most this many (optional, 20, at most 100)
    required:
    - repo
