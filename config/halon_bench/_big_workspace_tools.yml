# Written by bin/rails halon:bench_big_workspace from _big_workspace.yml. Edit that file, never this one.
- name: github_changes_before
  description: 'What changed before a time, across every repository this connection
    can see, ranked by how likely each change is to have caused a failure that started
    then, with the reasons shown. Give whatever clues you have: repository or service
    names, stack trace frames as path:line, error text, a commit. It finds which repositories
    they point at, reads every deploy and merge in the window, blames the failing
    lines however long ago they changed, summarises the week before for a slow burn,
    and says what it could not check. A merge is not proof of a deploy, so when you
    name a commit, say whether a deploy record showed it running'
  source: github
  reads: true
  parameters:
    type: object
    properties:
      at:
        type: string
        description: When the failure started, as ISO 8601
      window_hours:
        type: integer
        description: How far back to read every change in detail (optional, 6 hours)
      repositories:
        type: array
        items:
          type: string
        description: Repositories in owner/name form the clues name (optional)
      names:
        type: array
        items:
          type: string
        description: Service or app names mentioned, e.g. checkout (optional)
      paths:
        type: array
        items:
          type: string
        description: Stack trace frames as path:line, e.g. app/models/pool.rb:42 (optional)
      error_texts:
        type: array
        items:
          type: string
        description: Error names or messages as written in code, e.g. PoolExhausted
          (optional)
      commits:
        type: array
        items:
          type: string
        description: A commit SHA an alert named as running (optional)
      started_from:
        type: string
        description: How the start time was chosen, e.g. first alert received (optional)
    required:
    - at
- name: github_pr_lookup
  description: 'Fetch a pull request: title, state, author, branches, whether GitHub
    says it can merge, its reviews and review comments, the checks and statuses on
    its head commit, its changed files, and for a Dependabot update the security advisories
