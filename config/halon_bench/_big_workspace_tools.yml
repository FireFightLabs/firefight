    on log groups in one region, such as fields @timestamp, @message | filter @message
    like /timeout/ | stats count(*) by bin(5m). Use it for counts, groupings and log
    groups search_logs does not read. Logs Insights charges by the data it scans,
    so keep the range short
  source: aws
  reads: true
  parameters:
    type: object
    properties:
      log_groups:
        type: array
        items:
          type: string
        description: The log groups to query, by name
      query:
        type: string
        description: The Logs Insights query
      region:
        type: string
        description: The region the log groups are in (optional, the connection's
          first region)
      limit:
        type: integer
        description: At most this many rows (optional, 500)
      minutes:
        type: integer
        description: How far back from now, in minutes (optional, 60)
      start:
        type: string
        description: Start of the range as an ISO 8601 time, instead of minutes (optional)
      end:
        type: string
        description: End of the range as an ISO 8601 time (optional, now)
    required:
    - log_groups
    - query
- name: github_run_shell
  description: Run a read-only shell command in a checkout of a repository at a commit,
    for what the other tools do not cover. It runs as a user that cannot write the
    code
  source: github
  reads: true
  parameters:
    type: object
    properties:
      repo:
        type: string
        description: Repository in owner/name form, e.g. acme/checkout. Read it off
          the resource map or the catalog first, or list the repositories, and ask
          only when several fit
      ref:
        type: string
        description: Commit SHA, branch or tag, usually the running commit (optional,
          the default branch otherwise)
      command:
        type: string
        description: The command, run with sh -c from the repository root
      timeout:
        type: integer
        description: Seconds (optional, 60, at most 120)
    required:
    - repo
    - command
