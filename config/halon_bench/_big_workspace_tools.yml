        description: The job's id, as workflow_jobs shows it (optional)
      branch:
        type: string
        description: Only a job on this branch, when no job is named (optional)
      text:
        type: string
        description: Only lines containing this text (optional)
      regex:
        type: string
        description: Only lines matching this regular expression (optional)
      exclude:
        type: string
        description: Leave out lines containing this text (optional)
      limit:
        type: integer
        description: At most this many lines, from the end (optional, 200, at most
          1000)
      minutes:
        type: integer
        description: Only within this many minutes back from now (optional)
      start:
        type: string
