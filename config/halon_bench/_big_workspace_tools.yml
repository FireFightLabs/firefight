- name: github_fix_code
  description: 'Write a code change with Firefight''s own coding agent in Firefight''s
    sandbox and open it as a pull request, ready for review, written on the base branch''s
    newest commit, or add it to an open pull request''s branch when pull_request or
    branch is given. The agent works in a real git copy with the newest base fetched,
    so it can merge the base in and resolve a conflict when asked to. The answer ends
    with what GitHub says of whether it can merge. The agent reads the connected systems
    as the person asking, may ask them a question, and its change is checked and reviewed
    before it opens. A change to a path the connection lists under Code changes as
    one Halon may not change is refused, and an admin changes that list with update_protected_paths.
    Give the repository, what to change and why, and a title. Only for changing code:
    closing, merging, reviewing, labelling or commenting on a pull request, and anything
    else on GitHub that is not a code change, is a call to the GitHub tool for it,
    never a code fix'
  source: github
  confirms: true
  parameters:
    type: object
    properties:
      repo:
        type: string
        description: Repository in owner/name form, e.g. acme/checkout. Read it off
          the resource map or the catalog first, or list the repositories, and ask
          only when several fit
      brief:
        type: string
        description: What to change and why, with the evidence, as the agent's brief.
          When the change touches another system's interface, such as a webhook, an
          API, a config format or a CI trigger, cite that system's documented contract
          and its live setup as you read them, and say what you could not verify
      title:
        type: string
        description: What the change does, in plain words, such as "Allow only letters,
          digits and hyphens in the release run name". The pull request's title, or
          the commit's message when it adds to one
      summary:
        type: string
        description: When adding to an open pull request, one or two plain sentences
          leading the comment posted there, saying what this update changes. No words
          about how the work was done. A pull request's description is written from
          the change and its review (optional, the title)
      base:
        type: string
        description: The branch to open it against (optional, the default branch)
      pull_request:
        type: integer
        description: An open pull request in the same repository whose branch the
          change is added to, instead of opening one. Leave out to open a new pull
          request
      branch:
        type: string
        description: A branch in the same repository the change is added to, instead
          of opening a pull request. Leave out to open a new pull request
      context:
        type: string
        description: What other changes in the same fix did, such as pull requests
          opened in other repositories. The coding agent reads it, and it never reaches
          the pull request (optional)
    required:
    - repo
    - brief
    - title
