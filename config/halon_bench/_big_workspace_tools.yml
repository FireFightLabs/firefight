- name: northflank_add_workflow_webhook
  description: 'Add a webhook trigger to a Northflank workflow, so a request to its
    address starts a run, such as from a CI job after a release. Firefight makes the
    address, which works as a password, so it is never shown to you: the person reveals
    it under this step, and value_from on a tool that stores secrets takes the reference
    this answers with to store it there unseen'
  source: northflank
  confirms: true
  parameters:
    type: object
    properties:
      workflow:
        type: string
        description: The workflow's id, as api_request GET workflows lists it
      ref:
        type: string
        description: The trigger's name, letters, digits and hyphens, such as release-webhook.
          The workflow reads its values as ${triggers.<ref>...}
    required:
    - workflow
    - ref
