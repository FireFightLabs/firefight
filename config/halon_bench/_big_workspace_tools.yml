  source: opsgenie
  confirms: true
  parameters:
    type: object
    properties:
      description:
        type: string
        description: Why, such as the planned work (optional)
      duration:
        type: string
        enum:
        - for-5-minutes
        - for-30-minutes
        - for-1-hour
        - indefinitely
        - schedule
        description: How long, or schedule to give start and end
      start:
        type: string
        description: 'For schedule: when it starts, as an ISO 8601 time'
      end:
        type: string
        description: 'For schedule: when it ends, as an ISO 8601 time'
      targets:
        type: array
        items:
          type: object
          properties:
            type:
              type: string
              enum:
              - integration
              - policy
              description: An integration or an alert policy
            id:
              type: string
              description: Its id, as list_maintenance_targets shows it
          required:
          - type
          - id
        description: 'What to quiet: an integration''s alerts stop, a policy stops
          acting'
    required:
    - duration
    - targets
