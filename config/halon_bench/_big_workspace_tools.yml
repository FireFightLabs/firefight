- name: aws_search_logs
  description: Log lines of one ECS service, Lambda function or RDS database from
    CloudWatch Logs, newest first, at most 200, through a Logs Insights query on its
    log groups. Filter by text, a regular expression or text to leave out. An ECS
    service is read from the awslogs log group its task definition names, a Lambda
    function from its own log group, an RDS database from the logs it exports
  source: aws
  reads: true
  parameters:
    type: object
    properties:
      resource:
        type: string
        description: An ECS service, Lambda function, EC2 instance, RDS database or
          CodeBuild project, by its name or ARN as list_resources shows it
      text:
        type: string
        description: Only lines containing this text, case sensitive (optional)
      regex:
        type: string
        description: Only lines matching this regular expression (optional)
      exclude:
        type: string
        description: Leave out lines containing this text (optional)
      limit:
        type: integer
        description: At most this many lines (optional, 200)
      minutes:
        type: integer
        description: How far back from now, in minutes (optional, 60)
      start:
        type: string
        description: Start of the range as an ISO 8601 time, instead of minutes (optional)
      end:
        type: string
        description: End of the range as an ISO 8601 time (optional, now)
    required:
    - resource
