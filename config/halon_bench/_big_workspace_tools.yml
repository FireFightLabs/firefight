- name: northflank_list_deployments
  description: 'A service''s deployments, newest first: each one''s id, when it went
    out, the commit or image, how many instances, whether it is the stable or canary
    side of a rollout, and why (such as a build, a template or release run, or a change
    to its settings) and by whom. Use it to see what changed before something broke'
  source: northflank
  reads: true
  parameters:
    type: object
    properties:
      resource:
        type: string
        description: A service, database (addon) or job in the project, by name or
          id, as list_resources or list_jobs shows it
      limit:
        type: integer
        description: At most this many deployments (optional, 20)
    required:
