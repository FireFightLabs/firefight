- name: postgresql_database_status
  description: 'How the database stands now: its version, size, how long it has been
    up, connections against the limit, the oldest open transaction, its commits, rollbacks,
    deadlocks and cache hit rate since statistics were reset, how close it is to transaction
    ID wraparound, and its replication'
  source: postgresql
  reads: true
  parameters:
    type: object
    properties: {}
- name: northflank_search_logs
  description: 'Log lines from one service, database or job, newest first, at most
    200, one run of a job when it is named. Filter by text or a regular expression,
    and by log type: runtime for what the app prints, build, ingress for HTTP requests
    reaching it where Northflank has ingress logs switched on for the account. The
    app''s runtime logs usually carry each request''s path too'
  source: northflank
  reads: true
  parameters:
    type: object
    properties:
      resource:
        type: string
        description: A service, database (addon) or job in the project, by name or
          id, as list_resources or list_jobs shows it
      text:
        type: string
        description: Only lines containing this text (optional)
      regex:
        type: string
        description: Only lines matching this regular expression (optional)
      exclude:
        type: string
        description: Leave out lines containing this text (optional)
      type:
        type: string
        enum:
        - runtime
        - build
        - ingress
        - mesh
        - cdn
        - backup
        - restore
        description: Which logs (optional, runtime)
      limit:
        type: integer
        description: At most this many lines (optional, 200)
      run:
        type: string
        description: For a job, one of its runs by its id, as job_runs shows it, for
          that run alone (optional)
      minutes:
        type: integer
        description: How far back from now, in minutes (optional, 60)
      start:
        type: string
        description: Start of the range as an ISO 8601 time, instead of minutes (optional)
      end:
        type: string
        description: End of the range as an ISO 8601 time (optional, now)
    required:
    - resource
