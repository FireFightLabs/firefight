# Tools many bench scenarios offer, described once. A scenario lists one by name under tools, or describes its own.
# Each answers only from the scenario's record, so nothing here reaches a real system. A tool marked live is one a
# chat is offered today: its description, parameters, whether it asks first and whether a chat holds it from the
# start (base) are copied from its definition by bin/rails halon:bench_tools, and a test fails when they drift. The
# rest are written here: connection tools such as northflank_api_request, and open_tools, which a replay offers
# with the scenario's own groups. See Conversation::BenchCase for each field.

open_tools:
  description: Offered by a replay with the scenario's own groups, as Conversation::Rehearsal::OpenTools builds it.
  reads: true
  parameters:
    type: object
    properties:
      group:
        type: string
        description: The group to open
  base: true
use_skill:
  live: true
  description: |-
    Load the steps for a common task and make the tools it needs callable, without opening their groups. Use one whenever it fits what the person asked. A provider's API skill lists its API reference, which gives the path for the connection's general read (api_read) whenever no other tool covers what you need. The skills, by what they cover:
    firefight alerts:
    on_call_alert: An alert started this run and nobody asked, as the facts' on_call says, such as a page at 3am with nobody awake yet
    firefight follow ups:
    runbooks: Attaching a runbook to an incident, or finding which runbook fits one
    running_runbooks: The person asks for something a saved runbook does, by its name or in their own words, such as release Firefight
    saving_runbooks: The person asks to remember a multi-step task as a runbook, such as remember this as Release Firefight, or agrees when offered
    watching: The person asks to be told later, such as when a run finishes, a build or deploy starts or succeeds, or a resource comes back, or they just started something that takes a while
    firefight incident response:
    checking_a_page: Someone reports that a page or a button does not work, such as the checkout button does nothing, a page is blank or a form will not send, or a change to something people use in a browser should be confirmed to work
    declaring: Declaring a new incident, including one for something already found in this chat
    ending: Closing, resolving or cancelling one or more incidents
    inviting: Bringing people into an incident channel
    paging_on_call: The person asks to page or wake whoever is on call, or a change waits for an approval nobody working the incident can give
    roles: Making someone the lead of an incident, or giving or clearing any incident role
    updating: Posting an update on an incident, or changing its status, severity or type while it is live
    firefight monitoring:
    certificate_expiry: A scheduled check of TLS certificates, or anyone asking when a domain's certificate expires or whether it renews
    cost_trends: A scheduled check of cost, or anyone asking whether the cloud bill is growing, what grew and what the month will end at
    credential_stuffing: Many failed logins, a spike of sign in attempts from many addresses, accounts being taken over, or an alert about brute force or credential stuffing
    disk_trends: A scheduled check of disk space, or anyone asking whether a disk, volume or database is filling up and when it will be full
    error_budget_burn: A scheduled check of error budgets, or anyone asking whether a service is failing more than its objective allows and when its budget runs out
    leaked_secret: A key, token, password or other secret was leaked, such as a secret scanning alert, a key posted in a public place, or someone asking what a leaked key could do
    suspicious_access: A login, key or token used from somewhere unusual, access nobody recognises, a new admin or permission nobody granted, or an alert about suspicious access to an account or system
    firefight playbooks:
    capacity: Something is slow or busy, someone asks to scale, a performance regression, a limit or quota close to its ceiling, or spend that moved
    code: Reading code to learn how a system really behaves, tracing a failure to the line that raised it, reviewing a change with an operator's eye, or writing a fix
    data: A database's health, connections, locks, replication or disk, a query against production data, a change to production rows, a migration, or backups and restores
    deploying: Before, during or after a release or deploy, judging whether a release caused a problem, rolling one back or fixing forward, or following a pipeline to its end
    incident_command: Something is broken for users now, judging impact and severity, deciding whether to declare, coordinating responders, paging, or keeping people informed during an incident
    monitoring: Judging whether a service is healthy or an alert is real, comparing a signal with normal, finding blind spots or noisy alerts, or telling a provider's outage from your own
    postmortems: Writing or reviewing a postmortem, reconstructing what happened in an incident, turning a lesson into an action or a check, or following up on action items
    proactive_hygiene: Looking ahead for what will break, such as expiring certificates, keys or quotas, trends that will cross a limit, risky changes before they ship, stale runbooks or handbook pages, or repeated manual work
    security: A leaked key, abuse, unusual access or traffic, a key or account that should not exist, or any problem where security may be the hidden cause, such as a slowdown, a spike or a bill jump
    firefight workspace setup:
    protected_paths: Someone asks to stop Halon or a coding agent changing a file or folder, to allow it again, what Halon may change in their code, or why a code change was refused for a path
    setup: Setting up Firefight, or changing its severities, statuses, types, roles or workspace settings
  reads: true
  parameters:
    type: object
    properties:
      skill:
        type: string
        enum:
        - on_call_alert
        - runbooks
        - running_runbooks
        - saving_runbooks
        - watching
        - checking_a_page
        - declaring
        - ending
        - inviting
        - paging_on_call
        - roles
        - updating
        - certificate_expiry
        - cost_trends
        - credential_stuffing
        - disk_trends
        - error_budget_burn
        - leaked_secret
        - suspicious_access
        - capacity
        - code
        - data
        - deploying
        - incident_command
        - monitoring
        - postmortems
        - proactive_hygiene
        - security
        - protected_paths
        - setup
        description: The skill to load
      reference:
        type: string
        description: One of the guides the skill lists, to read it (optional)
    required:
    - skill
  default: No skill fits this. Open the group that holds the tools you need with open_tools.
  base: true
search_docs:
  live: true
  description: >-
    Search the documentation of the providers this workspace connected, such as how a webhook trigger takes its parameters, an endpoint's path
    or what an error means. Exact names, paths and error text match as well as a question in plain words. Answers the best few sections, each
    with its page and address. Read more of one with read_doc.
  reads: true
  parameters:
    type: object
    required:
    - query
    properties:
      query:
        type: string
        description: What to find, such as "webhook trigger query parameters sha"
      provider:
        type: string
        description: Only this provider, such as northflank. Leave out to search every connected provider (optional)
  default: No section of the connected providers' documentation matches that.
  base: true
search_handbook:
  live: true
  description: >-
    Search this workspace's handbook, how the workspace works as its people wrote it, such as how a release runs, who owns a service or when changes
    are frozen. Use it for the pages the start of the chat names as too long to give there, and whenever the handbook may say how to do what you
    are about to do. Answers the best few sections whole, each with its page and link. Follow what they say, and cite the page by its link.
  default: The handbook says nothing about that.
  parameters:
    type: object
    required:
    - query
    properties:
      query:
        type: string
        description: What to find, such as "release steps" or "who owns checkout"
  base: true
get_resource_map:
  live: true
  description: >-
    The first place to find which provider and account hold a named domain, zone, service or database. It only reads, so look here before asking
    a person or using a provider's own tools. What runs where, read off the workspace's connections, every kind the map holds (services, build
    services, jobs, databases, branches, repositories, domains, zones, workers, sites, buckets, kv namespaces, queues, database proxies, tunnels,
    load balancers, origin pools, access apps, virtual machines, functions, clusters, computes, workflows, pipelines, release flows, and stacks),
    by provider and account, with how they depend on each other and which repository each is managed in as code, such as Terraform or Helm, so
    a fix to one goes to that code. A zone's details carry its SSL mode, certificates and rule counts, and a change to them is recorded. Without
    a resource, the whole map one line per resource, or from 300 resources its numbers by provider, kind, environment and health with the most
    depended on. With a resource, its fact sheet: where it runs, its page, the catalog services it runs with what each is for and who owns it,
    what people confirmed about it, how its recent incidents ended, what normal looks like for its metrics over the last week, its key checks
    with their normal (run_key_query runs one), the log lines it usually prints (new_log_patterns finds the ones it does not), and every link
    within two hops, each saying how it was found. A status is what the last sweep saw, so check live state with the provider's own tools. A link
    marked not confirmed is a suggestion. Never state it as fact, and say it is unconfirmed if you rely on it. It holds only what runs in the
    environments the caller may read, and a sheet counts the links it leaves out for that reason. On a large map, find_resources searches by name,
    provider, kind, environment, owner or tag, traverse_resource_map and blast_radius walk the links, and get_resource_links lists one resource's.
    Docs: https://firefight.app/docs/api/mcp-server.md
  reads: true
  parameters:
    properties:
      resource:
        type: string
        description: >-
          A resource's name, its provider's id or its id on the map, such as web, firefight-prod/main or an id search_map gave. Leave it out for
          the whole map
    type: object
what_changed:
  live: true
  description: >-
    What changed, everywhere, over a window, newest first in one list: deploys and builds, CI and release runs read live from the provider that
    runs each resource, settings and status the map saw change, changes a provider reported between sweeps (an edit made by hand shows here),
    and changes made through Firefight, with who made them and links to each page. Name a resource on the map, a service from the catalog, or
    neither for the whole workspace. Use it first when asked what changed before something broke
  reads: true
  parameters:
    type: object
    properties:
      resource:
        type: string
        description: A resource on the map, by its name, its provider's id or its id on the map (optional)
      service:
        type: string
        description: A service from the catalog, by its name, for every resource that runs it (optional)
      minutes:
        type: integer
        description: How far back from now, in minutes (optional, 1440, at most 43200)
      start:
        type: string
        description: Start of the window as an ISO 8601 time, instead of minutes (optional)
      end:
        type: string
        description: End of the window as an ISO 8601 time (optional, now)
    required: []
  reads_like: recent_deploys
  default: Nothing changed in that window, no deploy, build, run or settings change.
resource_status:
  live: true
  description: >-
    How one resource on the map is set up and how it stands now, read live from whichever connection runs it: its state, size, what it runs and
    its health checks
  reads: true
  source: connected
  parameters:
    type: object
    properties:
      resource:
        type: string
        description: The resource, by its name, its provider's id or its id on the resource map, as search_map or get_resource gave it
    required:
    - resource
run_key_query:
  live: true
  description: >-
    Run one of a resource's key checks, the first things worth reading on it: a service's error rate, p95 latency, CPU, memory and recent deploys,
    a database's CPU, memory, connections and disk, a function's invocations, errors, duration and throttles, a domain's or site's availability.
    The answer says how the reading compares with what is normal for it over the last week. get_resource_map lists a resource's checks with their
    normal
  reads: true
  source: connected
  reads_like: query_metrics
  parameters:
    type: object
    properties:
      resource:
        type: string
        description: The resource, by its name, its provider's id or its id on the resource map
      query:
        type: string
        enum:
        - error_rate
        - latency_p95
        - cpu
        - memory
        - connections
        - disk
        - traffic
        - invocations
        - errors
        - duration
        - throttles
        - recent_deploys
        - recent_errors
        - status
        - availability
        - ci_status
        description: Which check, one the resource's kind has
      minutes:
        type: integer
        description: How far back from now, in minutes (optional, 60)
    required:
    - resource
    - query
new_log_patterns:
  live: true
  description: >-
    Which kinds of log line a resource printed recently that it did not print in the last week, from its recent logs grouped into patterns with
    numbers, ids and quoted values masked, and which of the error patterns it printed are usual, so a line that was always there is not taken
    for the cause
  reads: true
  source: connected
  reads_like: search_logs
  parameters:
    type: object
    properties:
      resource:
        type: string
        description: The resource, by its name, its provider's id or its id on the resource map
      minutes:
        type: integer
        description: How far back from now, in minutes (optional, 60)
    required:
    - resource
recent_deploys:
  live: true
  description: >-
    What went out to one resource on the map, newest first: when, which commit or version, by whom and why, with the id rollback takes. Use it
    to see what changed before something broke
  reads: true
  source: connected
  parameters:
    type: object
    properties:
      resource:
        type: string
        description: The resource, by its name, its provider's id or its id on the resource map, as search_map or get_resource gave it
      limit:
        type: integer
        description: At most this many (optional)
    required:
    - resource
run_history:
  live: true
  description: >-
    Recent runs of one resource on the map, newest first, from whichever connection runs it: a repository's CI runs, or a service's builds and
    deploys, each with its status, when it started and finished and how long it took, and how long finished ones usually take. Use it to learn
    how long something usually takes or to follow one run
  reads: true
  source: connected
  parameters:
    type: object
    properties:
      resource:
        type: string
        description: The resource, by its name, its provider's id or its id on the resource map, as search_map or get_resource gave it
      name:
        type: string
        description: Only runs whose workflow, pipeline or kind contains this, such as release or build (optional)
      run:
        type: string
        description: Only this run, by its id, with its jobs or steps where the provider breaks a run down (optional)
      limit:
        type: integer
        description: At most this many (optional)
    required:
    - resource
search_logs:
  live: true
  description: >-
    Log lines of one resource on the map, newest first, from whichever connection runs or watches it. Filter by text or a regular expression.
    stream picks what the app prints (app, the default), its builds, or the requests reaching it, where the provider keeps them
  reads: true
  source: connected
  parameters:
    type: object
    properties:
      resource:
        type: string
        description: The resource, by its name, its provider's id or its id on the resource map, as search_map or get_resource gave it
      text:
        type: string
        description: Only lines containing this text (optional)
      regex:
        type: string
        description: Only lines matching this regular expression (optional)
      exclude:
        type: string
        description: Leave out lines containing this text (optional)
      stream:
        type: string
        enum:
        - app
        - build
        - requests
        - internal
        - cdn
        - backup
        - restore
        description: >-
          Which logs: app (what the code prints), build, requests (traffic reaching it), internal (calls between services), cdn, backup or restore
          (optional, app)
      run:
        type: string
        description: Only one run's lines, by the run's id as run_history gives it, for a job whose provider keeps them per run (optional)
      deployment:
        type: string
        description: 'build stream only: the deployment or build whose log to read, by the id run_history or recent_deploys shows (optional, the
          newest otherwise)'
      limit:
        type: integer
        description: At most this many (optional)
      minutes:
        type: integer
        description: How far back from now, in minutes (optional, 60)
      start:
        type: string
        description: Start of the range as an ISO 8601 time, instead of minutes (optional)
      end:
        type: string
        description: End of the range as an ISO 8601 time (optional, now)
    required:
    - resource
query_metrics:
  live: true
  description: >-
    Metrics of one resource on the map over time, from whichever connection runs or watches it, with min, average, max and latest for each. The
    person sees each metric as a chart. A metric the provider does not keep for that resource is named as missing
  reads: true
  source: connected
  parameters:
    type: object
    properties:
      resource:
        type: string
        description: The resource, by its name, its provider's id or its id on the resource map, as search_map or get_resource gave it
      metrics:
        type: array
        items:
          type: string
          enum:
          - cpu
          - memory
          - requests
          - errors
          - http_4xx
          - http_5xx
          - cpu_time
          - network_in
          - network_out
          - tcp_connections
          - disk
          - bandwidth
          - latency_p95
          - invocations
          - duration
          - throttles
        description: Which metrics (optional, the resource's usual ones)
      minutes:
        type: integer
        description: How far back from now, in minutes (optional, 60)
      start:
        type: string
        description: Start of the range as an ISO 8601 time, instead of minutes (optional)
      end:
        type: string
        description: End of the range as an ISO 8601 time (optional, now)
    required:
    - resource
check_status_page:
