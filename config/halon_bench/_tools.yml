list_watches:
  live: true
  description: >-
    The watches this chat keeps, going and ended, with each step as it stands, when it was last read, and what they said. Each one still going
    reads what it follows again first, so read it when the person asks how a watch is going, and say so when it disagrees with what you or the
    watch said before. In the dashboard chat the person sees the watches going in the Watching strip above the message box, each opening to its
    card, so answer in a sentence and point there rather than drawing a table of them.
  reads: true
  parameters:
    type: object
    properties: {}
    required: []
  default: No watch is running in this chat.
  base: true
start_investigation:
  live: true
  description: >-
    Start an investigation, only when the person asks for one. It needs no incident. It runs on its own, posts what it finds here, and on an incident
    its steps are followed in the incident's channel. Hand over what the person told you: what is failing, roughly when it started, any names
    and any error text. Ask once when it started if nobody has said, and accept not knowing as an answer. When an investigation finished without
    checking something it can reach now, such as a tool granted since, offer to run it again and start it yourself once the person agrees.
  parameters:
    type: object
    properties:
      symptom:
        type: string
        description: What is failing, in the words of whoever reported it (optional)
      started_around:
        type: string
        description: Roughly when it started, as ISO 8601, when someone said so (optional)
      names:
        type: array
        items:
          type: string
        description: Services, apps or repositories mentioned (optional)
      error_text:
        type: string
        description: An error message or name as it appeared, e.g. PoolExhausted (optional)
    required: []
  default: Started an investigation. Responders follow it in the incident's channel.
  base: true
search_alerts:
  live: true
  description: >-
    Search this workspace's ingested alerts: what fired, how each routed (routed/unmatched/pending/failed), which rule matched, and the incident
    it attached to. Newest first. Docs: https://firefight.app/docs/alerts/how-alerts-work.md
  reads: true
  parameters:
    properties:
      source:
        type: string
        description: Alert source name to filter by
      routing_state:
        type: string
        description: pending, routed, unmatched or failed
      status:
        type: string
        description: firing or resolved
      since:
        type: string
        description: 'ISO8601: only alerts last seen after this time'
      limit:
        type: integer
        description: Max results, up to 50 (default 25)
    required: []
    type: object
get_incident:
  live: true
  description: >-
    Fetch one incident in full by id or identifier (e.g. INC-42): details, timeline events, postmortem status, the alerts attached to it, and
    its pages in on-call tools. Docs: https://firefight.app/docs/incidents/concepts.md
  reads: true
  parameters:
    properties:
      incident:
        type: string
        description: Incident UUID or identifier like INC-42
    required:
    - incident
    type: object
search_incidents:
  live: true
  description: >-
    Search this workspace's incidents. Filter by status slug, severity slug, lifecycle stage (triage/active/closed/canceled), free-text query
    (name or identifier), and declared-at time range. Returns newest first. Docs: https://firefight.app/docs/incidents/concepts.md
  reads: true
  parameters:
    properties:
      status:
        type: string
        description: Incident status slug. None is configured yet
      severity:
        type: string
        description: Severity slug. None is configured yet
      stage:
        type: string
        description: 'Lifecycle stage key: triage, active, closed or canceled'
      query:
        type: string
        description: Matches incident name or identifier
      since:
        type: string
        description: 'ISO8601: only incidents declared after this time'
      until:
        type: string
        description: 'ISO8601: only incidents declared before this time'
      limit:
        type: integer
        description: Max results, up to 50 (default 25)
    required: []
    type: object
  default: No past incident matches.
post_incident_update:
  live: true
  description: >-
    Post an update on an incident: what you have found, what you are doing, and where the incident stands now. This is how you tell the responders
    in the channel what is happening, so use it whenever you learn something or change something. It can also move status, severity and type in
    the same call. Call get_form with form: "update" first, since this workspace decides what is asked and what is required. A required answer
    left out keeps what the incident already has, so send only what changes. Write message as markdown with real line breaks: a lead sentence,
    then a blank line and one "- " bullet per point when there is more than one, with links as plain URLs or [text](url). Never run several points
    together on one line and never type bullet characters such as •, because the dashboard and the incident channel draw the list from the line
    breaks. If the call requires approval, retry the identical call with approval_id once approved. Docs: https://firefight.app/docs/incidents/concepts.md
  parameters:
    properties:
      incident:
        type: string
        description: Incident UUID or identifier like INC-42
      answers:
        type: object
        description: >-
          The update form's answers, keyed by the field keys get_form returned, e.g. { "message": "Rolled back the 14:02 deploy.\n\n- Errors are
          back to baseline\n- Watching for 30 minutes", "status": "monitoring" }
      approval_id:
        type: string
        description: Approval id when retrying an approved call
    required:
    - incident
    - answers
    type: object
  default: Posted.
escalate_incident:
  live: true
  description: >-
    Ask a specific person to pick this incident up. Firefight posts the ask in the incident channel, messages them directly with an acknowledge
    button, and chases them if they do not answer. This is how you pull a human in rather than carrying on alone. An incident that is over cannot
    be escalated. If the call requires approval, retry the identical call with approval_id once approved. Docs: https://firefight.app/docs/incidents/concepts.md
  parameters:
    properties:
      incident:
        type: string
        description: Incident UUID or identifier like INC-42
      member:
        type: string
        description: Email or platform user id of the person to pull in. Pass "me" for the person you are acting for
      reason:
        type: string
        description: Why you need them, shown in the ask
      approval_id:
        type: string
        description: Approval id when retrying an approved call
    required:
    - incident
    - member
    - reason
    type: object
  default: Paged them with the reason.
rollback:
  live: true
  description: Put one resource on the map back on an earlier build or version, through whichever connection runs it
  confirms: true
  source: connected
  parameters:
    type: object
    properties:
      resource:
        type: string
        description: The resource, by its name, its provider's id or its id on the resource map, as search_map or get_resource gave it
      to:
        type: string
        description: The build, version or deployment to go back to, by the id the provider gives it in recent_deploys or its build list
    required:
    - resource
    - to
scale:
  live: true
  description: Set how many instances one resource on the map runs, through whichever connection runs it
  source: connected
  parameters:
    type: object
    properties:
      resource:
        type: string
        description: The resource, by its name, its provider's id or its id on the resource map, as search_map or get_resource gave it
      instances:
        type: integer
        description: How many instances to run (optional when plan is given)
      plan:
        type: string
        description: The size to run at, by the provider's own id for its plan, such as nf-compute-20, where the provider sizes by plan (optional)
    required:
    - resource
  confirms: true
resolve_incident:
  live: true
  description: >-
    Resolve an incident, meaning the response is over and this was a real incident. Closing it is what makes a postmortem available. Call get_form
    with form: "resolve" first for what this workspace asks. A required answer left out keeps what the incident already has, so send only what
    changes. Use cancel_incident instead when it turned out not to be an incident. If the call requires approval, retry the identical call with
    approval_id once approved. Docs: https://firefight.app/docs/incidents/concepts.md
  parameters:
    properties:
      incident:
        type: string
        description: Incident UUID or identifier like INC-42
      answers:
        type: object
        description: The resolve form's answers, keyed as get_form returned them
      approval_id:
        type: string
        description: Approval id when retrying an approved call
    required:
    - incident
    type: object
search_activity:
  live: true
  description: >-
    The gateway's audit log: every call to a connected tool, every configuration change and every refused or waiting request, with who made it
    and from where. Newest first. Docs: https://firefight.app/docs/gateway/activity.md
  reads: true
  parameters:
    properties:
      decision:
        type: string
        description: allow, deny or pending; omit for all
      ability:
        type: string
        description: Exact ability key to filter on
      limit:
        type: integer
        description: Max results, up to 50 (default 25)
    required: []
    type: object
search_catalog:
  live: true
  description: >-
    Search the service catalog: services, teams and other entries with their attributes and relationships (e.g. which team owns a service, its
    Slack channel). Use type=service or type=team plus a name query or exact slug. Docs: https://firefight.app/docs/catalog/overview.md
  reads: true
  parameters:
    properties:
      type:
        type: string
        description: Catalog type slug or system key, e.g. service, team
      query:
        type: string
        description: Matches entry names
      slug:
        type: string
        description: Exact entry slug
      limit:
        type: integer
        description: Max results, up to 50 (default 25)
    required: []
    type: object
list_integrations:
  live: true
  description: >-
    What can be connected to Firefight and what already is, by category. Without a category, one line per category saying what is connected in
    it, so you can ask the person which they want. With a category, every provider in it and where it stands. The person is shown that as a table
    they connect from, so do not list the providers again in your reply. Connecting happens there, never in the chat: never ask for or accept
    a key, token or password. When one is pasted, say it was not used and show this table. Docs: https://firefight.app/docs/api/mcp-server.md
  reads: true
  parameters:
    properties:
      category:
        type: string
        description: >-
          The category to show. Leave it out for the overview. One of: cloud_and_hosting (Cloud and hosting), observability (Observability), alerting_and_on-call
          (Alerting and on-call), product_analytics (Product analytics), databases (Databases), code (Code), ci (CI), coding_agents (Coding agents),
          issues (Issues), knowledge (Knowledge), custom (Custom)
    type: object
  default: Shown to the person as a table they can connect from.
northflank_api_request:
  description: >-
    Calls the Northflank API of the shop connection with a method and a path. GET reads anything. Read the API reference skill before a path you
    do not know.
  source: northflank
  confirms: true
  reads_when:
    method:
    - GET
  parameters:
    type: object
    properties:
      method:
        type: string
        enum:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        description: The HTTP method
      path:
        type: string
        description: The path, such as /v1/projects/shop/services
      body:
        type: object
        description: The request body (optional)
    required:
    - method
    - path
  request: path
  default: '{"error":{"status":404,"message":"Not found"}}'
northflank_workflow_runs:
  description: >-
    A Northflank workflow's recent runs, newest first, each with its status, when it started and finished and how long it took, and how long finished
    runs usually take. Name a run to read it with each node, such as a build, a release or a job run, how each went, the error a failed one gave
    and its retries
  source: northflank
  reads: true
  parameters:
    type: object
    properties:
      workflow:
        type: string
        description: The workflow, by name or id
      name:
        type: string
        description: Only runs whose workflow's name contains this (optional)
      run:
        type: string
        description: Only this run, by its id, with each of its nodes (optional)
      limit:
        type: integer
        description: At most this many runs (optional, 20)
    required:
    - workflow
northflank_billing_usage:
  description: >-
    What the Northflank account or team was charged, by day or by month, with each period's total and what cost most: CPU, memory, storage and
    GPU, bring your own cloud, egress IPs and load balancers. Use it to watch spend and find what grew and since when. The token's role needs
    Billing read
  source: northflank
  reads: true
  parameters:
    type: object
    properties:
      by:
        type: string
        enum:
        - day
        - month
        description: day or month (optional, day)
      days:
        type: integer
        description: For by day, how many days back from today (optional, 30, at most 365)
      months:
        type: integer
        description: For by month, how many months before this one (optional, 3, at most 12)
github_workflow_runs:
  description: Lists recent runs of the repository's GitHub Actions workflows, with their status, branch and a link to each.
  source: github
  reads: true
  parameters:
    type: object
    properties:
      repository:
        type: string
        description: owner/name
      workflow:
        type: string
        description: A workflow file or name (optional)
      limit:
        type: integer
        description: How many runs
        at most 100 (optional):
    required:
    - repository
github_job_log:
  description: Reads one GitHub Actions job's log.
  source: github
  reads: true
  parameters:
    type: object
    properties:
      repository:
        type: string
        description: owner/name
      job:
        type: string
        description: The job's id
    required:
    - repository
    - job
github_fix_code:
  description: Has Firefight's coding agent write a code change on a branch and open a pull request a person reviews.
  source: github
  confirms: true
  parameters:
    type: object
    properties:
      repository:
        type: string
        description: owner/name
      task:
        type: string
        description: What to change and why
        with the evidence:
    required:
    - repository
    - task
planetscale_execute_read_query:
  description: Runs a read only SQL query on a PlanetScale database branch.
  source: planetscale
  reads: true
  parameters:
    type: object
    properties:
      database:
        type: string
        description: The database
      branch:
        type: string
        description: The branch
        usually main:
      query:
        type: string
        description: A SELECT
        SHOW or EXPLAIN:
    required:
    - database
    - query
planetscale_get_insights:
  description: PlanetScale's query insights for a database branch, the slowest and most frequent queries over a window.
  source: planetscale
  reads: true
  parameters:
    type: object
    properties:
      database:
        type: string
        description: The database
      branch:
        type: string
        description: The branch (optional)
      hours:
        type: integer
        description: How far back (optional)
    required:
    - database
cloudflare_execute:
  description: >-
    Runs a short script against the Cloudflare API of the shop account. Use it for what no other tool reads. It can change things, so the person
    confirms each call.
  source: cloudflare
  confirms: true
  parameters:
    type: object
    properties:
      code:
        type: string
        description: The script, which calls cloudflare.request(method, path, body)
    required:
    - code
  request: code
  default: >-
    {"success":false,"errors":[{"code":7003,"message":"Could not route to the path the script asked for. Perhaps an identifier is wrong."}],"result":null}
propose_handbook_edit:
  live: true
  description: >-
    Propose an edit to a page of this workspace's handbook when a result you read now contradicts it, such as releases running through a different
    tool than the page says, or propose a new page when asked to draft the handbook or when something the team relies on is written nowhere. Nothing
    changes until a person accepts it. Write the whole page as it should read, keeping everything the result did not contradict, and say what
    showed it.
  default: Proposed. The person sees the edit on a card and accepts or changes it.
  parameters:
    type: object
    properties:
      page:
        type: string
        description: The title of the page to change, as the handbook names it. Leave it out to propose a new page
      title:
        type: string
        description: The new page's title, at most 120 characters, only for a new page
      text:
        type: string
        description: The whole page as it should read, in Markdown
      evidence:
        type: string
        description: >-
          What showed it and where, in one or two sentences, such as "The last five releases ran through the deploy workflow, not the release
          pipeline."
    required:
    - text
    - evidence
  base: true
get_form:
  live: true
  description: >-
    Fetch one lifecycle form and every field on it, hidden ones included, with each field's key, type, whether it is visible, required, locked,
    and any conditions gating it. A field with asked: false is not on the form right now and inactive_reason says why, so do not answer it. On
    the update, resolve and cancel forms a required field left out keeps the incident's current value. Read this before changing a form so an
    update replaces what is actually there. Docs: https://firefight.app/docs/customization/incident-forms.md
  reads: true
  parameters:
    properties:
      form:
        type: string
        description: 'Form slug, one of: declare, update, resolve, cancel'
    required:
    - form
    type: object
invite_responders:
  live: true
  description: >-
    Pull people into the incident channel so they can see what is happening and join in, the same as a person running /ff invite. Inviting someone
    does not ask them for anything: use escalate_incident when you need a named person to respond. If the call requires approval, retry the identical
    call with approval_id once approved. Docs: https://firefight.app/docs/incidents/concepts.md
  default: Invited them to the incident's channel.
  parameters:
    properties:
      incident:
        type: string
        description: Incident UUID or identifier like INC-42
      members:
        type: array
        items:
          type: string
        description: Emails or platform user ids of the people to bring in. Pass "me" for the person you are acting for
      approval_id:
        type: string
        description: Approval id when retrying an approved call
    required:
    - incident
    - members
    type: object
