          step, and a resource_status or tool step whose goal speaks of a deploy, rollout or release, waits for a new deploy on its own (optional)
        properties:
          resource:
            type: string
            description: The resource deployed, by name or map id, when the step reads with a tool (optional, the step's resource)
          connection:
            type: string
