  description: >-
    Read an outside provider's public status page now: whether it reports an outage or degraded service, its open incidents with their latest
    update, and what is not fully working, with the page's address. Use it whenever errors point outside, such as timeouts, refused connections
    or 5xx answers from a third party's host, before blaming the team's own code. Name the provider, or give the host the errors name and the
    provider is found from it. Docs: https://firefight.app/docs/ai/what-changed.md
