              production)
          repository:
            type: string
            description: The repository a tag is in, by name on the map, when the resource is not linked to one (optional)
      watch:
        type: string
        description: The watch's id, as start_watch, list_watches or the hand back gave it
      step:
        type: string
        description: The step to repair, by its label
