title: Every payment webhook rejected after a config change
shape: >-
  After a config cleanup every payment webhook was answered 401 and orders stayed pending. The initializer read the
  signing secret from an environment variable whose name was misspelled, so the secret was nil and no signature matched.
repository: larkspur/shop
brief: >-
  Every payment webhook is answered 401 since the config cleanup deploy. config/initializers/payments.rb reads the
  webhook secret from PAYMENTS_WEBHOOK_SECRT, a misspelling, so it is nil, while the runtime environment sets
  PAYMENTS_WEBHOOK_SECRET. Read the correctly spelled name.
files:
  config/initializers/payments.rb: |
    Rails.application.config.payments = {
      api_key: ENV["PAYMENTS_API_KEY"],
      webhook_secret: ENV["PAYMENTS_WEBHOOK_SECRT"],
      timeout: 10
    }
expected_diff: |
  --- a/config/initializers/payments.rb
  +++ b/config/initializers/payments.rb
  @@ -1,5 +1,5 @@
   Rails.application.config.payments = {
     api_key: ENV["PAYMENTS_API_KEY"],
  -  webhook_secret: ENV["PAYMENTS_WEBHOOK_SECRT"],
  +  webhook_secret: ENV["PAYMENTS_WEBHOOK_SECRET"],
     timeout: 10
   }
