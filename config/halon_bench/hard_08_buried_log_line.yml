title: The one log line that matters, buried in noise
source: Harder scenarios, noisy logs
shape: >-
  Password reset emails stopped arriving. The mailer's logs are full of old, harmless warnings and errors, and a
  mailer deploy went out that morning. The one line that matters says recipients reject the mail for a failed sender
  check, and it leads to a DNS record edited by hand at the edge minutes before.
context: |-
  You are acting for Sam Rivera, whose role in this workspace is member. Owners and admins can change settings and permissions, members respond to incidents.
turns:
  - said: password reset emails stopped arriving this morning, customers are locked out. help?
    decisions: [ approve ]
tools:
  - open_tools
  - get_resource_map
  - search_logs
  - query_metrics
  - what_changed
  - recent_deploys
  - check_from_outside
  - run_command
  - cloudflare_execute
