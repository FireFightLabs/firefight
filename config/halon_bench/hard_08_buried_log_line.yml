    match: { regex: "/550|5\\.7|reject|spf|dmarc|deliver/" }
    result: |-
      mailer, matching lines, newest first:
      09:41:02 ERROR DeliveryJob template=password_reset to=***@mail.example: 550 5.7.26 Unauthenticated email from larkspur.shop is not accepted due to the domain's DMARC policy (SPF fail)
      09:40:47 ERROR DeliveryJob template=password_reset to=***@mail.example: 550 5.7.26 Unauthenticated email from larkspur.shop is not accepted due to the domain's DMARC policy (SPF fail)
