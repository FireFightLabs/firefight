expect:
  outcome: >-
    Recipients' servers reject password reset mail with 550 5.7.26, a failed SPF check, since 07:14, because Jo Park
    edited the SPF record on larkspur.shop at 07:10 and dropped the relay's include. The Redis heartbeat timeouts and
    metrics errors around it are older and harmless, and the 06:30 mailer deploy changed no mail settings.
  next_step: >-
    It proposes putting include:spf.relay.mailhost.example back in the SPF record, asks once, offers to bring in Jo,
    and says resets requested since 07:14 need sending again once mail is accepted.
  evidence: [ "550 5.7.26", "dns/records" ]
  reference_cents: 1.8
