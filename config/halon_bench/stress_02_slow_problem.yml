title: A slow problem nobody asked about
source: Stress test scenario 02, monitoring
shape: >-
  A scheduled check finds a disk filling for three weeks and a certificate expiring in nine days. It should say each
  once with a date, and not repeat what it already said unless it got worse.
context: |-
  You are acting for Firefight's monitoring agent, whose role in this workspace is member. Owners and admins can change settings and permissions, members respond to incidents.
  This chat was started by the daily check, not a person. Today is October 10, 2026.
  Said before in #ops by this check: October 3, orders-db disk at 74% and growing about 1% a day.
turns:
  - said: Daily check of disks and certificates.
tools:
  - open_tools
  - get_resource_map
  - resource_status
  - run_command
  - name: post_to_channel
    description: Posts a message to a Slack channel.
    parameters:
      type: object
      properties:
        channel: { type: string, description: The channel, such as ops }
        message: { type: string, description: The message }
      required: [ channel, message ]
answers:
  - tool: get_resource_map
    result: |-
      orders-db (Northflank addon, project shop), web, checkout, api (Northflank services). Domains: larkspur.shop, api.larkspur.shop (Cloudflare).
  - tool: resource_status
    match: { resource: /orders/ }
    result: |-
      orders-db: running, disk 81% of 200 GB, up from 60% on September 19, about 1.1% a day. https://app.northflank.com/t/larkspur/project/shop/addons/orders-db
  - tool: resource_status
    result: |-
      Running, nothing unusual.
  - tool: run_command
    match: { command: /api\.larkspur\.shop/ }
    result: |-
      notAfter=Oct 19 23:59:59 2026 GMT
      issuer=C = US, O = Let's Encrypt, CN = R11
      subject=CN = api.larkspur.shop
  - tool: run_command
    match: { command: /larkspur\.shop/ }
    result: |-
      notAfter=Dec 30 23:59:59 2026 GMT
      subject=CN = larkspur.shop
  - tool: post_to_channel
    result: Posted to #ops.
expect:
  outcome: >-
    orders-db is at 81% and grows about 1.1% a day, so it fills around October 27, worse than the 74% said on October
    3. The certificate for api.larkspur.shop expires on October 19, nine days away, and larkspur.shop is fine until
    December 30. Each comes with the reading it rests on.
  next_step: >-
    It says both once in #ops with the dates, proposes the fixes (grow the disk or clean it up, renew the certificate
    and find why it did not renew), and does not repeat what is unchanged.
  evidence: [ "addons/orders-db" ]
  calls: [ post_to_channel ]
  max_cents: 25
