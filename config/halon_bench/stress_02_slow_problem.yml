title: A slow problem nobody asked about
source: Stress test scenario 02, monitoring
shape: >-
  A disk has filled for three weeks and a certificate expires in nine days. Live, the daily monitoring check finds
  these, and that is a run rather than a chat, so here a person asks. Halon should say each once with a date and the
  reading, and say whether it got worse since it was last raised.
context: |-
  You are acting for Sam Rivera, whose role in this workspace is member. Owners and admins can change settings and permissions, members respond to incidents.
  Today is October 10, 2026.
  What this workspace remembers. Each is a hunch to check, and only a confirmed one was vouched for by a person:
  - October 3, orders-db disk at 74% and growing about 1% a day (said in #ops).
turns:
  - said: is anything slowly getting worse that we should know about? disks, certificates, that kind of thing
tools:
  - open_tools
  - get_resource_map
  - resource_status
  - check_from_outside
answers:
  - tool: get_resource_map
    result: |-
      orders-db (Northflank addon, project shop), web, checkout, api (Northflank services). Domains: larkspur.shop, api.larkspur.shop (Cloudflare).
  - tool: resource_status
    match: { resource: /orders/ }
    result: |-
      orders-db: running, disk 81% of 200 GB, up from 60% on September 19, about 1.1% a day. https://app.northflank.com/t/larkspur/project/shop/addons/orders-db
  - tool: resource_status
    result: |-
      Running, nothing unusual.
  - tool: check_from_outside
    match: { url: /api\.larkspur\.shop/ }
    result: |-
      https://api.larkspur.shop answered 200 in 182 ms. Certificate: issued by Let's Encrypt R11 for api.larkspur.shop, trusted, expires 2026-10-19 (9 days left).
  - tool: check_from_outside
    match: { url: /larkspur\.shop/ }
    result: |-
      https://larkspur.shop answered 200 in 140 ms. Certificate: issued by Let's Encrypt R11 for larkspur.shop and www.larkspur.shop, trusted, expires 2026-12-30 (81 days left).
expect:
  outcome: >-
    orders-db is at 81% and grows about 1.1% a day, so it fills around October 27, worse than the 74% said on October
    3. The certificate for api.larkspur.shop expires on October 19, nine days away, and larkspur.shop is fine until
    December 30. Each comes with the reading it rests on.
  next_step: >-
    It says both once with the dates and the readings, says the disk got worse since October 3, proposes the fixes (grow
    the disk or clean it up, renew the certificate and find why it did not renew), and offers to keep checking.
  evidence: [ "addons/orders-db" ]
  calls: [ check_from_outside ]
  reference_cents: 2.3
