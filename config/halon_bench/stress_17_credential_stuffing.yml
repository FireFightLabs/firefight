title: Credential stuffing
source: Stress test scenario 17, security
shape: >-
  Login failures spike from a few networks trying many accounts. Halon reads auth logs and the firewall, and proposes
  a rate limit that expires by default, with a reminder before it does, asking once.
context: |-
  You are acting for Priya Shah, whose role in this workspace is admin. Owners and admins can change settings and permissions, members respond to incidents.
turns:
  - said: login failures went through the roof in the last half hour, are we being attacked?
    decisions: [ approve ]
tools:
  - open_tools
  - use_skill
  - search_logs
  - cloudflare_execute
answers:
  - tool: search_logs
    result: |-
      auth, last 30 minutes: 41,200 failed logins, 39,900 of them for different emails, 97% from AS14061, AS16276 and AS9009. Normal is about 300 an hour. 11 logins succeeded from those networks.
  - tool: cloudflare_execute
    match: { code: /firewall|events|security/ }
    reads: true
    result: |-
      Firewall events on larkspur.shop, last 30 minutes: 40,880 POST /login, no rule matched, all allowed. https://dash.cloudflare.com/7c1e/security/events
  - tool: cloudflare_execute
    match: { code: /rate|ratelimit|rulesets/ }
    result: |-
      Created rate limiting rule "login stuffing 2026-10-10": POST /login, more than 10 a minute per IP from AS14061, AS16276, AS9009, block for 1 hour. Expires 2026-10-11 12:00 UTC. https://dash.cloudflare.com/7c1e/security/waf/rate-limiting-rules
  - tool: cloudflare_execute
    result: Done.
expect:
  outcome: >-
    It is credential stuffing: 41,200 failed logins in 30 minutes across 39,900 emails from three networks, all let
    through by the firewall, with 11 succeeding.
  next_step: >-
    It proposes a rate limit on POST /login for those networks that expires by default with a reminder before it does,
    asks once, adds it, and raises the 11 accounts that logged in from those networks.
  evidence: [ "security/events" ]
  calls: [ cloudflare_execute ]
  max_cents: 25
