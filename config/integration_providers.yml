  - key: jira
    name: Jira
    category: Issues
    mark: JR
    color: "#0052cc"
    description: Find issues tied to what broke, and open follow-up issues from an incident.
    # tools=all lists every tool on its own rather than behind Atlassian's discover and execute, so each is switched on
    # and granted by itself.
    server_url: https://mcp.atlassian.com/v2/mcp?tools=all
    # Firefight's own Atlassian OAuth 2.0 (3LO) app, which keeps incident items in step with issues and registers a
    # dynamic webhook that sends changes back (developer.atlassian.com/cloud/jira/platform/oauth-2-3lo-apps, and
    # /webhooks for the webhook). offline_access gives the refresh token Atlassian documents.
    app:
      label: Connect for issue sync
      authorization_endpoint: https://auth.atlassian.com/authorize
      token_endpoint: https://auth.atlassian.com/oauth/token
      scopes: [read:jira-work, write:jira-work, read:jira-user, manage:jira-webhook, offline_access]
      params: { audience: api.atlassian.com, prompt: consent }
      token_format: json
    # Atlassian files these under its read_jira and search_jira permission groups, which only read.
