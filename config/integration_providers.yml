        label: Project
        hint: One project's ref, found under Project Settings, to keep the connection to that project. Leave it empty to reach every project the account can see.
        placeholder: abcdefghijklmnopqrst
        query: project_ref
        optional: true
      - key: read_only
        label: Access
        hint: Read-only leaves out every tool that changes the database or the project.
        query: read_only
        default: "true"
        options:
          - { value: "true", label: Read-only }
          - { value: "false", label: Read and write }
    # Supabase has no token that is not a person's for its MCP server, which takes a personal access token as a header
    # (supabase.com/docs/guides/getting-started/mcp, supabase.com/docs/guides/platform/personal-access-tokens).
    token: { hint: "Use a scoped personal access token. Make it as a dedicated user, such as Firefight, so changes do not show as a teammate and the connection keeps working when someone leaves." }
    # The tools its server's published list marks as reads (test/fixtures/files/supabase_mcp_tools.txt says where it came from).
    read_only_tools: [list_edge_functions, get_edge_function, get_logs, query_logs, get_advisors, list_organizations, get_organization, list_projects,
                      get_project, get_cost, confirm_cost, get_project_url, get_publishable_keys, generate_typescript_types, list_tables,
                      list_extensions, list_migrations, list_branches, list_storage_buckets, get_storage_config, search_docs, list_notebooks,
                      get_notebook]
    source_links: firefight
    map: firefight
    scaling: none
    scaling_note: "It holds databases rather than services that run copies."
    history: none
    history_note: "Its server lists migrations by version and name without when they ran, and offers no branch action runs, the only runs Supabase times."
    setting_words: [SUPABASE]
