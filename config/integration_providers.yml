    # Turning a flag on or off, or changing who gets it, changes what customers see, so it is undone after a while unless kept.
    mitigation_tools: [feature_flag_disable, feature_flag_enable, update_feature_flag, feature_flag_set_release_condition_rollout]
    # The server marks these read only, but agent-feedback sends what it is given to PostHog, and each -prepare tool stores
    # a change for its -execute twin to make (PostHog/posthog, services/mcp/src/tools/feedback/submit.ts and
    # confirmed-action-runtime.ts), so each asks to be confirmed like any change.
    write_tools: [agent_feedback, access_control_default_rule_set_prepare, access_control_member_rule_set_prepare, access_control_role_rule_set_prepare,
