  - key: supabase
    name: Supabase
    category: Databases
    mark: SB
    color: "#3ecf8e"
    status_page: { url: https://status.supabase.com, feed: statuspage }
    hosts: [ supabase.co, supabase.com, pooler.supabase.com ]
    description: Read-only queries, project state and Edge Functions for a Supabase database, and resetting a preview branch when you allow it.
    server_url: https://mcp.supabase.com/mcp
    site: https://supabase.com/dashboard
    connect_fields:
      - key: project_ref
        label: Project
        hint: One project's ref, found under Project Settings, to keep the connection to that project. Leave it empty to reach every project the account can see.
        placeholder: abcdefghijklmnopqrst
        query: project_ref
        optional: true
      - key: read_only
        label: Access
        hint: Read-only leaves out every tool that changes the database or the project.
        query: read_only
        default: "true"
        options:
          - { value: "true", label: Read-only }
          - { value: "false", label: Read and write }
    # Supabase has no token that is not a person's for its MCP server, which takes a personal access token as a header
    # (supabase.com/docs/guides/getting-started/mcp, supabase.com/docs/guides/platform/personal-access-tokens).
    token: { hint: "Use a scoped personal access token. Make it as a dedicated user, such as Firefight, so changes do not show as a teammate and the connection keeps working when someone leaves." }
