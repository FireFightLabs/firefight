# Curated integration catalog shown on Configure -> Integrations.
# Providers connect through the generic MCP connector unless kind: native
# marks one as executing through a first-party pack registered in
# Integrations::NativePack (a pack is code; this listing stays config).
# server_url pre-fills the connect flow where an official MCP endpoint is
# known (blank = the admin pastes their own). mark/color drive the logo
# tile until real brand assets land.
# source_links says how a result links back to the page it came from, since a result nobody can check at its source
# is worth little: firefight (a pack or a builder in Integrations::SourceLinks adds the link), server (the provider's
# own results already carry one), none (there is no page) or unchecked (not yet verified against a real connection).
# server and none carry a source_links_note saying why. A new provider is never unchecked.
# map says whether what a provider holds is on the resource map: firefight (a pack's map_of or a reader in
# McpExecutor::MAP_READERS puts it there), none (it holds no infrastructure, and map_note says why) or unchecked (it
# may, and no reader exists yet). A new provider that holds infrastructure lands with its reader.
# Section headings on the gallery. A provider naming a category that is not
# listed here still renders, it just shows no tagline, so adding a provider
# in a new category stays a registry edit rather than a code change.
categories:
  Code: Correlate incidents with what shipped
  Issues: Tickets and follow-up work tied to incidents
  Telemetry: Logs, metrics and traces for investigations
  Errors: Error tracking tied to incidents
  Knowledge: Runbooks and documentation as context
  Databases: Read-only data checks
  Edge: Traffic, security and caching in front of your app
  Custom: Anything with an MCP server

providers:
  - key: github
    name: GitHub
    category: Code
    mark: GH
    color: "#24292f"
    description: Correlate incidents with recent pull requests and commits from your repositories.
    server_url: ""
    kind: native
    source_links: firefight
    map: firefight
  - key: gitlab
    name: GitLab
    category: Code
    mark: GL
    color: "#fc6d26"
    description: Correlate incidents with merge requests and pipelines.
    server_url: https://gitlab.com/api/v4/mcp
    source_links: unchecked
    map: unchecked
  - key: newrelic
    name: New Relic
    category: Telemetry
    mark: NR
    color: "#1ce783"
    description: Query logs, metrics and traces during investigations.
    server_url: ""
    source_links: unchecked
    map: none
    map_note: "It watches what runs elsewhere and runs nothing of its own."
  - key: datadog
    name: Datadog
    category: Telemetry
    mark: DD
    color: "#632ca6"
    description: Query logs, metrics and monitors during investigations.
    server_url: https://mcp.datadoghq.com/api/unstable/mcp-server/mcp
    source_links: unchecked
    map: none
    map_note: "It watches what runs elsewhere and runs nothing of its own."
  - key: northflank
    name: Northflank
    category: Telemetry
    mark: NF
    color: "#0aa4d8"
    description: Logs, metrics and builds of the services and databases in a Northflank project, and fixes applied to them when the API token's role allows it.
    server_url: ""
    kind: native
    connect_with: api_token
    source_links: firefight
    map: firefight
  - key: grafana
    name: Grafana
    category: Telemetry
    mark: GF
    color: "#f46800"
    description: Reach dashboards and datasources behind your Grafana.
    server_url: ""
    source_links: unchecked
    map: none
    map_note: "It watches what runs elsewhere and runs nothing of its own."
  - key: cloudflare
    name: Cloudflare
    category: Edge
    mark: CF
    color: "#f38020"
    description: Read traffic, security events, DNS and cache, and block IPs, add rules or purge the cache when you allow it.
    server_url: https://mcp.cloudflare.com/mcp
    # The server marks only execute as a write. search reads the API's own spec and docs reads the documentation.
    read_only_tools: [search, docs]
    source_links: firefight
    map: firefight
  - key: sentry
    name: Sentry
    category: Errors
    mark: SN
    color: "#362d59"
    description: Search error issues and releases tied to an incident.
    server_url: https://mcp.sentry.dev/mcp
    source_links: unchecked
    map: none
    map_note: "It collects errors from what runs elsewhere and runs nothing of its own."
  - key: linear
    name: Linear
    category: Issues
    mark: LN
    color: "#5E6AD2"
    description: Read issues, projects and cycles, and open follow-up work from an incident.
    server_url: https://mcp.linear.app/mcp
    source_links: unchecked
    map: none
    map_note: "It holds issues, not infrastructure."
  - key: notion
    name: Notion
    category: Knowledge
    mark: NO
    color: "#111111"
    description: Bring runbook and architecture pages into investigations.
    server_url: https://mcp.notion.com/mcp
    source_links: server
    source_links_note: "Its results carry each page's own address."
    map: none
    map_note: "It holds documents, not infrastructure."
  - key: confluence
    name: Confluence
    category: Knowledge
    mark: CF
    color: "#1868db"
    description: Bring team documentation into investigations.
    server_url: ""
    source_links: unchecked
    map: none
    map_note: "It holds documents, not infrastructure."
  - key: neon
    name: Neon
    category: Databases
    mark: NE
    color: "#00e599"
    description: Read-only queries and branch history for a Neon Postgres database.
    server_url: https://mcp.neon.tech/mcp
    source_links: unchecked
    map: unchecked
  - key: supabase
    name: Supabase
    category: Databases
    mark: SB
    color: "#3ecf8e"
    description: Read-only queries and project state for a Supabase database.
    server_url: https://mcp.supabase.com/mcp
    source_links: unchecked
    map: unchecked
  - key: planetscale
    name: PlanetScale
    category: Databases
    mark: PS
    color: "#000000"
    description: Read-only queries, branch schemas and Insights for a PlanetScale database.
    server_url: https://mcp.pscale.dev/mcp/planetscale
    source_links: firefight
    map: firefight
  - key: postgresql
    name: PostgreSQL
    category: Databases
    mark: PG
    color: "#336791"
    description: Read-only queries, table shapes and live activity on your database, straight from a connection URL.
    server_url: ""
    kind: native
    connect_with: connection_url
    source_links: none
    source_links_note: "A database reached by its own connection URL has no page to open."
    map: unchecked
  - key: custom_mcp
    name: Custom MCP server
    category: Custom
    mark: MC
    color: "#1f2430"
    description: Point Firefight at any MCP server and allowlist its tools.
    server_url: ""
    source_links: none
    source_links_note: "A custom server is the team's own, so its results carry whatever links it gives."
    map: none
    map_note: "A custom server is the team's own, so Firefight cannot know what it holds."
