  - key: cloudflare
    name: Cloudflare
    category: Cloud and hosting
    specialist: cloud
    mark: CF
    color: "#f38020"
    status_page: { url: https://www.cloudflarestatus.com, feed: statuspage }
    hosts: [ api.cloudflare.com, workers.dev, pages.dev, r2.cloudflarestorage.com ]
    description: Read traffic, security events, DNS and cache, and block IPs, add rules or purge the cache when you allow it.
    server_url: https://mcp.cloudflare.com/mcp
    # The server marks only execute as a write. search reads the API's own spec and docs reads the documentation.
    read_only_tools: [search, docs]
    # An account API token acts as a service principal rather than a person
    # (developers.cloudflare.com/fundamentals/api/get-started/account-owned-tokens), and the hosted server takes user and
    # account tokens as Bearer (developers.cloudflare.com/agents/model-context-protocol/cloudflare/servers-for-cloudflare).
    token: { hint: "Use an account API token, from Manage account, Account API tokens. It belongs to the account rather than a person, so it keeps working when someone leaves." }
    source_links: firefight
    map: firefight
    scaling: none
    scaling_note: "Its Workers and sites run at every edge location on demand, so there is no count of copies to read."
    history: firefight
    # What a person reads beside each tool, by the name Firefight gives it (Integrations::ToolSummaries).
    tool_summaries:
      docs: "Searches the Cloudflare documentation."
      execute: "Reads, creates, updates or deletes resources in the Cloudflare account."
      search: "Searches the Cloudflare API reference for the right operation."
      whoami: "Shows the Cloudflare user or account this connection signs in as."
  - key: kubernetes
    name: Kubernetes
    category: Cloud and hosting
    mark: K8
    color: "#326ce5"
    description: Pod logs, current usage, rollouts, job runs and events in your cluster's namespaces, and rollbacks, restarts, scaling, pausing a rollout and starting or suspending a cronjob when you allow it.
    server_url: ""
    kind: native
    connect_with: api_token
    # Namespace names are DNS labels, as the Kubernetes API reference gives them. * reads every namespace the token can.
    connect_fields:
      - key: server
        label: API server
        hint: The cluster's API server address, as server in your kubeconfig. Firefight reaches it over the internet.
        placeholder: https://cluster.example.com:6443
        pattern: 'https://[A-Za-z0-9.\-\[\]:]+(/[A-Za-z0-9._~%!$&()*+,;=:@\-/]*)?'
        allowed: an https address, such as https://cluster.example.com:6443
      - key: namespaces
        label: Namespaces
        hint: The namespaces this environment reaches, separated by commas, or * for every namespace the token can read.
        placeholder: production, payments
        pattern: '\*|[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\s*,\s*[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*'
        allowed: namespace names separated by commas, or * alone
    source_links: none
    source_links_note: "Kubernetes has no hosted console of its own, and the dashboard a team may run sits at an address Firefight does not know, so each answer names the kubectl command that shows the same."
    map: firefight
    scaling: firefight
    scaling_note: "A deployment or stateful set counts the replicas it wants, which an autoscaler moves too. A daemon set counts the pods it schedules, one per node."
    history: firefight
    stopping_tools: [rollout_pause, suspend_cronjob]
