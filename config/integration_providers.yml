# Curated integration catalog shown on Configure -> Integrations.
# Providers connect through the generic MCP connector unless kind: native
# marks one as executing through a first-party pack, named by its provider
# definition in app/services/integrations/providers/<key>.rb. A pack is code,
# and this listing stays config.
# server_url pre-fills the connect flow where an official MCP endpoint is
# known (blank = the admin pastes their own). mark/color drive the logo
# tile until real brand assets land.
# source_links says how a result links back to the page it came from, since a result nobody can check at its source
# is worth little: firefight (a pack or a builder in Integrations::SourceLinks adds the link), server (the provider's
# own results already carry one), none (there is no page) or unchecked (not yet verified against a real connection).
# server and none carry a source_links_note saying why. A new provider is never unchecked.
# map says whether what a provider holds is on the resource map: firefight (a pack's map_of or the map_reader its
# provider definition names puts it there), none (it holds no infrastructure, and map_note says why) or unchecked (it
# may, and no reader exists yet). A new provider that holds infrastructure lands with its reader.
# scaling says whether the map counts the copies a provider's services run (instances), so a scale is a change on the
# map and starts a Service scaled trigger: firefight (its map reader counts them) or none (it runs no copies it could
# count, and scaling_note says why). Only a provider on the map says, and scaling_note may say what a firefight one
# counts, such as a service that scales on its own having no one count.
# history says whether Halon can read how long the provider's runs take (its CI runs, builds or deploys, through the
# run_history capability its adapter answers), which a watch learns its time limit from: firefight (its adapter answers
# it) or none (it has no such runs, or does not say when they started and finished, and history_note says why).
# site is the address of the app of a provider that runs in one place, which links open, read through
# Integrations::ConnectionSettings#site.
# regions lists where a provider runs its service when it offers more than one place, such as a US and an EU site. Each
# has a key, a label, its MCP server's server_url, the site its app is at, which links open, and authorization_endpoint
# and token_endpoint only where its OAuth endpoints are not the ones its server names. A provider with regions lists no
# server_url of its own, and the first region is the one a connection that names none reaches. The connect dialog offers
# the choice when there is more than one, and the connection keeps it.
# connect_fields are what the connect form asks for beside the credentials, each with a key, label, hint and placeholder,
# and optionally numeric, optional, path, scope (what the connection reads, such as projects, which holds one, several or
# all the credential can read, listed live from it), and pattern with allowed (the shape a value must have, and in words what that
# allows, which the form says when a value does not fit). None is a secret. A path field is part of the server's
# address, appended in the order listed, such as an organization and then a project, and belongs to the connection. A
# path field without a pattern takes a slug's, so no value carries a slash, a query or a fragment into the address.
# Every other field belongs to the environment it was connected for. The code behind a provider reads them through
# Integrations::ConnectionSettings, never from the row.
# oauth_scopes are the scopes signing in asks for where the server lists ones that change things Firefight should not be
# asked for, each one the server lists. Without it, every scope the server lists is asked for. consent_note is what the
# connect form says about the provider's consent screen, such as which access to leave off. own_server is for a provider
# whose hosted server takes only a sign-in while the server a team runs itself takes a token: the token form starts
# empty, with its placeholder and hint. token is what the token form says for a provider reached through its MCP
# server, a hint under the token, such as which identity that is not one person to make it for, and the header its
# server reads the token from when that is not Authorization, which then holds the token alone.
# setting_words are words in a service's setting names that point at this provider's stores, such as NEON in
# NEON_DATABASE_URL. The map's matcher reads them as a clue when a setting's value is hidden or names no address a store
# reported.
# mitigation_tools are tools whose change customers feel for a while, such as turning a feature flag off, so a change Halon
# makes through one is undone after a time the person sees and can change, unless someone keeps it. stopping_tools end
# or remove something someone started, such as cancelling a run, so its pack asks whoever started it first. Neither
# lists a general tool that reaches a whole API, since which call it makes is only known when it is called.
# safe_tools are tools whose change is harmless or easy to put back, and changes no data, access, money or where
# production traffic goes, such as assigning an issue or asking for a review, so Halon makes it without asking when the
# workspace lets it and says what it did. Every other change is risky and asks. A tool on a remote server is listed only
# where its own documentation makes that plain, and a restart, a scale or a rollback is never listed, since the
# capability decides those call by call from a live count (Integrations::SafeChanges). undo_tools gives a safe tool the
# one fixed call that puts it back, on the same connection: the tool, and each of its arguments taken from the call's
# own argument of that name, from a value the tool's answer named (result.<name>), or as written (=<value>). Only a tool
# here offers Undo, and no model ever writes one. A temporary change, such as a flag turned off, is put back the same way
# when its tool is here, and otherwise Halon is asked in the chat to put it back, where its call asks like any change.
# safe_until_outside_tools are safe only while nothing from outside has reached the chat, since outside text could
# steer their words or effect: a comment or a note, a label, and running a repository's tests, whose command reaches
# the network from the sandbox. Running CI again is never safe, since a run can deploy. access_tools change who can
# reach something or set a secret, so a person is always asked and the list of what Halon may do without asking never
# holds one.
# tool_summaries are the one plain line a person reads beside each of the server's tools, by the name Firefight gives
# the tool, at most 90 characters (Integrations::ToolSummaries). A tool's own description is written for the model and
# never shown, and a tool not listed shows the first sentence of it.
# status_page is the provider's public status page and hosts the domains its API and apps answer on, read with the
# outside systems in config/upstreams.yml, which says what each means. A provider that runs only where its customer runs
# it, such as Kubernetes, has neither.
# holds_flags marks a provider that keeps a team's feature flags, so what changed around a resource says that flag changes
# are kept there and read with its own tools.
# holds_status_pages marks a provider that hosts its customers' own status pages, so a workflow's Status page update step
# offers its connection's tools that change something.
# holds_code marks a code host, whose repositories a code change can be written to. Each of its connections keeps the
# paths Halon may not change (Integration::CodeChanges), which its page shows under Code changes.
# test_logins marks the provider whose connections keep the test logins Halon's browser signs in with
# (Integrations::SiteLogins). It is never offered on the gallery and none of its connections is one of the workspace's.
# Section headings on the gallery, listed in the order the gallery shows them. A provider naming a category that is
# not listed here still renders, it just shows no tagline, so adding a provider in a new category stays a registry edit
# rather than a code change. Each has a tagline, halon (what Halon can do with a tool from it, in a sentence or two,
# which setup shows as it walks through every category), required (setup asks for a connection in it and offers no
# "We don't use this") and in_first_question (setup's first question to Halon names the tools connected in it). group,
# when set, is what Halon's map of tool groups says of the category in place of the tagline. specialist names the kind
# of question its tools answer when Halon asks specialists (Chat::Specialists::DOMAINS): code, deploys, observability,
# databases, cloud, tickets or on_call. A provider's own specialist wins over its category's, for a cloud whose
# resources and bill sit beside the hosts that only run apps. A category without one, such as Custom, stays Halon's own.
categories:
  Cloud and hosting:
    specialist: deploys
    tagline: Where your apps run, and what you can change there
    halon: Halon sees what runs where, what was deployed and how it is doing. When you allow it, it can make changes there too.
    required: true
    in_first_question: true
  Observability:
    specialist: observability
    tagline: Logs, metrics, traces and errors for investigations
    halon: Halon searches your logs, metrics, traces and errors to find what broke and when it started.
    required: true
  Alerting and on-call:
    specialist: on_call
    tagline: Who is on call, and the alerts and incidents paging them
    halon: Halon sees which alerts fired and who is on call, so it can say who was paged and why.
  Status pages:
    tagline: What your customers see about an incident or planned work
    halon: Halon reads what your status pages tell customers, and when you allow it, posts and updates incidents and maintenance there.
  Product analytics:
    specialist: observability
    tagline: Who an incident reaches, what they saw, and the feature flags behind it
    halon: Halon checks how many people an incident reached, what they saw and which feature flags changed.
  Databases:
    specialist: databases
    tagline: Your data and how it is set up
    halon: Halon reads how your databases are set up and how they are doing, such as slow queries and connections, to tell when data is the cause.
    in_first_question: true
  Code:
    specialist: code
    tagline: Correlate incidents with what shipped
    group: Commits, pull requests, deploys and CI of your repositories, and code changes, which Firefight's own coding agent writes here with fix_code and opens as a pull request, no coding agent needed
    halon: Halon matches an incident to the commits, pull requests and deploys that shipped just before it. It can also write a fix and open a pull request when you ask.
    required: true
  CI:
    specialist: deploys
    tagline: Builds, tests and their logs, and rerunning them
    halon: Halon reads builds and test runs with their logs, and reruns one when you allow it.
  Coding agents:
    specialist: code
    tagline: Agents that write a fix's code change and open the pull request
    group: Outside coding agents a workspace chose to write code changes instead of Firefight's own. Never needed for a code change or a pull request, which Firefight's own coding agent writes from the Code group
    halon: Halon hands a fix to your coding agent, which writes the change and opens the pull request.
  Issues:
    specialist: tickets
    tagline: Tickets and follow-up work tied to incidents
    halon: Halon reads the tickets tied to an incident, and when you allow it, files the follow-up work there.
  Knowledge:
    specialist: tickets
    tagline: Runbooks and documentation as context
    halon: Halon reads your runbooks and docs as context while it investigates.
  Custom:
    tagline: Anything with an MCP server
    halon: Halon uses the tools you switch on from any MCP server you connect.

providers:
  - key: github
    safe_tools: [comment_on_issue, comment_on_pull_request, reply_to_review_comment, label_issue, label_pull_request, assign_issue, run_tests, request_reviewers]
    safe_until_outside_tools: [comment_on_issue, comment_on_pull_request, reply_to_review_comment, label_issue, label_pull_request, run_tests]
    undo_tools:
      comment_on_issue: { tool: delete_issue_comment, arguments: { repo: repo, comment_id: result.comment_id } }
      comment_on_pull_request: { tool: delete_pull_request_comment, arguments: { repo: repo, comment_id: result.comment_id } }
      reply_to_review_comment: { tool: delete_pull_request_comment, arguments: { repo: repo, comment_id: result.comment_id, review: "=true" } }
      label_issue: { tool: label_issue, arguments: { repo: repo, number: number, add: remove, remove: add } }
      label_pull_request: { tool: label_pull_request, arguments: { repo: repo, number: number, add: remove, remove: add } }
      assign_issue: { tool: assign_issue, arguments: { repo: repo, number: number, add: remove, remove: add } }
    access_tools: [set_actions_secret]
    name: GitHub
    category: Code
    mark: GH
    color: "#24292f"
    status_page: { url: https://www.githubstatus.com, feed: statuspage }
    hosts: [ api.github.com, github.com, githubusercontent.com, ghcr.io ]
    description: Correlate incidents with recent pull requests, commits and GitHub Actions runs from your repositories, read issues, releases, checks and security alerts, and when you allow it, comment on, review, close or merge pull requests, work on issues, and rerun, start or cancel a workflow.
    server_url: ""
    kind: native
    site: https://github.com
    source_links: firefight
    map: firefight
    scaling: none
    scaling_note: "It holds repositories and runs CI, which run no copies of a service."
    history: firefight
    code_fix_tool: fix_code
    holds_code: true
    stopping_tools: [cancel_workflow]
  - key: gitlab
    safe_tools: [run_tests]
    safe_until_outside_tools: [run_tests]
    name: GitLab
    category: Code
    mark: GL
    color: "#fc6d26"
    status_page: { url: https://status.gitlab.com, feed: page }
    hosts: [ gitlab.com, registry.gitlab.com ]
    description: Merge requests, deployments, pipelines and code of your projects, on GitLab.com or your own GitLab, and retry, run or cancel a pipeline when you allow it.
    # GitLab's own MCP server stays available from the connect dialog, and connections made through it keep running.
    server_url: https://gitlab.com/api/v4/mcp
    site: https://gitlab.com
    kind: native
    connect_with: api_token
    connect_fields:
      - key: url
        label: GitLab address
        hint: The address of your own GitLab, such as https://gitlab.example.com. Leave it empty for GitLab.com.
        placeholder: https://gitlab.com
        optional: true
        pattern: "https://[^\\s/?#@]+(/[^\\s?#]*)?"
        allowed: an https address, without a query or credentials
    # A group access token makes a bot user rather than acting as a person, with read_api and read_repository, on
    # GitLab.com Premium or Ultimate and on any self-managed GitLab (docs.gitlab.com/user/group/settings/group_access_tokens).
    source_links: firefight
    map: firefight
    scaling: none
    scaling_note: "It holds repositories and runs CI, which run no copies of a service."
    history: firefight
    holds_code: true
    stopping_tools: [cancel_pipeline]
  - key: bitbucket
    safe_tools: [run_tests]
    safe_until_outside_tools: [run_tests]
    name: Bitbucket
    category: Code
    mark: BB
    color: "#0052cc"
    status_page: { url: https://bitbucket.status.atlassian.com, feed: statuspage }
    hosts: [ api.bitbucket.org, bitbucket.org ]
    description: Pull requests, deployments, pipelines and code of the repositories in your Bitbucket workspaces, and rerun, run or stop a pipeline when you allow it.
    # Atlassian's MCP server reaches Bitbucket only for a workspace linked to an organization, and cannot fetch code.
    server_url: ""
    site: https://bitbucket.org
    kind: native
    connect_with: api_token
    connect_fields:
      - key: workspace
        label: Workspaces
        hint: The Bitbucket workspaces this connection reads, by the id after bitbucket.org/ in their repositories' addresses. Choose one or several, or all this token can read, which takes in a workspace added later at the next sweep.
        placeholder: Choose workspaces
        scope: true
    # A workspace access token is tied to the workspace, not a user, on Premium, and is sent as Bearer
    # (support.atlassian.com/bitbucket-cloud/docs/using-workspace-access-tokens).
    source_links: firefight
    map: firefight
    scaling: none
    scaling_note: "It holds repositories and runs CI, which run no copies of a service."
    history: firefight
    holds_code: true
    stopping_tools: [cancel_pipeline]
  - key: circleci
    name: CircleCI
    category: CI
    mark: CI
    color: "#343434"
    status_page: { url: https://status.circleci.com, feed: statuspage }
    hosts: [ circleci.com ]
    description: Read pipelines, workflows and failing jobs with their logs and tests, and rerun a workflow when you allow it.
    # CircleCI's cloud runs in one place, and its hosted server is the one address its docs give.
    server_url: https://mcp.circleci.com/v1/mcp
    site: https://app.circleci.com
    # Personal API tokens are the only tokens API v2 and the MCP server take
    # (circleci.com/docs/guides/toolkit/api-developers-guide, circleci.com/docs/guides/toolkit/connecting-to-the-circleci-mcp-server).
    token: { hint: "Use a personal API token. Make it as a dedicated user, such as Firefight, so changes do not show as a teammate and the connection keeps working when someone leaves." }
    # The tools its server's published list marks as reads (test/fixtures/files/circleci_mcp_tools.txt says where it came from).
    read_only_tools: [hello, list_runs, get_run, list_workflows, get_workflow, list_jobs, get_job, get_job_logs, list_artifacts, list_job_tests]
    source_links: firefight
    map: none
    history: none
    history_note: "CircleCI's hosted server documents its tools by name only, not what list_runs answers, so when a run started and finished cannot be read with confidence. The code host that holds the repository answers how long its runs take."
    map_note: "It builds and tests code that its host puts on the map and runs nothing of its own."
    # What a person reads beside each tool, by the name Firefight gives it (Integrations::ToolSummaries).
    tool_summaries:
      cancel_workflow: "Cancels a running workflow."
      download_usage_data: "Starts an export of the organization's CircleCI usage data."
      get_job: "Shows one job with its status and duration."
      get_job_logs: "Shows the build output of a job."
      get_run: "Shows one pipeline run with its status and trigger."
      get_workflow: "Shows one workflow with its status and timing."
      hello: "Checks that the connection to CircleCI works."
      list_artifacts: "Lists the files a job saved as artifacts."
      list_job_tests: "Lists a job's test results, including failures."
      list_jobs: "Lists the jobs in a workflow."
      list_runs: "Lists recent pipeline runs for a project."
      list_workflows: "Lists the workflows in a pipeline run."
      rerun_workflow: "Reruns a workflow, in full or from the failed jobs."
  - key: newrelic
    name: New Relic
    category: Observability
    mark: NR
    color: "#1ce783"
    status_page: { url: https://status.newrelic.com, feed: statuspage }
    hosts: [ newrelic.com, nr-data.net, eu01.nr-data.net ]
    description: Query logs, metrics and traces.
    # New Relic's data centers (docs/accounts/accounts-billing/account-setup/choose-your-data-center), each with the MCP
    # server its setup guide gives (docs/agentic-ai/mcp/setup) and the app address its platform introduction gives.
    regions:
      - { key: us, label: US (one.newrelic.com), server_url: "https://mcp.newrelic.com/mcp/", site: "https://one.newrelic.com" }
      - { key: eu, label: EU (one.eu.newrelic.com), server_url: "https://mcp.eu.newrelic.com/mcp/", site: "https://one.eu.newrelic.com" }
      - { key: jp, label: Japan (one.jp.newrelic.com), server_url: "https://mcp.jp.newrelic.com/mcp/", site: "https://one.jp.newrelic.com" }
    connect_fields:
      - key: account_id
        label: Account ID
        hint: The id of the New Relic account this environment reports to. New Relic lists it in the account picker, or under Administration, Access management, Accounts.
        placeholder: "1234567"
        numeric: true
    # New Relic's tool reference (docs.newrelic.com/docs/agentic-ai/mcp/tool-reference) documents every tool as a read.
    read_only_tools: [convert_time_period_to_epoch_ms, get_dashboard, get_entity, list_related_entities, list_available_new_relic_accounts,
                      list_dashboards, search_entity_with_tag, list_metric_names, execute_nrql_query, natural_language_to_nrql_query,
                      list_alert_conditions, search_incident, list_alert_policies, list_recent_issues, list_synthetic_monitors,
                      list_synthetic_monitor_results, get_synthetic_check_statistics, analyze_deployment_impact, generate_alert_insights_report,
                      generate_user_impact_report, list_entity_error_groups, list_change_events, get_error_statistics, search_errors,
                      analyze_entity_logs, analyze_golden_metrics, analyze_kafka_metrics, analyze_threads, analyze_transactions,
                      list_garbage_collection_metrics, list_recent_logs, list_entity_performance_risk_groups, get_metric_statistics,
                      get_log_statistics, get_distributed_trace_details, search_traces, analyze_trace_anomaly, analyze_service_dependencies]
    source_links: firefight
    map: none
    history: none
    history_note: "It watches what runs elsewhere and keeps no builds or deploys of its own whose length could be read."
    map_note: "It watches what runs elsewhere and runs nothing of its own."
    # What a person reads beside each tool, by the name Firefight gives it (Integrations::ToolSummaries).
    tool_summaries:
      analyze_deployment_impact: "Compares a service's performance before and after a deploy."
      analyze_entity_logs: "Finds error patterns and anomalies in an entity's logs."
      analyze_golden_metrics: "Reviews an entity's throughput, latency and error rate for problems."
      analyze_kafka_metrics: "Reviews Kafka consumer lag, throughput and broker health."
      analyze_service_dependencies: "Maps a service's upstream and downstream dependencies and their health."
      analyze_threads: "Reviews thread counts and states of an application for contention."
      analyze_trace_anomaly: "Explains what makes a slow or failing trace different from normal."
      analyze_transactions: "Finds slow or failing transactions of a service."
      convert_time_period_to_epoch_ms: "Converts a time period like last hour into exact start and end timestamps."
      execute_nrql_query: "Runs a NRQL query and returns the results."
      generate_alert_insights_report: "Builds a report on alert activity, noise and patterns."
      generate_user_impact_report: "Builds a report on how an issue affected end users."
      get_dashboard: "Shows one dashboard with its pages and widgets."
      get_distributed_trace_details: "Shows one distributed trace with its spans and timings."
      get_entity: "Shows details of a monitored entity such as a service, host or browser app."
      get_error_statistics: "Summarizes error counts and rates for an entity over time."
      get_log_statistics: "Summarizes log volume and levels over a time range."
      get_metric_statistics: "Summarizes a metric's values over a time range."
      get_synthetic_check_statistics: "Summarizes success rate and duration of a synthetic monitor's checks."
      list_alert_conditions: "Lists the conditions defined in an alert policy."
      list_alert_policies: "Lists the alert policies in an account."
      list_available_new_relic_accounts: "Lists the New Relic accounts you can access."
      list_change_events: "Lists deploys and other change events recorded for an entity."
      list_dashboards: "Lists the dashboards in an account."
      list_entity_error_groups: "Lists the grouped errors of an entity in errors inbox."
      list_entity_performance_risk_groups: "Lists groups of entities whose performance is at risk."
      list_garbage_collection_metrics: "Shows garbage collection timings and counts of an application."
      list_metric_names: "Lists the metric names reported for an entity or account."
      list_recent_issues: "Lists recently opened alert issues."
      list_recent_logs: "Lists the most recent log lines for an entity or account."
      list_related_entities: "Lists the entities connected to a given entity."
      list_synthetic_monitor_results: "Shows recent check results of a synthetic monitor."
      list_synthetic_monitors: "Lists the synthetic monitors in an account."
      natural_language_to_nrql_query: "Turns a plain language question into a NRQL query and runs it."
      search_entity_with_tag: "Finds entities that carry a given tag."
      search_errors: "Searches error events by message, class or entity."
      search_incident: "Searches alert incidents by state, time or entity."
      search_traces: "Searches distributed traces by service, duration or errors."
  - key: datadog
    name: Datadog
    category: Observability
    mark: DD
    color: "#632ca6"
    status_page: { url: https://status.datadoghq.com, feed: statuspage }
    hosts: [ datadoghq.com, datadoghq.eu, us3.datadoghq.com, us5.datadoghq.com ]
    description: Query logs, metrics and monitors.
    # Datadog's sites (docs.datadoghq.com/getting_started/site) with the MCP server each one documents
    # (DataDog/documentation, hugo/assets/scripts/config/regions.config.js, mcp_server_endpoint). US1-FED and US2-FED
    # have no MCP server, so they are not offered. Without toolsets the server offers only core, so each address asks for
    # error-tracking too, which Firefight's errors capability and its skills read (docs.datadoghq.com/mcp_server/setup).
    regions:
      - { key: us1, label: US1 (app.datadoghq.com), server_url: "https://mcp.datadoghq.com/v1/mcp?toolsets=core,error-tracking", site: "https://app.datadoghq.com" }
      - { key: us3, label: US3 (us3.datadoghq.com), server_url: "https://mcp.us3.datadoghq.com/v1/mcp?toolsets=core,error-tracking", site: "https://us3.datadoghq.com" }
      - { key: us5, label: US5 (us5.datadoghq.com), server_url: "https://mcp.us5.datadoghq.com/v1/mcp?toolsets=core,error-tracking", site: "https://us5.datadoghq.com" }
      - { key: eu1, label: EU1 (app.datadoghq.eu), server_url: "https://mcp.datadoghq.eu/v1/mcp?toolsets=core,error-tracking", site: "https://app.datadoghq.eu" }
      - { key: ap1, label: AP1 (ap1.datadoghq.com), server_url: "https://mcp.ap1.datadoghq.com/v1/mcp?toolsets=core,error-tracking", site: "https://ap1.datadoghq.com" }
      - { key: ap2, label: AP2 (ap2.datadoghq.com), server_url: "https://mcp.ap2.datadoghq.com/v1/mcp?toolsets=core,error-tracking", site: "https://ap2.datadoghq.com" }
      - { key: uk1, label: UK1 (uk1.datadoghq.com), server_url: "https://mcp.uk1.datadoghq.com/v1/mcp?toolsets=core,error-tracking", site: "https://uk1.datadoghq.com" }
    # The reads of the core and error-tracking toolsets, as Datadog's tool reference (docs.datadoghq.com/mcp_server/tools)
    # describes them, so a lookup never asks to be confirmed whatever the server marks.
    read_only_tools: [search_datadog_events, get_datadog_incident, get_datadog_metric, get_datadog_metric_context, search_datadog_monitors,
                      get_datadog_trace, search_datadog_dashboards, get_datadog_notebook, search_datadog_notebooks, search_datadog_hosts,
                      search_datadog_incidents, search_datadog_metrics, search_datadog_entities, search_datadog_spans, aggregate_spans,
                      analyze_datadog_logs, search_datadog_logs, search_datadog_rum_events, aggregate_rum_events, get_datadog_dashboard,
