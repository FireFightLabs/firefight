# Curated integration catalog shown on Configure -> Integrations.
# Providers connect through the generic MCP connector unless kind: native
# marks one as executing through a first-party pack registered in
# Integrations::NativePack (a pack is code; this listing stays config).
# server_url pre-fills the connect flow where an official MCP endpoint is
# known (blank = the admin pastes their own). mark/color drive the logo
# tile until real brand assets land.
# source_links says how a result links back to the page it came from, since a result nobody can check at its source
# is worth little: firefight (a pack or a builder in Integrations::SourceLinks adds the link), server (the provider's
# own results already carry one), none (there is no page) or unchecked (not yet verified against a real connection).
# server and none carry a source_links_note saying why. A new provider is never unchecked.
# map says whether what a provider holds is on the resource map: firefight (a pack's map_of or a reader in
# McpExecutor::MAP_READERS puts it there), none (it holds no infrastructure, and map_note says why) or unchecked (it
# may, and no reader exists yet). A new provider that holds infrastructure lands with its reader.
# site is the address of the app of a provider that runs in one place, which links open, read through
# Integrations::ConnectionSettings#site.
# regions lists where a provider runs its service when it offers more than one place, such as a US and an EU site. Each
# has a key, a label, its MCP server's server_url, the site its app is at, which links open, and authorization_endpoint
# and token_endpoint only where its OAuth endpoints are not the ones its server names. A provider with regions lists no
# server_url of its own, and the first region is the one a connection that names none reaches. The connect dialog offers
# the choice when there is more than one, and the connection keeps it.
# connect_fields are what the connect form asks for beside the credentials, each with a key, label, hint and placeholder,
# and optionally numeric, optional, path, and pattern with allowed (the shape a value must have, and in words what that
# allows, which the form says when a value does not fit). None is a secret. A path field is part of the server's
# address, appended in the order listed, such as an organization and then a project, and belongs to the connection. A
# path field without a pattern takes a slug's, so no value carries a slash, a query or a fragment into the address.
# Every other field belongs to the environment it was connected for. The code behind a provider reads them through
# Integrations::ConnectionSettings, never from the row.
# Section headings on the gallery. A provider naming a category that is not
# listed here still renders, it just shows no tagline, so adding a provider
# in a new category stays a registry edit rather than a code change.
# Listed in the order the gallery shows them.
categories:
  Cloud and hosting: Where your apps run, and what you can change there
  Observability: Logs, metrics, traces and errors for investigations
  Alerting and on-call: Who is on call, and the alerts and incidents paging them
  Product analytics: Who an incident reaches, what they saw, and the feature flags behind it
  Databases: Your data and how it is set up
  Code: Correlate incidents with what shipped
  CI: Builds, tests and their logs, and rerunning them
  Coding agents: Agents that write a fix's code change and open the pull request
  Issues: Tickets and follow-up work tied to incidents
  Knowledge: Runbooks and documentation as context
  Custom: Anything with an MCP server

providers:
  - key: github
    name: GitHub
    category: Code
    mark: GH
    color: "#24292f"
    description: Correlate incidents with recent pull requests and commits from your repositories.
    server_url: ""
    kind: native
    site: https://github.com
    source_links: firefight
    map: firefight
    code_fix_tool: fix_code
  - key: gitlab
    name: GitLab
    category: Code
    mark: GL
    color: "#fc6d26"
    description: Correlate incidents with merge requests and pipelines.
    server_url: https://gitlab.com/api/v4/mcp
    site: https://gitlab.com
    source_links: unchecked
    map: unchecked
  - key: newrelic
    name: New Relic
    category: Observability
    mark: NR
    color: "#1ce783"
    description: Query logs, metrics and traces during investigations.
    server_url: ""
    source_links: unchecked
    map: none
    map_note: "It watches what runs elsewhere and runs nothing of its own."
  - key: datadog
    name: Datadog
    category: Observability
    mark: DD
    color: "#632ca6"
    description: Query logs, metrics and monitors.
    # Datadog's sites (docs.datadoghq.com/getting_started/site) with the MCP server each one documents
    # (DataDog/documentation, hugo/assets/scripts/config/regions.config.js, mcp_server_endpoint). US1-FED and US2-FED
    # have no MCP server, so they are not offered.
    regions:
      - { key: us1, label: US1 (app.datadoghq.com), server_url: "https://mcp.datadoghq.com/v1/mcp", site: "https://app.datadoghq.com" }
      - { key: us3, label: US3 (us3.datadoghq.com), server_url: "https://mcp.us3.datadoghq.com/v1/mcp", site: "https://us3.datadoghq.com" }
      - { key: us5, label: US5 (us5.datadoghq.com), server_url: "https://mcp.us5.datadoghq.com/v1/mcp", site: "https://us5.datadoghq.com" }
      - { key: eu1, label: EU1 (app.datadoghq.eu), server_url: "https://mcp.datadoghq.eu/v1/mcp", site: "https://app.datadoghq.eu" }
      - { key: ap1, label: AP1 (ap1.datadoghq.com), server_url: "https://mcp.ap1.datadoghq.com/v1/mcp", site: "https://ap1.datadoghq.com" }
      - { key: ap2, label: AP2 (ap2.datadoghq.com), server_url: "https://mcp.ap2.datadoghq.com/v1/mcp", site: "https://ap2.datadoghq.com" }
      - { key: uk1, label: UK1 (uk1.datadoghq.com), server_url: "https://mcp.uk1.datadoghq.com/v1/mcp", site: "https://uk1.datadoghq.com" }
    source_links: firefight
    map: none
    map_note: "It watches what runs elsewhere and runs nothing of its own."
  - key: northflank
    name: Northflank
    category: Cloud and hosting
    mark: NF
    color: "#0aa4d8"
    description: Logs, metrics and builds of the services and databases in a Northflank project, and fixes applied to them when you allow it.
    server_url: ""
    kind: native
    connect_with: api_token
    site: https://app.northflank.com
    connect_fields:
      - key: project
        label: Project
        hint: The id of the Northflank project this environment runs in, as it appears in the project's URL.
        placeholder: my-project
    source_links: firefight
    map: firefight
  - key: grafana
    name: Grafana
    category: Observability
    mark: GF
    color: "#f46800"
    description: Reach dashboards and datasources behind your Grafana.
    server_url: ""
    source_links: unchecked
    map: none
    map_note: "It watches what runs elsewhere and runs nothing of its own."
  - key: cloudflare
    name: Cloudflare
    category: Cloud and hosting
    mark: CF
    color: "#f38020"
    description: Read traffic, security events, DNS and cache, and block IPs, add rules or purge the cache when you allow it.
    server_url: https://mcp.cloudflare.com/mcp
    # The server marks only execute as a write. search reads the API's own spec and docs reads the documentation.
    read_only_tools: [search, docs]
    source_links: firefight
    map: firefight
  - key: sentry
    name: Sentry
    category: Observability
    mark: SN
    color: "#362d59"
    description: Search error issues and releases tied to an incident.
    server_url: https://mcp.sentry.dev/mcp
    source_links: unchecked
    map: none
    map_note: "It collects errors from what runs elsewhere and runs nothing of its own."
  - key: linear
    name: Linear
    category: Issues
    mark: LN
    color: "#5E6AD2"
    description: Read issues, projects and cycles, and open follow-up work from an incident.
    server_url: https://mcp.linear.app/mcp
    source_links: unchecked
    map: none
    map_note: "It holds issues, not infrastructure."
  - key: notion
    name: Notion
    category: Knowledge
    mark: NO
    color: "#111111"
    description: Bring runbook and architecture pages into investigations.
    server_url: https://mcp.notion.com/mcp
    source_links: server
    source_links_note: "Its results carry each page's own address."
    map: none
    map_note: "It holds documents, not infrastructure."
  - key: confluence
    name: Confluence
    category: Knowledge
    mark: CF
    color: "#1868db"
    description: Bring team documentation into investigations.
    server_url: ""
    source_links: unchecked
    map: none
    map_note: "It holds documents, not infrastructure."
  - key: neon
    name: Neon
    category: Databases
    mark: NE
    color: "#00e599"
    description: Read-only queries and branch history for a Neon Postgres database.
    server_url: https://mcp.neon.tech/mcp
    source_links: unchecked
    map: unchecked
  - key: supabase
    name: Supabase
    category: Databases
    mark: SB
    color: "#3ecf8e"
    description: Read-only queries and project state for a Supabase database.
    server_url: https://mcp.supabase.com/mcp
    source_links: unchecked
    map: unchecked
  - key: planetscale
    name: PlanetScale
    category: Databases
    mark: PS
    color: "#000000"
    description: Read-only queries, branch schemas and Insights for a PlanetScale database.
    server_url: https://mcp.pscale.dev/mcp/planetscale
    source_links: firefight
    map: firefight
  - key: postgresql
    name: PostgreSQL
    category: Databases
    mark: PG
    color: "#336791"
    description: Read-only queries, table shapes and live activity on your database, straight from a connection URL.
    server_url: ""
    kind: native
    connect_with: connection_url
    source_links: none
    source_links_note: "A database reached by its own connection URL has no page to open."
    map: unchecked
  # A coding agent writes a fix's code change in its own environment and opens the pull request itself. code_agent marks
  # one, which writes code changes only once an admin chooses it under Settings, Workspace, instead of Firefight's own.
  - key: devin
    name: Devin
    category: Coding agents
    mark: DV
    color: "#14213d"
    description: Hand a fix's code change to Devin, which writes it in its own environment and opens the pull request, while Firefight follows the session.
    server_url: ""
    kind: native
    connect_with: api_token
    source_links: firefight
    map: none
    map_note: "It writes code changes and runs nothing of yours."
    code_fix_tool: fix_code
    code_agent: true
    # Devin names an organization org- followed by its id (Devin's OpenAPI document, the org_id parameter).
    connect_fields:
      - { key: organization, label: Organization ID, hint: "Shown at the top of Settings, Devin API in Devin.", placeholder: "org-...", pattern: "org-[A-Za-z0-9_-]+", allowed: "org- followed by letters and numbers, as Devin shows it" }
      - { key: acu_limit, label: ACU limit per change, hint: "The most ACUs Devin may use on one change, which Devin enforces. Leave it empty for 5.", placeholder: "5", numeric: true, optional: true }
  - key: cursor
    name: Cursor
    category: Coding agents
    mark: CU
    color: "#0f0f0f"
    description: Hand a fix's code change to a Cursor cloud agent, which writes it and opens the pull request, while Firefight follows the run.
    server_url: ""
    kind: native
    connect_with: api_token
    source_links: firefight
    map: none
    map_note: "It writes code changes and runs nothing of yours."
    code_fix_tool: fix_code
    code_agent: true
  - key: factory
    name: Factory
    category: Coding agents
    mark: FA
    color: "#d9480f"
    description: Hand a fix's code change to a Factory Droid on your Droid Computer, which writes it and opens the pull request, while Firefight follows the session.
    # Factory's Global deployment and its separate EU one, each with its own API (api.factory.ai, api.eu.factory.ai) and
    # app, from Factory's Deployment Patterns page, EU deployment and data residency.
    regions:
      - { key: global, label: Global (app.factory.ai), site: "https://app.factory.ai" }
      - { key: eu, label: EU (app.eu.factory.ai), site: "https://app.eu.factory.ai" }
    connect_fields:
      - { key: computer, label: Droid Computer, hint: "The name of the Droid Computer the Droid works on, with your repositories cloned on it. A managed computer pushes and opens pull requests through the GitHub integration set up in Factory.", placeholder: "my-computer" }
    kind: native
    connect_with: api_token
    source_links: firefight
    map: none
    map_note: "It writes code changes and runs nothing of yours."
    code_fix_tool: fix_code
    code_agent: true
  - key: custom_mcp
    name: Custom MCP server
    category: Custom
    mark: MC
    color: "#1f2430"
    description: Point Firefight at any MCP server and allowlist its tools.
    server_url: ""
    source_links: none
    source_links_note: "A custom server is the team's own, so its results carry whatever links it gives."
    map: none
    map_note: "A custom server is the team's own, so Firefight cannot know what it holds."
