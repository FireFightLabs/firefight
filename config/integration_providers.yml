  # A coding agent writes a fix's code change in its own environment and opens the pull request itself. code_agent marks
  # one, which writes code changes only once an admin chooses it under Settings, Workspace, instead of Firefight's own.
  - key: devin
    name: Devin
    category: Coding agents
    mark: DV
    color: "#14213d"
    status_page: { url: https://www.devinstatus.com, feed: statuspage }
    hosts: [ api.devin.ai, devin.ai ]
    description: Hand a fix's code change to Devin, which writes it in its own environment and opens the pull request, while Firefight follows the session.
    server_url: ""
    kind: native
    connect_with: api_token
    source_links: firefight
    map: none
    history: none
    history_note: "It writes code changes and runs nothing of yours whose length could be read."
    map_note: "It writes code changes and runs nothing of yours."
    code_fix_tool: fix_code
    code_agent: true
    # Devin names an organization org- followed by its id (Devin's OpenAPI document, the org_id parameter).
    connect_fields:
      - { key: organization, label: Organization ID, hint: "The organization's id, shown at the top of Settings, Devin API in Devin.", placeholder: "org-...", pattern: "org-[A-Za-z0-9_-]+", allowed: "org- followed by letters, numbers, dashes and underscores" }
      - { key: max_acus, label: ACU limit per change, hint: "The most ACUs Devin may use on one change, which Devin enforces. Leave it empty for 5.", numeric: true, default: 5 }
  - key: cursor
    name: Cursor
    category: Coding agents
    mark: CU
    color: "#0f0f0f"
    status_page: { url: https://status.cursor.com, feed: statuspage }
    hosts: [ api.cursor.com, cursor.com ]
    description: Hand a fix's code change to a Cursor cloud agent, which writes it and opens the pull request, while Firefight follows the run.
    server_url: ""
    kind: native
    connect_with: api_token
    source_links: firefight
    map: none
    history: none
    history_note: "It writes code changes and runs nothing of yours whose length could be read."
    map_note: "It writes code changes and runs nothing of yours."
    code_fix_tool: fix_code
    code_agent: true
  - key: factory
    name: Factory
    category: Coding agents
    mark: FA
    color: "#d9480f"
    status_page: { url: https://status.factory.ai, feed: statuspage }
    hosts: [ api.factory.ai, factory.ai ]
    description: Hand a fix's code change to a Factory Droid on your Droid Computer, which writes it and opens the pull request, while Firefight follows the session.
    # Factory's Global deployment and its separate EU one, each with its own API (api.factory.ai, api.eu.factory.ai) and
    # app, from Factory's Deployment Patterns page, EU deployment and data residency.
    regions:
      - { key: global, label: Global (app.factory.ai), site: "https://app.factory.ai" }
      - { key: eu, label: EU (app.eu.factory.ai), site: "https://app.eu.factory.ai" }
    connect_fields:
      - { key: computer, label: Droid Computer, hint: "The name of the Droid Computer the Droid works on, with your repositories cloned on it. A managed computer pushes and opens pull requests through the GitHub integration set up in Factory.", placeholder: "my-computer" }
    kind: native
    connect_with: api_token
    source_links: firefight
    map: none
    history: none
    history_note: "It writes code changes and runs nothing of yours whose length could be read."
    map_note: "It writes code changes and runs nothing of yours."
    code_fix_tool: fix_code
    code_agent: true
  - key: custom_mcp
    name: Custom MCP server
    category: Custom
    mark: MC
    color: "#1f2430"
    description: Point Firefight at any MCP server and allowlist its tools.
    server_url: ""
    # Firefight cannot know which of a team's own tools only read, so an admin marks them on the connection.
    admin_marks_reads: true
    source_links: none
    source_links_note: "A custom server is the team's own, so its results carry whatever links it gives."
    map: none
    history: none
    history_note: "A custom server is the team's own, so Firefight cannot know what its runs look like."
    map_note: "A custom server is the team's own, so Firefight cannot know what it holds."
  # A site Halon's browser logs in to with a test account an admin saved under Settings, Test logins. Each site is one
  # connection, so its password is kept like any credential, encrypted on its row. test_logins keeps it off the gallery
  # and out of the workspace's connections, since it mints no tools and is managed from its own screen.
  - key: website
    name: Website
    category: Websites
    mark: WW
    color: "#2f6f8f"
    description: A test account Halon's browser logs in with when it checks a page, saved per site. The password never reaches Halon.
    kind: native
    connect_with: api_token
    test_logins: true
    connect_fields:
      - { key: site_url, label: Site address, hint: "The address of the site, such as https://shop.example.com.", placeholder: "https://shop.example.com" }
      - { key: login_url, label: Login page, hint: "Where the login form is, when it is not the site's own address.", placeholder: "https://shop.example.com/login", optional: true }
      - { key: username, label: Username, hint: "The test account's username or email address.", placeholder: "halon-test@example.com" }
    source_links: none
    source_links_note: "It keeps a login and answers nothing, so there is no result to link."
    map: none
    map_note: "It keeps a login for a site and holds no infrastructure."
    history: none
    history_note: "It keeps a login and runs nothing whose length could be read."
