  # A coding agent writes a fix's code change in its own environment and opens the pull request itself. code_agent marks
  # one, which writes code changes only once an admin chooses it under Settings, Workspace, instead of Firefight's own.
  - key: devin
    name: Devin
    category: Coding agents
    mark: DV
    color: "#14213d"
    status_page: { url: https://www.devinstatus.com, feed: statuspage }
    hosts: [ api.devin.ai, devin.ai ]
    description: Hand a fix's code change to Devin, which writes it in its own environment and opens the pull request, while Firefight follows the session.
    server_url: ""
    kind: native
    connect_with: api_token
    source_links: firefight
    map: none
    history: none
    history_note: "It writes code changes and runs nothing of yours whose length could be read."
    map_note: "It writes code changes and runs nothing of yours."
    code_fix_tool: fix_code
    code_agent: true
    # Devin names an organization org- followed by its id (Devin's OpenAPI document, the org_id parameter).
    connect_fields:
      - { key: organization, label: Organization ID, hint: "The organization's id, shown at the top of Settings, Devin API in Devin.", placeholder: "org-...", pattern: "org-[A-Za-z0-9_-]+", allowed: "org- followed by letters, numbers, dashes and underscores" }
      - { key: max_acus, label: ACU limit per change, hint: "The most ACUs Devin may use on one change, which Devin enforces. Leave it empty for 5.", numeric: true, default: 5 }
