    description: Read-only queries, data sources, API endpoints, their requests, errors and metrics, and deployments of your Tinybird workspace.
    kind: native
    connect_with: api_token
    # A workspace lives in one of Tinybird's regions, each with its own API host (tinybird.co/docs/api-reference, Regions
