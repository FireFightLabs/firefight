  - key: sentry
    name: Sentry
    category: Observability
    mark: SN
    color: "#362d59"
    status_page: { url: https://status.sentry.io, feed: statuspage }
    hosts: [ sentry.io, ingest.sentry.io, ingest.us.sentry.io, ingest.de.sentry.io ]
    description: Search error issues and releases tied to an incident.
    server_url: https://mcp.sentry.dev/mcp
    # Sentry's server holds a connection to the organization, and optionally the project, its address names. The
    # patterns are Sentry's own slug rules, ORG_SLUG_PATTERN and MIXED_SLUG_PATTERN in getsentry/sentry
    # src/sentry/utils/slug.py, at most 50 characters as DEFAULT_SLUG_MAX_LENGTH says.
    connect_fields:
      - key: organization
        label: Organization
        hint: "The organization's slug, under Settings, General Settings in Sentry, or the name before .sentry.io in its address."
        placeholder: acme
        path: true
        pattern: '(?![0-9]+\z)[A-Za-z0-9][A-Za-z0-9-]{0,49}(?<!-)'
        allowed: "letters, numbers and dashes, at most 50 characters, not starting or ending with a dash and not only numbers"
      - key: project
        label: Project
        hint: "The project's slug, under Settings, Projects. Leave it empty to reach every project, so Halon can ask about each service by its name."
        placeholder: checkout
        path: true
        optional: true
        pattern: '(?![0-9]+\z)[a-z0-9_-]{1,50}'
        allowed: "lowercase letters, numbers, dashes and underscores, at most 50 characters, not only numbers"
    # The tools its server's published list marks as reads (test/fixtures/files/sentry_direct_mcp_tools.txt says where it came from).
    read_only_tools: [find_dropped_events, find_organizations, find_projects, get_sentry_resource, search_errors, search_issues, search_logs,
                      search_metrics, search_profiles, search_replays, search_sentry_tools, search_traces]
    source_links: server
    source_links_note: "Its results carry the page of each issue, search, release and trace they name. A list of releases names each by its short version, which is not always the one its page is under, so a release's page comes from its details."
    map: none
    history: none
    history_note: "It watches what runs elsewhere and keeps no builds or deploys of its own whose length could be read."
    map_note: "It collects errors from what runs elsewhere and runs nothing of its own."
    # What a person reads beside each tool, by the name Firefight gives it (Integrations::ToolSummaries).
    tool_summaries:
      analyze_issue_with_seer: "Asks Seer to find the root cause of a Sentry issue and suggest a fix."
      execute_sentry_tool: "Runs a further Sentry operation, such as creating a monitor or alert."
      find_dropped_events: "Shows events Sentry dropped instead of storing and why."
      find_organizations: "Lists the Sentry organizations this connection can reach."
      find_projects: "Lists the projects in a Sentry organization."
      get_sentry_resource: "Shows a Sentry issue, event, trace or other item from its link."
      search_errors: "Searches error events in Sentry."
      search_issues: "Searches Sentry issues by status, project or text."
      search_logs: "Searches logs sent to Sentry."
      search_metrics: "Searches metrics sent to Sentry."
      search_profiles: "Searches performance profiles in Sentry."
      search_replays: "Searches session replays in Sentry."
      search_sentry_tools: "Finds further Sentry operations, such as monitors, releases and alerts."
      search_traces: "Searches traces and spans in Sentry."
      update_issue: "Resolves, ignores or assigns a Sentry issue."
