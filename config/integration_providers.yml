# Curated integration catalog shown on Configure -> Integrations.
# Providers connect through the generic MCP connector unless kind: native
# marks one as executing through a first-party pack registered in
# Integrations::NativePack (a pack is code; this listing stays config).
# server_url pre-fills the connect flow where an official MCP endpoint is
# known (blank = the admin pastes their own). mark/color drive the logo
# tile until real brand assets land.
# source_links says how a result links back to the page it came from, since a result nobody can check at its source
# is worth little: firefight (a pack or a builder in Integrations::SourceLinks adds the link), server (the provider's
# own results already carry one), none (there is no page) or unchecked (not yet verified against a real connection).
# server and none carry a source_links_note saying why. A new provider is never unchecked.
# map says whether what a provider holds is on the resource map: firefight (a pack's map_of or the map_reader its
# provider definition names puts it there), none (it holds no infrastructure, and map_note says why) or unchecked (it
# may, and no reader exists yet). A new provider that holds infrastructure lands with its reader.
# history says whether Halon can read how long the provider's runs take (its CI runs, builds or deploys, through the
# run_history capability its adapter answers), which a watch learns its time limit from: firefight (its adapter answers
# it) or none (it has no such runs, or does not say when they started and finished, and history_note says why).
# site is the address of the app of a provider that runs in one place, which links open, read through
# Integrations::ConnectionSettings#site.
# regions lists where a provider runs its service when it offers more than one place, such as a US and an EU site. Each
# has a key, a label, its MCP server's server_url, the site its app is at, which links open, and authorization_endpoint
# and token_endpoint only where its OAuth endpoints are not the ones its server names. A provider with regions lists no
# server_url of its own, and the first region is the one a connection that names none reaches. The connect dialog offers
# the choice when there is more than one, and the connection keeps it.
# connect_fields are what the connect form asks for beside the credentials, each with a key, label, hint and placeholder,
# and optionally numeric, optional, path, scope (what the connection reads, such as projects, which holds one, several or
# all the credential can read, listed live from it), and pattern with allowed (the shape a value must have, and in words what that
# allows, which the form says when a value does not fit). None is a secret. A path field is part of the server's
# address, appended in the order listed, such as an organization and then a project, and belongs to the connection. A
# path field without a pattern takes a slug's, so no value carries a slash, a query or a fragment into the address.
# Every other field belongs to the environment it was connected for. The code behind a provider reads them through
# Integrations::ConnectionSettings, never from the row.
# setting_words are words in a service's setting names that point at this provider's stores, such as NEON in
# NEON_DATABASE_URL. The map's matcher reads them as a clue when a setting's value is hidden or names no address a store
# reported.
# Section headings on the gallery, listed in the order the gallery shows them. A provider naming a category that is
# not listed here still renders, it just shows no tagline, so adding a provider in a new category stays a registry edit
# rather than a code change. Each has a tagline, halon (what Halon can do with a tool from it, in a sentence or two,
# which setup shows as it walks through every category), required (setup asks for a connection in it and offers no
# "We don't use this") and in_first_question (setup's first question to Halon names the tools connected in it).
categories:
  Cloud and hosting:
    tagline: Where your apps run, and what you can change there
    halon: Halon sees what runs where, what was deployed and how it is doing. When you allow it, it can make changes there too.
    required: true
    in_first_question: true
  Observability:
    tagline: Logs, metrics, traces and errors for investigations
    halon: Halon searches your logs, metrics, traces and errors to find what broke and when it started.
    required: true
  Alerting and on-call:
    tagline: Who is on call, and the alerts and incidents paging them
    halon: Halon sees which alerts fired and who is on call, so it can say who was paged and why.
  Product analytics:
    tagline: Who an incident reaches, what they saw, and the feature flags behind it
    halon: Halon checks how many people an incident reached, what they saw and which feature flags changed.
  Databases:
    tagline: Your data and how it is set up
    halon: Halon reads how your databases are set up and how they are doing, such as slow queries and connections, to tell when data is the cause.
    in_first_question: true
  Code:
    tagline: Correlate incidents with what shipped
    halon: Halon matches an incident to the commits, pull requests and deploys that shipped just before it. It can also write a fix and open a pull request when you ask.
    required: true
  CI:
    tagline: Builds, tests and their logs, and rerunning them
    halon: Halon reads builds and test runs with their logs, and reruns one when you allow it.
  Coding agents:
    tagline: Agents that write a fix's code change and open the pull request
    halon: Halon hands a fix to your coding agent, which writes the change and opens the pull request.
  Issues:
    tagline: Tickets and follow-up work tied to incidents
    halon: Halon reads the tickets tied to an incident, and when you allow it, files the follow-up work there.
  Knowledge:
    tagline: Runbooks and documentation as context
    halon: Halon reads your runbooks and docs as context while it investigates.
  Custom:
    tagline: Anything with an MCP server
    halon: Halon uses the tools you switch on from any MCP server you connect.

providers:
  - key: github
    name: GitHub
    category: Code
    mark: GH
    color: "#24292f"
    description: Correlate incidents with recent pull requests, commits and GitHub Actions runs from your repositories, read issues, releases, checks and security alerts, and when you allow it, comment on, review, close or merge pull requests, work on issues, and rerun, start or cancel a workflow.
    server_url: ""
    kind: native
    site: https://github.com
    source_links: firefight
    map: firefight
    history: firefight
    code_fix_tool: fix_code
  - key: gitlab
    name: GitLab
    category: Code
    mark: GL
    color: "#fc6d26"
    description: Merge requests, deployments, pipelines and code of your projects, on GitLab.com or your own GitLab, and retry, run or cancel a pipeline when you allow it.
    # GitLab's own MCP server stays available from the connect dialog, and connections made through it keep running.
    server_url: https://gitlab.com/api/v4/mcp
    site: https://gitlab.com
    kind: native
    connect_with: api_token
    connect_fields:
      - key: url
        label: GitLab address
        hint: The address of your own GitLab, such as https://gitlab.example.com. Leave it empty for GitLab.com.
        placeholder: https://gitlab.com
        optional: true
        pattern: "https://[^\\s/?#@]+(/[^\\s?#]*)?"
        allowed: an https address, without a query or credentials
    source_links: firefight
    map: firefight
    history: firefight
  - key: bitbucket
    name: Bitbucket
    category: Code
    mark: BB
    color: "#0052cc"
    description: Pull requests, deployments, pipelines and code of the repositories in your Bitbucket workspaces, and rerun, run or stop a pipeline when you allow it.
    # Atlassian's MCP server reaches Bitbucket only for a workspace linked to an organization, and cannot fetch code.
    server_url: ""
    site: https://bitbucket.org
    kind: native
    connect_with: api_token
    connect_fields:
      - key: workspace
        label: Workspaces
        hint: The Bitbucket workspaces this connection reads, by the id after bitbucket.org/ in their repositories' addresses. Choose one or several, or all this token can read, which takes in a workspace added later at the next sweep.
        placeholder: Choose workspaces
        scope: true
    source_links: firefight
    map: firefight
    history: firefight
  - key: circleci
    name: CircleCI
    category: CI
    mark: CI
    color: "#343434"
    description: Read pipelines, workflows and failing jobs with their logs and tests, and rerun a workflow when you allow it.
    # CircleCI's cloud runs in one place, and its hosted server is the one address its docs give.
    server_url: https://mcp.circleci.com/v1/mcp
    site: https://app.circleci.com
    source_links: firefight
    map: none
    history: none
    history_note: "CircleCI's hosted server documents its tools by name only, not what list_runs answers, so when a run started and finished cannot be read with confidence. The code host that holds the repository answers how long its runs take."
    map_note: "It builds and tests code that its host puts on the map and runs nothing of its own."
  - key: newrelic
    name: New Relic
    category: Observability
    mark: NR
    color: "#1ce783"
    description: Query logs, metrics and traces.
    # New Relic's data centers (docs/accounts/accounts-billing/account-setup/choose-your-data-center), each with the MCP
    # server its setup guide gives (docs/agentic-ai/mcp/setup) and the app address its platform introduction gives.
    regions:
      - { key: us, label: US (one.newrelic.com), server_url: "https://mcp.newrelic.com/mcp/", site: "https://one.newrelic.com" }
      - { key: eu, label: EU (one.eu.newrelic.com), server_url: "https://mcp.eu.newrelic.com/mcp/", site: "https://one.eu.newrelic.com" }
      - { key: jp, label: Japan (one.jp.newrelic.com), server_url: "https://mcp.jp.newrelic.com/mcp/", site: "https://one.jp.newrelic.com" }
    connect_fields:
      - key: account_id
        label: Account ID
        hint: The id of the New Relic account this environment reports to. New Relic lists it in the account picker, or under Administration, Access management, Accounts.
        placeholder: "1234567"
        numeric: true
    source_links: firefight
    map: none
    history: none
    history_note: "It watches what runs elsewhere and keeps no builds or deploys of its own whose length could be read."
    map_note: "It watches what runs elsewhere and runs nothing of its own."
  - key: datadog
    name: Datadog
    category: Observability
    mark: DD
    color: "#632ca6"
    description: Query logs, metrics and monitors.
    # Datadog's sites (docs.datadoghq.com/getting_started/site) with the MCP server each one documents
    # (DataDog/documentation, hugo/assets/scripts/config/regions.config.js, mcp_server_endpoint). US1-FED and US2-FED
    # have no MCP server, so they are not offered.
    regions:
      - { key: us1, label: US1 (app.datadoghq.com), server_url: "https://mcp.datadoghq.com/v1/mcp", site: "https://app.datadoghq.com" }
      - { key: us3, label: US3 (us3.datadoghq.com), server_url: "https://mcp.us3.datadoghq.com/v1/mcp", site: "https://us3.datadoghq.com" }
      - { key: us5, label: US5 (us5.datadoghq.com), server_url: "https://mcp.us5.datadoghq.com/v1/mcp", site: "https://us5.datadoghq.com" }
      - { key: eu1, label: EU1 (app.datadoghq.eu), server_url: "https://mcp.datadoghq.eu/v1/mcp", site: "https://app.datadoghq.eu" }
      - { key: ap1, label: AP1 (ap1.datadoghq.com), server_url: "https://mcp.ap1.datadoghq.com/v1/mcp", site: "https://ap1.datadoghq.com" }
      - { key: ap2, label: AP2 (ap2.datadoghq.com), server_url: "https://mcp.ap2.datadoghq.com/v1/mcp", site: "https://ap2.datadoghq.com" }
      - { key: uk1, label: UK1 (uk1.datadoghq.com), server_url: "https://mcp.uk1.datadoghq.com/v1/mcp", site: "https://uk1.datadoghq.com" }
    source_links: firefight
    map: none
    history: none
    history_note: "It watches what runs elsewhere and keeps no builds or deploys of its own whose length could be read."
    map_note: "It watches what runs elsewhere and runs nothing of its own."
  - key: northflank
    name: Northflank
    category: Cloud and hosting
    mark: NF
    color: "#0aa4d8"
    description: Logs, metrics and builds of the services and databases in your Northflank projects, and fixes applied to them when you allow it.
    server_url: ""
    kind: native
    connect_with: api_token
    site: https://app.northflank.com
    connect_fields:
      - key: project
        label: Projects
        hint: The Northflank projects this environment runs in. Choose one or several, or all this token can read, which takes in a project added later at the next sweep.
        placeholder: Choose projects
        scope: true
    source_links: firefight
    map: firefight
    history: firefight
  - key: grafana
    name: Grafana
    category: Observability
    mark: GF
    color: "#f46800"
    description: Reach dashboards and datasources behind your Grafana.
    server_url: ""
    source_links: firefight
    # Chosen on the connection's details from the datasources its health check found, when Grafana has several of a type.
    connect_fields:
      - { key: logs_datasource, label: Logs datasource, hint: The Loki datasource that holds the logs Halon reads., learned: loki }
      - { key: metrics_datasource, label: Metrics datasource, hint: The Prometheus datasource that holds the metrics Halon reads., learned: prometheus }
      - { key: traces_datasource, label: Traces datasource, hint: The Tempo datasource that holds the traces Halon reads., learned: tempo }
    map: none
    history: none
    history_note: "It watches what runs elsewhere and keeps no builds or deploys of its own whose length could be read."
    map_note: "It watches what runs elsewhere and runs nothing of its own."
  - key: cloudflare
    name: Cloudflare
    category: Cloud and hosting
    mark: CF
    color: "#f38020"
    description: Read traffic, security events, DNS and cache, and block IPs, add rules or purge the cache when you allow it.
    server_url: https://mcp.cloudflare.com/mcp
    # The server marks only execute as a write. search reads the API's own spec and docs reads the documentation.
    read_only_tools: [search, docs]
    source_links: firefight
    map: firefight
    history: firefight
  - key: kubernetes
    name: Kubernetes
    category: Cloud and hosting
    mark: K8
    color: "#326ce5"
    description: Pod logs, current usage, rollout history and events in your cluster's namespaces, and rollbacks, restarts and scaling of workloads when you allow it.
    server_url: ""
    kind: native
    connect_with: api_token
    # Namespace names are DNS labels, as the Kubernetes API reference gives them. * reads every namespace the token can.
    connect_fields:
      - key: server
        label: API server
        hint: The cluster's API server address, as server in your kubeconfig. Firefight reaches it over the internet.
        placeholder: https://cluster.example.com:6443
        pattern: 'https://[A-Za-z0-9.\-\[\]:]+(/[A-Za-z0-9._~%!$&()*+,;=:@\-/]*)?'
        allowed: an https address, such as https://cluster.example.com:6443
      - key: namespaces
        label: Namespaces
        hint: The namespaces this environment reaches, separated by commas, or * for every namespace the token can read.
        placeholder: production, payments
        pattern: '\*|[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\s*,\s*[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*'
        allowed: namespace names separated by commas, or * alone
    source_links: none
    source_links_note: "Kubernetes has no hosted console of its own, and the dashboard a team may run sits at an address Firefight does not know, so each answer names the kubectl command that shows the same."
    map: firefight
    history: none
    history_note: "Kubernetes keeps each rollout's revision and when its ReplicaSet was made, but not when the rollout finished, so no rollout has a length to read."
  - key: modal
    name: Modal
    category: Cloud and hosting
    mark: MD
    color: "#1b1d1a"
    description: Logs, functions and deployment history of your Modal apps, and rolling an app back, rolling over its containers or changing a function's autoscaler when you allow it.
    site: https://modal.com
    server_url: ""
    kind: native
    connect_with: api_token
    source_links: firefight
    map: firefight
    history: none
    history_note: "Modal's app history records when each version went live, not when its deploy started, so no deploy has a length to read."
    connect_fields:
      # The name rule of Modal's client, is_valid_environment_name in modal/_utils/name_utils.py.
      - { key: environment, label: Environment, placeholder: main, optional: true, pattern: '[a-zA-Z0-9][a-zA-Z0-9._-]{1,63}',
          allowed: "letters, numbers, dots, dashes and underscores, starting with a letter or number, at most 64 characters",
          hint: "The Modal environment this connection reads, such as main. Leave it empty for the workspace's default environment." }
  - key: digitalocean
    name: DigitalOcean
    category: Cloud and hosting
    mark: DO
    color: "#0080ff"
    description: Logs, metrics and deployments of App Platform apps, Droplets and managed databases, and rollbacks, restarts and scaling when you allow it.
    site: https://cloud.digitalocean.com
    server_url: ""
    kind: native
    connect_with: api_token
    source_links: firefight
    map: firefight
    history: firefight
  - key: netlify
    name: Netlify
    category: Cloud and hosting
    mark: NL
    color: "#00c7b7"
    description: Deploys and state of your Netlify sites, and rolling a site back to an earlier deploy when you allow it.
    server_url: ""
    kind: native
    connect_with: api_token
    source_links: firefight
    map: firefight
    history: firefight
  - key: convex
    name: Convex
    category: Cloud and hosting
    mark: CX
    color: "#ee342f"
    description: Function logs, errors, pushes and state of a Convex deployment.
    site: https://dashboard.convex.dev
    server_url: ""
    kind: native
    connect_with: api_token
    source_links: firefight
    map: firefight
    history: none
    history_note: "Convex's audit log records each push once, when it was made, with no start and finish to time it by."
    connect_fields:
      - { key: deployment_url, label: Deployment URL, placeholder: "https://happy-animal-123.convex.cloud",
          pattern: 'https://[a-z0-9-]+(\.[a-z0-9-]+)*\.convex\.cloud/?', allowed: "an https address ending in convex.cloud",
          hint: "The deployment's URL, as Settings shows it in the Convex dashboard. It ends in convex.cloud." }
  - key: trigger_dev
    name: Trigger.dev
    category: Cloud and hosting
    mark: TR
    color: "#1a1b1f"
    description: Task runs, logs, errors and deployments of a Trigger.dev environment, and promoting an earlier version when you allow it.
    site: https://cloud.trigger.dev
    server_url: ""
    kind: native
    connect_with: api_token
    source_links: firefight
    map: firefight
    history: firefight
    connect_fields:
      - { key: project, label: Project ref, placeholder: proj_..., pattern: 'proj_[a-z0-9]+', allowed: "proj_ followed by lowercase letters and numbers",
          hint: "The project's ref, starting with proj_, as in your trigger.config.ts. Links to runs use it." }
  - key: aws
    name: AWS
    category: Cloud and hosting
    mark: AWS
    color: "#ff9900"
    description: Logs, metrics, deployments and status of the ECS services, Lambda functions, EC2 instances and RDS databases in an AWS account, and fixes to ECS services and Lambda aliases when you allow it.
    server_url: ""
    kind: native
    connect_with: api_token
    # The commercial regions in AWS's own list (docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions.html),
    # by code and name. China and GovCloud are other partitions, with keys and consoles of their own.
    connect_fields:
      - key: regions
        label: Regions
        hint: The regions this environment runs in. Halon reads only these, including a region that needs opting in once you enable it for the account.
        multiple: true
        options:
          - { value: us-east-1, label: "US East (N. Virginia)" }
          - { value: us-east-2, label: "US East (Ohio)" }
          - { value: us-west-1, label: "US West (N. California)" }
          - { value: us-west-2, label: "US West (Oregon)" }
          - { value: af-south-1, label: "Africa (Cape Town)" }
          - { value: ap-east-1, label: "Asia Pacific (Hong Kong)" }
          - { value: ap-south-2, label: "Asia Pacific (Hyderabad)" }
          - { value: ap-southeast-3, label: "Asia Pacific (Jakarta)" }
          - { value: ap-southeast-5, label: "Asia Pacific (Malaysia)" }
          - { value: ap-southeast-4, label: "Asia Pacific (Melbourne)" }
          - { value: ap-south-1, label: "Asia Pacific (Mumbai)" }
          - { value: ap-southeast-6, label: "Asia Pacific (New Zealand)" }
          - { value: ap-northeast-3, label: "Asia Pacific (Osaka)" }
          - { value: ap-northeast-2, label: "Asia Pacific (Seoul)" }
          - { value: ap-southeast-1, label: "Asia Pacific (Singapore)" }
          - { value: ap-southeast-2, label: "Asia Pacific (Sydney)" }
          - { value: ap-east-2, label: "Asia Pacific (Taipei)" }
          - { value: ap-southeast-7, label: "Asia Pacific (Thailand)" }
          - { value: ap-northeast-1, label: "Asia Pacific (Tokyo)" }
          - { value: ca-central-1, label: "Canada (Central)" }
          - { value: ca-west-1, label: "Canada West (Calgary)" }
          - { value: eu-central-1, label: "Europe (Frankfurt)" }
          - { value: eu-west-1, label: "Europe (Ireland)" }
          - { value: eu-west-2, label: "Europe (London)" }
          - { value: eu-south-1, label: "Europe (Milan)" }
          - { value: eu-west-3, label: "Europe (Paris)" }
          - { value: eu-south-2, label: "Europe (Spain)" }
          - { value: eu-north-1, label: "Europe (Stockholm)" }
          - { value: eu-central-2, label: "Europe (Zurich)" }
          - { value: il-central-1, label: "Israel (Tel Aviv)" }
          - { value: mx-central-1, label: "Mexico (Central)" }
          - { value: me-south-1, label: "Middle East (Bahrain)" }
          - { value: me-central-1, label: "Middle East (UAE)" }
          - { value: sa-east-1, label: "South America (São Paulo)" }
    source_links: firefight
    map: firefight
    history: firefight
  - key: google_cloud
    name: Google Cloud
    category: Cloud and hosting
    mark: GC
    color: "#4285f4"
    description: Logs, metrics, errors and revisions of Cloud Run services, with Cloud SQL, Compute Engine and GKE, across your projects, and rollbacks, restarts and scaling when you allow it.
    server_url: ""
    site: https://console.cloud.google.com
    kind: native
    connect_with: api_token
    # Google's rule for a project id (cloud.google.com/resource-manager/docs/creating-managing-projects).
    connect_fields:
      - { key: project, label: Projects, scope: true, hint: "The Google Cloud projects this environment runs in. Choose one or several, or all this key can read, which takes in a project added later at the next sweep.", placeholder: Choose projects, pattern: "[a-z][a-z0-9-]{4,28}[a-z0-9]", allowed: "6 to 30 lowercase letters, numbers and dashes, starting with a letter and not ending with a dash" }
    source_links: firefight
    map: firefight
    history: firefight
  - key: azure
    name: Azure
    category: Cloud and hosting
    mark: AZ
    color: "#0078d4"
    description: Logs, metrics and deployments of App Service, Functions and Container Apps, with Azure SQL and PostgreSQL, and slot swaps, restarts and scaling when you allow it.
    kind: native
    connect_with: api_token
    # Azure's clouds, each with its own sign-in, Resource Manager and Log Analytics hosts, which Packs::Azure::CLOUDS
    # keeps by key. The portals are the ones Microsoft Entra's national clouds page lists.
    regions:
      - { key: global, label: Global (portal.azure.com), site: "https://portal.azure.com" }
      - { key: us_government, label: US Government (portal.azure.us), site: "https://portal.azure.us" }
      - { key: china, label: "China, operated by 21Vianet (portal.azure.cn)", site: "https://portal.azure.cn" }
    # Microsoft Entra takes a tenant as a GUID or a domain name, and names an application and a subscription by GUID.
    connect_fields:
      - { key: tenant_id, label: Tenant, hint: "The Microsoft Entra tenant the service principal belongs to, by its id or domain, as its app registration's overview shows it.", placeholder: 00000000-0000-0000-0000-000000000000, pattern: "\\h{8}-\\h{4}-\\h{4}-\\h{4}-\\h{12}|[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)+", allowed: "a GUID or a domain such as contoso.onmicrosoft.com" }
      - { key: client_id, label: Client ID, hint: "The service principal's application (client) id.", placeholder: 00000000-0000-0000-0000-000000000000, pattern: "\\h{8}-\\h{4}-\\h{4}-\\h{4}-\\h{12}", allowed: "a GUID such as 00000000-0000-0000-0000-000000000000" }
      - { key: subscription_id, label: Subscriptions, scope: true, hint: "The Azure subscriptions this environment runs in. Choose one or several, or all this service principal can read, which takes in a subscription added later at the next sweep. Halon reads every region in each.", placeholder: Choose subscriptions, pattern: "\\h{8}-\\h{4}-\\h{4}-\\h{4}-\\h{12}", allowed: "a GUID such as 00000000-0000-0000-0000-000000000000" }
    source_links: firefight
    map: firefight
    history: firefight
  - key: vercel
    name: Vercel
    category: Cloud and hosting
    mark: VC
    color: "#000000"
    description: Projects, deployments and their build and runtime logs, and instant rollback or promotion of a deployment when you allow it.
    server_url: ""
    site: https://vercel.com
    kind: native
    connect_with: api_token
    connect_fields:
      - { key: team, label: Teams, placeholder: Choose teams, optional: true, scope: true, hint: "The Vercel teams this environment runs in. Choose one or several, or all this token can reach, which takes in a team joined later at the next sweep. Leave it empty for a token made for one team." }
    source_links: firefight
    map: firefight
    history: firefight
  - key: render
    name: Render
    category: Cloud and hosting
    mark: RE
    color: "#000000"
    description: Logs, metrics, deploys and events of the services and datastores in your Render workspaces, and restarts, rollbacks and scaling when you allow it.
