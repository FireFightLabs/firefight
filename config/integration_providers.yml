  - key: mixpanel
    name: Mixpanel
    category: Product analytics
    mark: MP
    color: "#7856ff"
    status_page: { url: https://www.mixpanelstatus.com, feed: statuspage }
    hosts: [ api.mixpanel.com, api-eu.mixpanel.com ]
    holds_flags: true
    description: How many users an incident reaches, what they did before it, and which feature flags changed, with a flag changed when you allow it.
    # Mixpanel's MCP servers by data residency, from its MCP page (docs.mixpanel.com/docs/mcp, MCP Server URLs), and
    # the app each region's project pages are on, the domains its dynamic client registration names.
    regions:
      - { key: us, label: US (mixpanel.com), server_url: "https://mcp.mixpanel.com/mcp", site: "https://mixpanel.com" }
      - { key: eu, label: EU (eu.mixpanel.com), server_url: "https://mcp-eu.mixpanel.com/mcp", site: "https://eu.mixpanel.com" }
      - { key: in, label: India (in.mixpanel.com), server_url: "https://mcp-in.mixpanel.com/mcp", site: "https://in.mixpanel.com" }
    # Mixpanel's MCP page describes these as reads. Listed so a lookup never asks to be confirmed, whatever the server marks.
    read_only_tools: [run_query, get_query_schema, get_report, display_query, list_dashboards, get_dashboard, get_business_context,
                      get_projects, list_organizations, get_events, list_properties, get_property_values, search_entities, get_issues,
                      get_lexicon_url, find_duplicate_groups, get_custom_property, get_cohort, list_cohorts, describe_cohort_schema,
                      get_lookup_table, get_metric, list_metrics, get_user_replays_data, list_experiments, get_experiment,
                      get_experiment_setup_guidance, get_experiment_results_interpretation_guidance, explain_experiment_health_check,
                      run_experiment_pre_launch_checks, search_prior_experiments, list_feature_flags, get_feature_flag,
                      get_feature_flag_setup_guidance, get_feature_flag_lifecycle_guidance, get_audit_log]
    # A service account is a Mixpanel user for a non-human (docs.mixpanel.com/reference/service-accounts). The MCP server
    # takes it as Bearer Basic <base64 of username:secret>, which Mixpanel marks as beta (docs.mixpanel.com/docs/mcp).
    token: { hint: "Use a service account, from Organization settings, Service Accounts, so the connection is not one person's. Paste Bearer Basic followed by its username:secret in base64, which Mixpanel calls beta." }
    source_links: firefight
    map: none
    history: none
    history_note: "It holds what people do in your product, not builds or deploys."
    map_note: "It holds what people do in your product, not infrastructure."
    mitigation_tools: [update_feature_flag]
