# Where each provider's documentation is read from. ProviderDocsSyncJob reads every source once a day into the docs store
# (provider_doc_pages and their chunks), and Halon reads and searches it there. Nothing here is copied into the
# repository. A source's key names it, and its provider is the key unless it says. Its pages are named by their path
# within the provider, under the source's to: folder when it has one, which is what a skill lists under references.
#
# A source is one of four kinds.
#
# A GitHub repository, read through GitHub's tree and raw files, so a file that did not change is not read again:
#   repository  https://github.com/<owner>/<name>
#   license     the license file's path, read with the pages (optional)
#   notice      the NOTICE file's path, for a license that asks for it to travel with a copy (optional)
#   paths       from => to. A folder reads each page in it into to/ (its subfolders too when recursive is true), and a
#               file reads into the path to names
#   extensions  the pages' extensions in folders, md unless it says (such as [md, mdx]). Each is named .md
#   exclude     paths in the repository to leave out (optional)
#
# A documentation site whose pages are served as markdown:
#   site        the site's address
#   license     the license, in words
#   pages       path => page, each read at page_url
#   page_url    where a page's markdown is, as a format of site and page, %<site>s/%<page>s/index.md unless it says
#
# A documentation site that publishes an index of its markdown pages, such as an llms.txt:
#   index       the index's address
#   under       the address every page listed is read from, and only links under it are read
#   suffix      what each page's address ends with, such as .md
#   license     the license, in words (optional)
#   to          the folder its pages are named under
#
# An API client published on npm, whose endpoints are written out as pages, for a provider whose API reference is
# clearest in its client:
#   package      the package's name
#   license      the license file's path in the package
#   endpoints    the folder the pages go to, where index.md lists every endpoint and a page for each area the detail
#   relative_to  the path the provider's tool writes paths after, such as /v1/projects/{projectId}/
#   leave_out    path parameters whose variant of each path is left out, such as a team scoped copy (optional)
# The client is loaded by script/provider_docs/api_client_endpoints.mjs under Node's permission model, reading only the
# folder it is installed in and writing only the pages, with no environment.
#
# An API's machine-readable description, whose reads are written out as the API reference a provider's general read
# (api_read) is used with, since that tool only reads (ProviderDocs::ApiDescription):
#   api          the description's address, or a list of them for one split over several files, read whole each time
#   format       openapi (OpenAPI 3 or Swagger 2, JSON or YAML), discovery (a Google API Discovery document), botocore
#                (an AWS service's service-2.json) or graphql (a GraphQL schema as introspection writes it)
#   license      the license, in words
#   endpoints    the folder the pages go to, where index.md lists every read by area and a page for each area the detail
#   relative_to  a prefix every path is written after, as the provider's tool takes it, such as /api/v4 (optional)
#   include      only the paths starting with one of these (optional)
#   leave_out    leave out paths holding one of these, such as /watch/ (optional)
#   service      the service's name for an AWS description, as the AWS general read takes it (optional)
# Only an openly licensed description is read. A provider whose description states no open license, such as Render's,
# Bitbucket's or Convex's, has none here, and its API skill sends Halon to the reference on the provider's own site.
planetscale:
  repository: https://github.com/planetscale/database-skills
  license: LICENSE
  paths:
    skills/postgres/references: postgres
    skills/mysql/references: mysql
    skills/vitess/references: vitess

