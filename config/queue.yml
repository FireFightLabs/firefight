default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Dedicated worker for workflows queue
    - queues: workflows
      threads: 5
      processes: <%= ENV.fetch("WORKFLOW_JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    # Dedicated worker for events queue
    - queues: events
      threads: 3
      processes: <%= ENV.fetch("EVENT_JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    # Dedicated worker for webhooks queue
    - queues: webhooks
      threads: 3
      processes: <%= ENV.fetch("WEBHOOK_JOB_CONCURRENCY", 1) %>
      polling_interval: 0.5
    # Investigations run for minutes, so they have their own worker and nothing else picks them up
    - queues: investigations
      threads: 3
      processes: <%= ENV.fetch("INVESTIGATION_JOB_CONCURRENCY", 1) %>
      polling_interval: 0.5
    # A person is waiting on a chat answer, so it never queues behind an investigation
    - queues: conversations
      threads: 3
      processes: <%= ENV.fetch("CONVERSATION_JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    # Everything else, listed by name. A wildcard would also take the long running queues above,
    # and test/config/queue_config_test.rb fails when a job asks for a queue that is not here
    - queues: [ default, background, solid_queue_recurring, events, webhooks, workflows ]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

staging:
  <<: *default

production:
  <<: *default
