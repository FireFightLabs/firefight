# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

development:
  entitlements_sweep:
    class: EntitlementsSweepJob # lets a hosted build's billing run its daily upkeep, such as retention warnings
    queue: background
    schedule: at 4am every day
  ai_account_balance:
    class: AiAccountBalanceJob # reads the balance of AI accounts out of credit, so a refilled one stops reading as out
    queue: background
    schedule: every hour
  ai_account_low_balance:
    class: AiAccountLowBalanceJob # alerts the team when one of the deployment's own AI keys has little left to spend
    queue: background
    schedule: every hour
  workspace_ai_account_recheck:
    class: WorkspaceAiAccountRecheckJob # checks a workspace's own AI accounts set aside for credit or a refused key, so a fixed one is used again
    queue: background
    schedule: every hour
  workspace_ai_account_token_refresh:
    class: WorkspaceAiAccountTokenRefreshJob # refreshes the tokens of AI accounts signed in through OAuth before they expire
    queue: background
    schedule: every 10 minutes
  code_box_sweep:
    class: CodeBoxSweepJob # stops code sandboxes nothing uses any more, so none runs and costs after its run is gone
    queue: background
    schedule: every 10 minutes
  prepared_copy_sweep:
    class: PreparedCopySweepJob # removes what a repository's copy installed once no box used it for a week
    queue: background
    schedule: at 4:20am every day
  integration_health_sweep:
    class: Integrations::HealthCheckSweepJob # probes enabled connections so dead credentials surface before an incident needs them
    schedule: every 30 minutes
  resource_map_sweep:
    class: Integrations::MapSweepJob # reads what each connection reaches onto the resource map
    queue: background
    schedule: every hour
  resource_map_event_poll:
    class: Integrations::MapEventPollJob # reads the change log of each connection whose provider keeps one when it is due, so the map follows it between sweeps
    queue: background
    schedule: every minute
  watch_sweep:
    class: WatchSweepJob # checks each watch Halon keeps about once a minute, until what it follows is done or its time runs out
    queue: background
    schedule: every minute
  pull_request_sweep:
    class: PullRequestSweepJob # reads each pull request Halon opened and still follows, until it is merged or closed
    queue: background
    schedule: every 5 minutes
  resource_map_event_webhook_refresh:
    class: Integrations::MapEventWebhookRefreshJob # extends map change webhooks Firefight registered before their provider lets them lapse
    queue: background
    schedule: at 3:15am every day
  resource_map_event_cleanup:
    class: Integrations::MapEventCleanupJob # drops map change events older than a week, kept only so a second delivery is a no-op
    queue: background
    schedule: at 3:30am every day
  search_document_backfill:
    class: SearchDocumentBackfillJob # indexes for search what has no search row yet, such as everything from before search
    queue: background
    schedule: every hour
  resource_baseline_sweep:
    class: Integrations::BaselineSweepJob # reads a week of metrics into what normal looks like for each resource on the map
    queue: background
    schedule: at 5am every day
  resource_log_pattern_sweep:
    class: Integrations::LogPatternSweepJob # samples a week of logs into the patterns each resource usually prints
    queue: background
    schedule: at 6am every day
  alert_routing_sweep:
    class: Alerts::RoutingSweepJob # retries alerts stuck in routing_state: pending
    queue: events
    schedule: every 2 minutes
  recovery_sweep:
    class: RecoverySweepJob # runs again what a stopped worker left part way, or ends it saying so, so nothing waits on a worker that is gone
    queue: events
    schedule: every minute
  halon_regression_watch:
    class: HalonRegressionWatchJob # replays the latest rated answers the first time a new version of Halon's prompt is deployed
    queue: background
    schedule: every hour
  skill_check:
    class: SkillCheckJob # flags a provider skill that names a tool its provider no longer offers
    queue: background
    schedule: at 4am every day
  provider_docs_sync:
    class: ProviderDocsSyncJob # reads each provider's documentation into the docs store Halon searches, and embeds what changed
    queue: background
    schedule: at 3am every day
  refresh_model_registry:
    class: RefreshModelRegistryJob # pulls model prices and new models into ruby_llm_models, which nothing else updates
    queue: background
    schedule: at 2am every day
  issue_webhook_refresh:
    class: IssueWebhookRefreshJob # extends issue tracker webhooks Firefight registered, which Jira lets lapse after 30 days
    queue: background
    schedule: at 3am every day
  refresh_platform_credentials:
    class: RefreshPlatformCredentialsJob
    schedule: every hour
  platform_call_failure_cleanup:
    class: PlatformCallFailureCleanupJob # drops failed platform calls older than 30 days, kept for the operator console
    queue: background
    schedule: at 3am every day
  workflow_sweeper:
    class: SolidWorkflow::SweeperJob
    queue: workflows
    schedule: every 5 minutes
  workflow_cleanup:
    class: SolidWorkflow::CleanupJob # prunes completed workflows + steps + events older than 30 days
    queue: workflows
    schedule: at 4am every day

