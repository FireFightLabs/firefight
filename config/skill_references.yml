    Kubernetes Authors.
  pages:
    debug/debug-pods.md: tasks/debug/debug-application/debug-pods
    debug/debug-running-pod.md: tasks/debug/debug-application/debug-running-pod
    debug/determine-reason-pod-failure.md: tasks/debug/debug-application/determine-reason-pod-failure
