# Provider guides kept under config/skills/<provider>/references/, copied from the provider's own repository by
# bin/sync-skill-references. Only openly licensed repositories go here, and their license travels with the copy.
planetscale:
  repository: https://github.com/planetscale/database-skills
  license: LICENSE
  paths:
    skills/postgres/references: postgres
    skills/mysql/references: mysql
    skills/vitess/references: vitess

render:
  repository: https://github.com/render-oss/skills
  license: LICENSE
  paths:
    skills/render-debug/references: debug
    skills/render-monitor/references: monitor
    skills/render-postgres/references: postgres
    skills/render-keyvalue/references: keyvalue

# Railway's documentation is MIT licensed. Its pages on deployments, networking troubleshooting and observability back
# the Railway skills.
railway:
  repository: https://github.com/railwayapp/docs
  license: LICENSE
  paths:
    content/docs/deployments: deployments
    content/docs/deployments/troubleshooting: deployments/troubleshooting
    content/docs/networking/troubleshooting: networking
    content/docs/observability: observability

