display_information:
  name: Firefight (Development)
  description: Firefight development environment
  background_color: "#000000"

features:
  bot_user:
    display_name: Firefight Bot
    always_online: false
  slash_commands:
    - command: /firefight
      url: https://ff.bugrewind.com/api/v1/commands
      description: Firefight incident management
      usage_hint: "[subcommand]"
    - command: /ff
      url: https://ff.bugrewind.com/api/v1/commands
      description: Firefight (short alias)
      usage_hint: "[subcommand]"

oauth_config:
  redirect_urls:
    - http://localhost:3000/auth/slack/callback
    - https://ff.bugrewind.com/auth/slack/callback
  scopes:
    user:
      - users:read         # Get user profile info (name, avatar) during OAuth
      - users:read.email   # Get user email for account linking
    bot:
      - team:read          # Get workspace info (name, domain) during installation
      - commands           # Enable slash commands (/firefight, /ff)
      - chat:write         # Post messages to channels (welcome, incident announcements)
      - channels:manage    # Create #incidents channel on installation (FIR-10)
      - channels:join      # Bot can join channels it creates
      - channels:read      # Read channel info (check if #incidents exists)
      - users:read         # Get user info for @mentions in messages
settings:
  interactivity:
    is_enabled: true
    request_url: https://ff.bugrewind.com/api/v1/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: true
