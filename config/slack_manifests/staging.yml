display_information:
  name: Firefight (Staging)
  description: Firefight staging environment
  background_color: "#FFA500"

features:
  bot_user:
    display_name: Firefight Bot (Staging)
    always_online: false
  slash_commands:
    - command: /firefight
      url: https://firefight-staging.up.railway.app/api/v1/commands
      description: "Manage incidents and coordinate response"
      usage_hint: ""
      should_escape: false
    - command: /ff
      url: https://firefight-staging.up.railway.app/api/v1/commands
      description: "Manage incidents (short alias for /firefight)"
      usage_hint: ""
      should_escape: false
  shortcuts:
    - name: "Create an incident"
      type: global
      callback_id: create_incident_shortcut
      description: "Quickly declare a new incident"

oauth_config:
  redirect_urls:
    - https://firefight-staging.up.railway.app/auth/slack/callback
  scopes:
    user:
      - users:read         # Get user profile info (name, avatar) during OAuth
      - users:read.email   # Get user email for account linking
    bot:
      - team:read          # Get workspace info (name, domain) during installation
      - commands           # Enable slash commands (/firefight, /ff)
      - chat:write         # Post messages to channels (welcome, incident announcements)
      - chat:write.public  # Post to public channels without being a member (for sharing)
      - im:write           # Send DMs to users (for sharing via DM)
      - channels:manage    # Create #incidents channel on installation (FIR-10)
      - channels:join      # Bot can join channels it creates
      - channels:read      # Read channel info (check if #incidents exists)
      - users:read         # Get user info for @mentions in messages
      - pins:write         # Pin key messages in incident channels
      - pins:read          # Receive pin events for timeline updates
      - reactions:read     # Receive reaction_added events for action/followup creation
      - channels:history   # Fetch message text from incident channels (conversations.history)
      - groups:history     # Read private incident channel messages/events
      - files:read         # Download shared files for archival

settings:
  event_subscriptions:
    request_url: https://firefight-staging.up.railway.app/api/v1/events
    bot_events:
      - reaction_added
      - message.channels
      - message.groups
      - pin_added
      - pin_removed
  interactivity:
    is_enabled: true
    request_url: https://firefight-staging.up.railway.app/api/v1/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: true
