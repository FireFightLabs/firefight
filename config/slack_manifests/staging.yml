display_information:
  name: Firefight (Staging)
  description: Firefight staging environment
  background_color: "#FFA500"

features:
  bot_user:
    display_name: Firefight Bot (Staging)
    always_online: false
  slash_commands:
    - command: /firefight
      url: https://firefight-staging.up.railway.app/api/v1/commands
      description: Firefight incident management
      usage_hint: "[subcommand]"
    - command: /ff
      url: https://firefight-staging.up.railway.app/api/v1/commands
      description: Firefight (short alias)
      usage_hint: "[subcommand]"
  interactivity:
    is_enabled: true
    request_url: https://firefight-staging.up.railway.app/api/v1/interactions

oauth_config:
  redirect_urls:
    - https://firefight-staging.up.railway.app/auth/slack/callback
  scopes:
    user:
      - users:read
      - users:read.email
    bot:
      - team:read
      - commands
      - chat:write

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: true
