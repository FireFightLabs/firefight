# Outside systems an app commonly depends on that Firefight has no connection for, such as a payment, email or sign-in
# provider. The providers Firefight connects to keep the same two fields in config/integration_providers.yml, and
# Upstream reads both lists as one.
# status_page is the provider's public status page. url is the page a person opens, and feed says how Firefight reads
# it, statuspage for a page that publishes the Statuspage summary at <url>/api/v2/summary.json, or page for one read as
# a web page through Firefight's web reading.
# hosts are the domains the provider's API and apps answer on. An error naming one of them, such as a timeout calling
# api.stripe.com, points at that provider, and a service's setting whose address is one of them says the app uses it.
# setting_words are words in a setting's name that say the app uses the provider, such as STRIPE in STRIPE_SECRET_KEY.
# Each is a whole word in capitals.
# category is one of the categories listed below, which say what kind of system it is.
categories:
  - Payments
  - Email and messaging
  - Sign-in
  - CDN and media
  - Hosting and data
  - AI models
  - Search and product data
  - Packages and certificates
  - Chat and support

upstreams:
  - key: stripe
    name: Stripe
    category: Payments
    status_page: { url: https://status.stripe.com, feed: page }
    hosts: [ api.stripe.com, js.stripe.com, stripe.com ]
    setting_words: [ STRIPE ]
  - key: paypal
    name: PayPal and Braintree
    category: Payments
    status_page: { url: https://www.paypal-status.com, feed: page }
