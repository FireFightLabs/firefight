name: Certificate check
description: Halon looks at the TLS certificates on the domains you run, finds the ones that expire soon or will not renew, and tells the owning team once and again only when it gets worse.
aliases:
- certificates check
trigger:
  kind: schedule
  repeat: days
  days:
  - 1
  at: "09:00"
  time_zone: UTC
  inputs:
  - key: notes
    question: What should Halon look at closely or leave alone?
    private: true
    default: Everything you can read for it.
steps:
- id: step_check
  name: check
  kind: run_skill
  config:
    skill: certificate_expiry
    focus: '{{inputs.notes}}'
- id: step_raise
  name: raise_notices
  kind: for_each
  config:
    items: '{{steps.check.problems}}'
    concurrency: 1
    steps:
    - id: step_notice
      name: notice
      kind: raise_notice
      on_failure: continue
      config:
        signal: certificate
        topic: '{{item.topic}}'
        summary: '{{item.summary}}'
        severity: '{{item.severity}}'
        resource: '{{item.resource}}'
        due_on: '{{item.due_on}}'
    edges: []
edges:
- from: step_check
  to: step_raise
outputs:
  verdict: '{{steps.check.verdict}}'
  problems: '{{steps.check.problems}}'
