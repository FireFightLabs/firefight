name: Certificate check
description: Halon looks at the TLS certificates on the domains you run, finds the ones that expire soon or will not renew, and tells the owning team once and again only when it gets worse.
aliases: [certificates check]
trigger:
  kind: schedule
  repeat: days
  days: [1]
  at: "09:00"
  time_zone: UTC
  inputs:
  - key: notes
    question: What should Halon look at closely or leave alone?
    default: Everything you can read for it.
steps:
- id: step_check
  name: check
  kind: run_skill
  config:
    skill: certificate_expiry
    focus: '{{inputs.notes}}'
- id: step_found
  name: found_problems
  kind: branch
  config:
    routes:
    - route: found
      when:
        left: '{{steps.check.verdict}}'
        operator: equals
        right: problem
    otherwise: all_clear
- id: step_notice
  name: notice
  kind: raise_notice
  config:
    signal: certificate
    topic: Certificates expiring
    summary: '{{steps.check.summary}}'
    severity: '{{steps.check.severity}}'
edges:
- from: step_check
  to: step_found
- from: step_found
  to: step_notice
  route: found
outputs:
  verdict: '{{steps.check.verdict}}'
  summary: '{{steps.check.summary}}'
