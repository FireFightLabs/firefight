name: Error budget check
description: Halon looks at services spending their error budget faster than it lasts, works out the day it runs out, and tells the owning team once and again only when it gets worse.
aliases: [error budget]
trigger:
  kind: schedule
  repeat: days
  days: [0, 1, 2, 3, 4, 5, 6]
  at: "09:00"
  time_zone: UTC
  inputs:
  - key: notes
    question: What should Halon look at closely or leave alone?
    default: Everything you can read for it.
steps:
- id: step_check
  name: check
  kind: run_skill
  config:
    skill: error_budget_burn
    focus: '{{inputs.notes}}'
- id: step_found
  name: found_problems
  kind: branch
  config:
    routes:
    - route: found
      when:
        left: '{{steps.check.verdict}}'
        operator: equals
        right: problem
    otherwise: all_clear
- id: step_notice
  name: notice
  kind: raise_notice
  config:
    signal: error_budget
    topic: Error budget burning
    summary: '{{steps.check.summary}}'
    severity: '{{steps.check.severity}}'
edges:
- from: step_check
  to: step_found
- from: step_found
  to: step_notice
  route: found
outputs:
  verdict: '{{steps.check.verdict}}'
  summary: '{{steps.check.summary}}'
