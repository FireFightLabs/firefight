_fixture:
  model_class: Ability::Action

<% risk_by_action = { "read" => "read", "create" => "write", "update" => "write", "delete" => "destructive" } %>
<% Ability::Action::RESOURCES.each do |resource| %>
<% Ability::Action.actions_for(resource).each do |action| %>
<%= resource %>_<%= action %>:
  kind: system
  key: <%= resource %>.<%= action %>
  risk_level: <%= risk_by_action.fetch(action, "write") %>
  reversible: <%= action == "delete" || Ability::Action::IRREVERSIBLE_KEYS.include?("#{resource}.#{action}") ? "false" : "true" %>
<% end %>
<% end %>
