_fixture:
  model_class: Ability::Grant

# What each service key may do. Grants are the only representation, so this
# file is the source rather than a mirror of anything in api_keys.yml.
<% {
  "full_access_key" => { workspace: "11111111-1111-1111-1111-111111111111",
                         permissions: { "incidents" => %w[read create update], "severities" => %w[read], "statuses" => %w[read], "incident_types" => %w[read], "custom_fields" => %w[read], "catalog" => %w[read create update delete] } },
  "read_only_key" => { workspace: "11111111-1111-1111-1111-111111111111",
                       permissions: { "incidents" => %w[read], "severities" => %w[read], "statuses" => %w[read], "incident_types" => %w[read] } },
  "inactive_key" => { workspace: "11111111-1111-1111-1111-111111111111", permissions: { "incidents" => %w[read create] } },
  "expired_key" => { workspace: "11111111-1111-1111-1111-111111111111", permissions: { "incidents" => %w[read] } },
  "deleted_key" => { workspace: "11111111-1111-1111-1111-111111111111", permissions: { "incidents" => %w[read] } },
  "workspace_two_key" => { workspace: "22222222-2222-2222-2222-222222222222",
                           permissions: { "incidents" => %w[read create], "severities" => %w[read], "statuses" => %w[read] } }
}.each do |key_label, config| %>
<% config[:permissions].each do |resource, actions| %>
<% actions.each do |action| %>
<%= key_label %>_<%= resource %>_<%= action %>:
  workspace_id: <%= config[:workspace] %>
  principal: <%= key_label %> (ApiKey)
  action: <%= resource %>_<%= action %>
<% end %>
<% end %>
<% end %>

# What a workspace grants Firefight's investigator at install (Workspace::AgentDefaults).
<% { "workspace_one" => "11111111-1111-1111-1111-111111111111", "workspace_two" => "22222222-2222-2222-2222-222222222222" }.each do |label, workspace_id| %>
<% %w[map_read memory_create memory_update].each do |action| %>
investigator_<%= action %>_<%= label %>:
  workspace_id: <%= workspace_id %>
  principal_type: SystemAgent
  principal_id: 55555555-5555-5555-5555-555555555555
  action: <%= action %>
<% end %>
<% end %>
