# Incident events for testing

# Workspace One - Incident 1 events
inc1_created:
  incident: active_critical_ws1
  event_type: incident.created
  user_id: aaaaaaaa-1111-aaaa-1111-aaaaaaaaaaaa
  created_at: <%= 2.hours.ago %>
  metadata:
    after:
      name: "Database connection pool exhausted"
      status: "investigating"
      severity: "critical"

inc1_updated:
  incident: active_critical_ws1
  event_type: incident.updated
  user_id: aaaaaaaa-1111-aaaa-1111-aaaaaaaaaaaa
  created_at: <%= 1.5.hours.ago %>
  metadata:
    before:
      name: "Database connection pool exhausted"
      summary: null
    after:
      name: "Database connection pool exhausted"
      summary: "Production database hitting max connections"
    changed_fields: ["summary"]

inc1_lead_assigned:
  incident: active_critical_ws1
  event_type: lead.assigned
  user_id: aaaaaaaa-1111-aaaa-1111-aaaaaaaaaaaa
  created_at: <%= 1.hour.ago %>
  metadata:
    details:
      role: "incident_lead"
      assigned_to: "alice_workspace_one"

