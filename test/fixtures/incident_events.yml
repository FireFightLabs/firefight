# Incident events for testing
# Note: snapshot-style metadata (before/after/changed_fields) lives on the
# linked eventable (IncidentUpdate/IncidentActionUpdate/PostmortemUpdate),
# not on IncidentEvent. The events below carry only action metadata.

# Workspace One - Incident 1 events
inc1_created:
  incident: active_critical_ws1
  event_type: incident.created
  actor_type: WorkspaceMembership
  actor_id: aaaaaaaa-1111-aaaa-1111-aaaaaaaaaaaa
  created_at: <%= 2.hours.ago %>
  metadata: {}

inc1_updated:
  incident: active_critical_ws1
  event_type: incident.updated
  actor_type: WorkspaceMembership
  actor_id: aaaaaaaa-1111-aaaa-1111-aaaaaaaaaaaa
  created_at: <%= 1.5.hours.ago %>
  metadata:
    message: "Production database hitting max connections"

inc1_lead_assigned:
  incident: active_critical_ws1
  event_type: lead.assigned
  actor_type: WorkspaceMembership
  actor_id: aaaaaaaa-1111-aaaa-1111-aaaaaaaaaaaa
  created_at: <%= 1.hour.ago %>
  metadata:
    role: "incident_lead"
    assigned_to: "alice_workspace_one"

# Workspace One - Incident 2 events
inc2_created:
  incident: active_major_ws1
  event_type: incident.created
  actor_type: WorkspaceMembership
  actor_id: bbbbbbbb-1111-bbbb-1111-bbbbbbbbbbbb
  created_at: <%= 1.hour.ago %>
  metadata: {}

# Resolved incident with resolution event
inc3_resolved:
  incident: resolved_minor_ws1
  event_type: incident.resolved
  actor_type: WorkspaceMembership
  actor_id: aaaaaaaa-1111-aaaa-1111-aaaaaaaaaaaa
  created_at: <%= 20.hours.ago %>
  metadata:
    resolution_time: 4
    resolution_notes: "Fixed by restarting upload service"

# Workspace Two - Incident 1 events
ws2_inc1_created:
  incident: active_p0_ws2
  event_type: incident.created
  actor_type: WorkspaceMembership
  actor_id: aaaaaaaa-2222-aaaa-2222-aaaaaaaaaaaa
  created_at: <%= 15.minutes.ago %>
  metadata: {}
