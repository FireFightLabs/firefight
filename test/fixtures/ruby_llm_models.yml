_fixture:
  model_class: RubyLLM::ActiveRecord::Model

# This table is the whole registry once it holds a row, so every model the suite names has to be here.
claude_sonnet:
  model_id: claude-sonnet-4-5
  context_window: 200000
  name: Claude Sonnet 4.5
  provider: anthropic
  capabilities: ["function_calling", "reasoning"]

claude_sonnet_4:
  model_id: claude-sonnet-4
  context_window: 200000
  name: Claude Sonnet 4
  provider: anthropic
  capabilities: ["function_calling", "reasoning"]

claude_haiku:
  model_id: claude-haiku-4-5
  context_window: 200000
  name: Claude Haiku 4.5
  provider: anthropic
  capabilities: ["function_calling", "reasoning"]
  pricing: {"text_tokens": {"standard": {"input_per_million": 1, "output_per_million": 5}}}

gpt_4o:
  model_id: gpt-4o
  context_window: 200000
  name: GPT-4o
  provider: openai
  capabilities: ["function_calling", "streaming"]
  modalities: {"input": ["text", "image", "pdf"], "output": ["text"]}

# Reads text only, for what Halon does with a file its model cannot take.
gpt_35_turbo:
  model_id: gpt-3.5-turbo
  context_window: 16000
  name: GPT-3.5 Turbo
  max_output_tokens: 4096
  provider: openai
  capabilities: ["function_calling"]
  modalities: {"input": ["text"], "output": ["text"]}

gpt_4o_mini:
  model_id: gpt-4o-mini
  context_window: 200000
  name: GPT-4o mini
  provider: openai
  capabilities: ["function_calling", "streaming"]

text_embedding_3_small:
  model_id: text-embedding-3-small
  context_window: 200000
  name: Text Embedding 3 Small
  provider: openai
  capabilities: ["embeddings"]

# What code fixes run on where an Anthropic or OpenRouter key reaches it, priced so a fix's budget can be counted.
claude_opus_5_5:
  model_id: claude-opus-5-5
  context_window: 1000000
  name: Claude Opus 5.5
  provider: anthropic
  capabilities: ["function_calling", "reasoning"]
  pricing: {"text_tokens": {"standard": {"input_per_million": 4, "output_per_million": 20, "cache_read_input_per_million": 0.2, "cache_write_input_per_million": 5}}}

# The same id under another provider at another price, so a price is always read for the provider that served the call.
vertex_claude_opus_5_5:
  model_id: claude-opus-5-5
  context_window: 1000000
  name: Claude Opus 5.5
  provider: vertexai
  capabilities: ["function_calling", "reasoning"]
  pricing: {"text_tokens": {"standard": {"input_per_million": 8, "output_per_million": 40, "cache_read_input_per_million": 0.4}}}

openrouter_claude_opus_5_5:
  model_id: anthropic/claude-opus-5.5
  context_window: 1000000
  name: "Anthropic: Claude Opus 5.5"
  provider: openrouter
  capabilities: ["function_calling", "reasoning"]
  pricing: {"text_tokens": {"standard": {"input_per_million": 4, "output_per_million": 20}}}

# What Halon's loop runs on where an Anthropic or OpenRouter key reaches it, and what OpenRouter carries on with.
claude_sonnet_5_5:
  model_id: claude-sonnet-5-5
  context_window: 1000000
  name: Claude Sonnet 5.5
  provider: anthropic
  capabilities: ["function_calling", "reasoning"]
  pricing: {"text_tokens": {"standard": {"input_per_million": 2, "output_per_million": 10}}}

openrouter_claude_sonnet_5_5:
  model_id: anthropic/claude-sonnet-5.5
  context_window: 1000000
  name: "Anthropic: Claude Sonnet 5.5"
  provider: openrouter
  capabilities: ["function_calling", "reasoning"]
  pricing: {"text_tokens": {"standard": {"input_per_million": 2, "output_per_million": 10}}}

openrouter_glm_5_2:
  model_id: z-ai/glm-5.2
  context_window: 1048576
  name: "Z.ai: GLM 5.2"
  provider: openrouter
  capabilities: ["function_calling", "reasoning"]
  pricing: {"text_tokens": {"standard": {"input_per_million": 1.4, "output_per_million": 4.4}}}

# One id under two providers that take different input, as OpenRouter and Perplexity both list openai/gpt-5.6-luna.
shared_id_reads_images:
  model_id: openai/shared-vision
  context_window: 200000
  name: Shared Vision
  provider: openrouter
  capabilities: ["function_calling"]
  modalities: {"input": ["text", "image", "pdf"], "output": ["text"]}

shared_id_text_only:
  model_id: openai/shared-vision
  context_window: 200000
  name: Shared Vision
  provider: perplexity
  capabilities: []
  modalities: {"input": [], "output": []}

# Bedrock names a model by its own id, so a Bedrock account is checked against this row rather than Anthropic's.
bedrock_claude_sonnet:
  model_id: anthropic.claude-sonnet-4-5-20250929-v1:0
  context_window: 200000
  name: Claude Sonnet 4.5
  provider: bedrock
  capabilities: ["function_calling", "reasoning"]
