// The messages and enums below are copied unchanged, with their names and field numbers, from modal_proto/api.proto
// in https://github.com/modal-labs/modal-client at commit 2bc73c2ba90b95e04a6d777cf38036e9183f300d, keeping only what
// Firefight's Modal integration sends and reads. TaskLogs reserves task_progress rather than copying its type.
// ruby_package is Firefight's own, so the classes live under Integrations::ModalProto rather than a top level Modal. It
// changes no name on the wire.
// Regenerate the Ruby with: protoc --ruby_out=. modal_client.proto (from this folder).

syntax = "proto3";

package modal.client;

option ruby_package = "Integrations::ModalProto";

import "google/protobuf/timestamp.proto";

enum AppState {
  APP_STATE_UNSPECIFIED = 0;

  // Will be discharged when the client disconnects
  APP_STATE_EPHEMERAL = 1;

  APP_STATE_DETACHED = 2;

  // Will be discharged when overwritten
  APP_STATE_DEPLOYED = 3;

  // Winding down app due to user termination.
  APP_STATE_STOPPING = 4;

  // Stopped
  APP_STATE_STOPPED = 5;

  // App is created and in process of deployment.
  APP_STATE_INITIALIZING = 6;

  // Same as stopped but prevented from being garbage collected
  APP_STATE_DISABLED = 7;

  // App is detached and local client has disconnected.
  APP_STATE_DETACHED_DISCONNECTED = 8;

  // App is derived from another workspace. Acts as a static, immutable group of functions.
  APP_STATE_DERIVED = 9 [deprecated=true];
}

enum DeploymentType {
  DEPLOYMENT_TYPE_UNSPECIFIED = 0;
  DEPLOYMENT_TYPE_STANDARD = 1;
  DEPLOYMENT_TYPE_ROLLBACK = 2;
  DEPLOYMENT_TYPE_ROLLOVER = 3;
  DEPLOYMENT_TYPE_PROMOTION = 4;
  DEPLOYMENT_TYPE_STAGED = 5;
}

enum FileDescriptor {
  FILE_DESCRIPTOR_UNSPECIFIED = 0;
  FILE_DESCRIPTOR_STDOUT = 1;
  FILE_DESCRIPTOR_STDERR = 2;
  FILE_DESCRIPTOR_INFO = 3;
}

enum GPUType {
  // Note: this enum is no longer used by current clients - don't add new types
  // Old clients still send it, so we use it server-side for compatibility
  GPU_TYPE_UNSPECIFIED = 0;
  GPU_TYPE_T4 = 1;
  GPU_TYPE_A100 = 2;
  GPU_TYPE_A10G = 3;
  GPU_TYPE_ANY = 4;
  GPU_TYPE_A100_80GB = 8;
  GPU_TYPE_L4 = 9;
  GPU_TYPE_H100 = 10;
  GPU_TYPE_L40S = 11;
  GPU_TYPE_H200 = 12;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_CREATED = 6;
  TASK_STATE_QUEUED = 1;
  TASK_STATE_WORKER_ASSIGNED = 2;
  TASK_STATE_LOADING_IMAGE = 3;
  TASK_STATE_ACTIVE = 4;
  TASK_STATE_COMPLETED = 5;
  TASK_STATE_CREATING_CONTAINER = 7;
  TASK_STATE_IDLE = 8;
  TASK_STATE_PREEMPTIBLE = 9;
  TASK_STATE_PREEMPTED = 10;
  TASK_STATE_LOADING_CHECKPOINT_IMAGE = 11;
}

message AppDeploymentHistory {
  string app_id = 1;
  uint32 version = 2;
  string client_version = 3;
  double deployed_at = 4;
  string deployed_by = 5;
  string deployed_by_avatar_url = 9;
  string tag = 6;
  uint32 rollback_version = 7;
  bool rollback_allowed = 8;
  optional CommitInfo commit_info = 10;
  DeploymentType deployment_type = 11;
}

message AppDeploymentHistoryRequest {
  string app_id = 1;
}

message AppDeploymentHistoryResponse {
  repeated AppDeploymentHistory app_deployment_histories = 1;
  uint32 production_app_version = 2;
}

message AppFetchLogsRequest {
  string app_id = 1;
  google.protobuf.Timestamp since = 2;
  google.protobuf.Timestamp until = 3;
  uint32 limit = 4;
  FileDescriptor source = 5;
  string function_id = 6;
  string function_call_id = 7;
  string task_id = 8;
  string sandbox_id = 9;
  string search_text = 10;
  // Restrict logs to this exact Function ID, including when it is the base Function.
  string parametrized_function_id = 11;
}

message AppFetchLogsResponse {
  repeated TaskLogsBatch batches = 1;
}

message AppGetByDeploymentNameRequest {
  reserved 1; // removed namespace
  string name = 2;
  string environment_name = 4;
}

message AppGetByDeploymentNameResponse {
  string app_id = 1;  // Null when App with requested name is not deployed
  string previous_app_id = 2;  // Populated if App with requested name was recently stopped
  string environment_name = 3;  // Populated because server may resolve default environment
  AppLifecycle lifecycle = 4;  // Lifecycle of current App or recently stopped App
}

message AppGetInfoRequest {
  string app_id = 1;
}

message AppGetInfoResponse {
  message FunctionInfoSummary {
    repeated GPUConfig gpu_config = 1;
    Schedule schedule = 2;
    // True for Web Functions and classes with web methods; false for Servers.
    bool web_function = 3;
    optional bool requires_proxy_auth = 4;
    // True for Sessioned Servers.
    bool is_sessioned = 5;
  }

  AppHandleMetadata info = 1;
  map<string, FunctionInfoSummary> function_info_summaries = 2;
}

message AppGetLifecycleRequest {
  string app_id = 1;
}

message AppGetLifecycleResponse {
  AppLifecycle lifecycle = 1;
}

message AppHandleMetadata {
  string description = 1;
  string app_id = 2;
  string environment_name = 3;
  AppLifecycle lifecycle = 4;
  map<string, string> functions = 5;  // tag -> function id
  map<string, string> servers = 6;  // tag -> function id
}

message AppLifecycle {
  AppState app_state = 1;
  double created_at = 2;
  string created_by = 3;  // User or service user name
  double deployed_at = 4; // Most recent deployment event
  string deployed_by = 5;  // User or service user name
  int32 version = 6;  // Only meaningful when App is deployed
  double stopped_at = 7;  // Unset when App is still running
  string stopped_by = 8;  // User or service user name, null if running or ephemeral App that finished normally
}

message AppListRequest {
  string environment_name = 1;
}

message AppListResponse {
  message AppListItem {
    string app_id = 1;
    string description = 3;
    AppState state = 4;
    double created_at = 5;
    double stopped_at = 6;
    int32 n_running_tasks = 8;
    string name = 10;
    AppHandleMetadata metadata = 11;
  }
  repeated AppListItem apps = 1;
}

message AppRollbackRequest {
  string app_id = 1;
  int32 version = 2;  // signed as we support negative "roll back n versions" requests
}

message AppRollbackResponse {
  string url = 1;
  repeated Warning server_warnings = 3;
  double deployed_at = 4;
}

message AppRolloverRequest {
  string app_id = 1;
}

message AppRolloverResponse {
  string url = 1;
  repeated Warning server_warnings = 3;
  double deployed_at = 4;
}

message AuthTokenGetRequest {
}

message AuthTokenGetResponse {
  string token = 1;
}

message AutoscalerSettings {
  // A collection of user-configurable settings for Function autoscaling
  // These are used for static configuration and for dynamic autoscaler updates

  // Minimum containers when scale-to-zero is not desired; pka "keep_warm" or "warm_pool_size"
  optional uint32 min_containers = 1;
  // Limit on the number of containers that can be running for each Function; pka "concurrency_limit"
  optional uint32 max_containers = 2;
  // Additional container to spin up when Function is active
  optional uint32 buffer_containers = 3;
  // Stabilization window (in seconds) before scaling up; requires sustained demand over this period
  optional uint32 scaleup_window = 4;
  // Maximum amount of time a container can be idle before being scaled down, in seconds; pka "container_idle_timeout"
  optional uint32 scaledown_window = 5;
  reserved 6;
  // Integer-valued target concurrent requests per replica for Flash autoscaling.
  // Superseded by `target_concurrency_float`, which allows non-integer targets.
  optional uint32 target_concurrency = 7; // Deprecated
  // Maximum number of containers that can be scaled down per minute for Flash autoscaling.
  optional uint32 scaledown_rate_limit = 8;
  // Target concurrent requests per replica for Flash autoscaling; may be fractional.
  optional double target_concurrency_float = 9;
}

message CommitInfo {
  string vcs = 1; // Only git is supported for now
  string branch = 2;
  string commit_hash = 3;
  int64 commit_timestamp = 4;
  bool dirty = 5;
  string author_name = 6;
  string author_email = 7;
  string repo_url = 8;
}

message FunctionUpdateSchedulingParamsRequest {
  string function_id = 1;
  uint32 warm_pool_size_override = 2;
  AutoscalerSettings settings = 3;
}

message FunctionUpdateSchedulingParamsResponse {
  AutoscalerSettings current_settings = 1;
}

message GPUConfig {
  GPUType type = 1;  // Deprecated, at some point
  uint32 count = 2;
  string gpu_type = 4;
}

message Schedule {
  message Cron {
    string cron_string = 1;
    string timezone = 2;
  }
  message Period {
    int32 years = 1;
    int32 months = 2;
    int32 weeks = 3;
    int32 days = 4;
    int32 hours = 5;
    int32 minutes = 6;
    float seconds = 7;
  }
  oneof schedule_oneof {
    Cron cron = 1;
    Period period = 2;
  }
}

message TaskListRequest {
  string environment_name = 1;
  string app_id = 2;
}

message TaskListResponse {
  repeated TaskStats tasks = 1;
}

message TaskLogs {
  string data = 1;
  TaskState task_state = 6;
  double timestamp = 7;
  FileDescriptor file_descriptor = 8;
  reserved 9; // task_progress, which Firefight does not read
  string function_call_id = 10;
  string input_id = 11;
  uint64 timestamp_ns = 12 [jstype = JS_STRING];
  string container_id = 13;
  string container_name = 14;
}

message TaskLogsBatch {
  string task_id = 1;
  repeated TaskLogs items = 2;
  string entry_id = 5;
  bool app_done = 10;
  string function_id = 11;
  string input_id = 12;
  string image_id = 13;  // Used for image logs
  bool eof = 14;
  string pty_exec_id = 15;  // Used for interactive functions
  string root_function_id = 16;
  uint32 ttl_days = 17;
  string sandbox_id = 18;
}

message TaskStats {
  string task_id = 1;
  string app_id = 2;
  string app_description = 3;
  double started_at = 4;
  double enqueued_at = 5;
}

message Warning {
  enum WarningType {
    WARNING_TYPE_UNSPECIFIED = 0;
    WARNING_TYPE_CLIENT_DEPRECATION = 1;
    WARNING_TYPE_RESOURCE_LIMIT = 2;
    WARNING_TYPE_FUNCTION_CONFIGURATION = 3;
  }
  WarningType type = 1;
  string message = 2;
}

message WorkspaceNameLookupResponse {
  string workspace_name = 1 [deprecated=true];
  string username = 2;
}
